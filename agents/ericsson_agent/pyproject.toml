[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ericsson-agent"
version = "0.1.0"
description = "A Google ADK A2A forwarding agent with a small web UI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "google-adk[a2a]>=1.28.1,<3",
  "httpx>=0.27,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

