{{- if .Values.appServerPatch.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openshift-lightspeed-config.fullname" . }}-appserver-patch-script
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openshift-lightspeed-config.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
data:
  patch_appserver.py: |-
{{ .Files.Get "files/patch_appserver.py" | indent 4 }}
{{- end }}
