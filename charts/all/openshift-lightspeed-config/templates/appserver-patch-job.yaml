{{- if .Values.appServerPatch.enabled }}
{{- if not .Values.appServerPatch.a2a.keycloakIssuerURL }}
{{- fail "appServerPatch.a2a.keycloakIssuerURL must be set when appServerPatch.enabled is true -- vendor/lightspeed-service's A2A endpoint refuses to start without it (A2A_KEYCLOAK_ISSUER_URL)." }}
{{- end }}
{{- if not .Values.appServerPatch.a2a.clusterId }}
{{- fail "appServerPatch.a2a.clusterId must be set when appServerPatch.enabled is true (A2A_CLUSTER_ID)." }}
{{- end }}
{{- if not .Values.appServerPatch.a2a.rpcUrl }}
{{- fail "appServerPatch.a2a.rpcUrl must be set when appServerPatch.enabled is true (A2A_RPC_URL)." }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "openshift-lightspeed-config.fullname" . }}-appserver-patch-bootstrap
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openshift-lightspeed-config.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openshift-lightspeed-config-appserver-patch
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
{{ include "openshift-lightspeed-config.appServerPatchPodSpec" . | nindent 6 }}
{{- end }}
