{{- if .Values.appServerPatch.enabled }}
{{- /*
keycloakIssuerURL and rpcUrl are derived from global.clusterBaseDomain when not
explicitly set (see _helpers.tpl's effective* helpers); the derivation fails
loud if the anchor is unresolvable, so their old non-empty guards are redundant.
*/}}
{{- if not .Values.appServerPatch.a2a.clusterId }}
{{- fail "appServerPatch.a2a.clusterId must be set when appServerPatch.enabled is true (A2A_CLUSTER_ID)." }}
{{- end }}
{{- if or (not .Values.appServerPatch.operatorSubscriptionName) (not .Values.appServerPatch.operatorDeploymentName) }}
{{- fail "appServerPatch.operatorSubscriptionName and operatorDeploymentName are required: the patch Job must wait for CSV Succeeded and verify the operator is scaled to zero before changing operator-managed resources." }}
{{- end }}
{{- if and (or (eq (include "openshift-lightspeed-config.a2aEnabled" .) "true") (eq (include "openshift-lightspeed-config.a2aTokenExchangeEnabled" .) "true")) (not .Values.appServerPatch.a2a.configMapName) }}
{{- fail "appServerPatch.a2a.configMapName must name the app-server OLS config ConfigMap when A2A or token exchange is enabled; the bridge configures inbound OIDC and a2a.token_exchange_enabled in YAML." }}
{{- end }}
{{- if and (eq (include "openshift-lightspeed-config.a2aTokenExchangeEnabled" .) "true") (eq (include "openshift-lightspeed-config.a2aEnabled" .) "false") }}
{{- fail "appServerPatch.a2a.tokenExchangeEnabled cannot be true when appServerPatch.a2a.enabled is false." }}
{{- end }}
{{- if and .Values.appServerPatch.a2a.configMapName (not .Values.appServerPatch.a2a.configMapKey) }}
{{- fail "appServerPatch.a2a.configMapKey must be set when configMapName is configured." }}
{{- end }}
{{- if eq (include "openshift-lightspeed-config.oidcTrustEnabled" .) "true" }}
{{- if not .Values.appServerPatch.deploymentName }}
{{- fail "appServerPatch.deploymentName is required when appServerPatch.oidcTrust.enabled so CA rotation can restart the app-server." }}
{{- end }}
{{- if not .Values.identity.keycloak.caBundleSync.enabled }}
{{- fail "appServerPatch.oidcTrust.enabled requires identity.keycloak.caBundleSync.enabled so the managed ingress CA Secret is populated." }}
{{- end }}
{{- if or (not .Values.appServerPatch.image.repository) (not .Values.appServerPatch.image.tag) }}
{{- fail "appServerPatch.oidcTrust.enabled requires appServerPatch.image.repository and tag for the a2a-split runner that builds the SSL_CERT_FILE bundle." }}
{{- end }}
{{- if or (not .Values.identity.keycloak.caBundleSecret.name) (not .Values.identity.keycloak.caBundleSecret.key) }}
{{- fail "appServerPatch.oidcTrust requires a synced CA Secret name and key." }}
{{- end }}
{{- if ne (dir .Values.appServerPatch.oidcTrust.secretMountPath) "/etc/certs" }}
{{- fail "appServerPatch.oidcTrust.secretMountPath must be a direct child of /etc/certs for the a2a-split runner's CA discovery." }}
{{- end }}
{{- end }}
{{- if not (hasKey (.Values.global.olsClusters | default dict) .Values.appServerPatch.a2a.clusterId) }}
{{- fail (printf "appServerPatch.a2a.clusterId %q must be a KEY of global.olsClusters (the shared cluster-routing registry) -- it is the X-OLS-Cluster routing id this app-server advertises, and Praxis will reject anything not in that one map. Known keys: %v. Mirror the derive_cluster_id algorithm (f\"{host}:{port}\" with lowercase host and every '.'/':' replaced by '-'); see AGENTS.md." .Values.appServerPatch.a2a.clusterId (keys (.Values.global.olsClusters | default dict))) }}
{{- end }}
{{- /*
VALIDATION-ONLY (I6): re-derive each registry key from its own apiURL and fail
on a mismatch, so a hand-edited global.olsClusters key that drifts from the
derive_cluster_id algorithm is caught at render time (the exact footgun AGENTS.md
calls out, where acme-agent crash-loops and Praxis/Envoy rejects a dotted
cluster name). This is the single Helm id derivation in the whole pattern, used
only to validate -- acme/praxis consume the authored key, they never derive it.
*/}}
{{- range $id, $cfg := (.Values.global.olsClusters | default dict) }}
{{- if $cfg.apiURL }}
{{- $expected := include "openshift-lightspeed-config.deriveClusterId" $cfg.apiURL }}
{{- if gt (len $expected) 63 }}
{{- /*
derive_cluster_id truncates to 63 chars and appends a SHA-256 suffix once the
"host-port" base would exceed the DNS label limit (see
acme_agent.cluster_registry). That branch is impractical to reproduce faithfully
in Helm, so for long hosts validate the authored key's shape only -- it must be a
DNS-safe label of at most 63 chars -- and defer the exact value to the single
generator (acme_agent). This prevents a correctly-truncated key from being
falsely rejected at render time.
*/}}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $id) }}
{{- fail (printf "global.olsClusters key %q is not a DNS-safe label. For this long apiURL %q, derive it with acme_agent.cluster_registry.derive_cluster_id (truncated host:port + SHA-256 suffix, <=63 chars); see AGENTS.md." $id $cfg.apiURL) }}
{{- end }}
{{- if gt (len $id) 63 }}
{{- fail (printf "global.olsClusters key %q exceeds 63 characters. Derive it with acme_agent.cluster_registry.derive_cluster_id (it truncates and appends a SHA-256 suffix); see AGENTS.md." $id) }}
{{- end }}
{{- else if ne $id $expected }}
{{- fail (printf "global.olsClusters key %q does not match the id derived from its apiURL %q (expected %q). The key must equal derive_cluster_id: f\"{host}:{port}\" with lowercase host and every '.'/':' replaced by '-' (see AGENTS.md). A drifted key makes acme-agent crash-loop and Praxis/Envoy reject the cluster name." $id $cfg.apiURL $expected) }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "openshift-lightspeed-config.fullname" . }}-appserver-patch-bootstrap
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openshift-lightspeed-config.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  # Must exceed the provisioning wait, CSV-Succeeded wait, verified scale-down
  # wait, and app-server deployment polling budget in appServerPatch.poll.*.
  activeDeadlineSeconds: {{ .Values.appServerPatch.jobActiveDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openshift-lightspeed-config-appserver-patch
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # Without this, changing files/patch_appserver.py's content alone
        # (the script is mounted from a ConfigMap this Job references, not
        # inlined in this Job's own spec) doesn't change this Job's own
        # rendered manifest at all -- confirmed live, ArgoCD did not
        # re-trigger this Sync hook on a sync where only the script content
        # changed, even on an explicit forced sync. Same pattern as
        # charts/all/praxis-proxy/templates/deployment.yaml's checksum/config.
        checksum/config: {{ include (print $.Template.BasePath "/appserver-patch-script.yaml") . | sha256sum }}
    spec:
{{ include "openshift-lightspeed-config.appServerPatchPodSpec" . | nindent 6 }}
{{- end }}
