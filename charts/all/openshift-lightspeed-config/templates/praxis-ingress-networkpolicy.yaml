{{- if and .Values.olsConfig.enabled .Values.olsConfig.a2a.enabled .Values.praxisIngress.enabled }}
# Add an explicit Praxis-to-OLS Service allowance. This is additive with the
# operator-owned app-server policy and does not create an external Route.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: praxis-to-lightspeed-a2a
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: application-server
      app.kubernetes.io/managed-by: lightspeed-operator
      app.kubernetes.io/name: lightspeed-service-api
      app.kubernetes.io/part-of: openshift-lightspeed
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.praxisIngress.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.praxisIngress.podSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8443
{{- end }}
