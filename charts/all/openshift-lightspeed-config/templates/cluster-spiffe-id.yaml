{{- if .Values.identity.clusterSpiffeID.enabled }}
{{- /*
trustDomain is derived from global.clusterBaseDomain (apps.<base>) when not
explicitly set -- see _helpers.tpl's effectiveTrustDomain; the derivation fails
loud if the anchor is unresolvable, replacing the old non-empty guard.
*/}}
# Registers the *operator-created* app-server ServiceAccount
# (lightspeed-app-server) for a SPIFFE JWT-SVID. This chart does not create
# that ServiceAccount; podSelector uses appServer.podSelectorLabels, which
# are CONFIRMED live against lightspeed-operator app-server pods (and match
# ClusterSPIFFEID/ols-app-server on the reference deployment).
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: {{ .Values.identity.clusterSpiffeID.name }}
spec:
  spiffeIDTemplate: "spiffe://{{ include "openshift-lightspeed-config.effectiveTrustDomain" . }}/ns/{{ .Values.namespace }}/sa/{{ .Values.identity.clusterSpiffeID.serviceAccountName }}"
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: {{ .Values.namespace }}
  podSelector:
    matchLabels:
      {{- include "openshift-lightspeed-config.appServerSelectorLabels" . | nindent 6 }}
  jwtTtl: "300s"
{{- end }}
