{{- if .Values.identity.keycloak.caBundleSync.enabled }}
{{- if and (eq (include "openshift-lightspeed-config.oidcTrustEnabled" .) "true") (not .Values.appServerPatch.enabled) }}
{{- fail "appServerPatch.oidcTrust.enabled requires appServerPatch.enabled so the CA bundle is mounted into the app-server." }}
{{- end }}
{{- if not .Values.identity.keycloak.caBundleSecret.name }}
{{- fail "identity.keycloak.caBundleSecret.name is required when caBundleSync.enabled is true" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openshift-lightspeed-config.fullname" . }}-keycloak-ca-sync
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openshift-lightspeed-config.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "openshift-lightspeed-config.fullname" . }}-keycloak-ca-sync
  namespace: {{ .Values.identity.keycloak.caBundleSync.sourceNamespace }}
  labels:
    {{- include "openshift-lightspeed-config.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - {{ .Values.identity.keycloak.caBundleSync.sourceConfigMap | quote }}
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "openshift-lightspeed-config.fullname" . }}-keycloak-ca-sync
  namespace: {{ .Values.identity.keycloak.caBundleSync.sourceNamespace }}
  labels:
    {{- include "openshift-lightspeed-config.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
subjects:
  - kind: ServiceAccount
    name: {{ include "openshift-lightspeed-config.fullname" . }}-keycloak-ca-sync
    namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "openshift-lightspeed-config.fullname" . }}-keycloak-ca-sync
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "openshift-lightspeed-config.fullname" . }}-keycloak-ca-sync
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openshift-lightspeed-config.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - {{ .Values.identity.keycloak.caBundleSecret.name | quote }}
    verbs:
      - get
      - patch
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  {{- if and .Values.appServerPatch.enabled (eq (include "openshift-lightspeed-config.oidcTrustEnabled" .) "true") }}
  # The runner reads and patches only the operator-managed app-server Deployment
  # to stamp a bundle hash after a CA rotation. Keep access pinned to that name.
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - {{ .Values.appServerPatch.deploymentName | quote }}
    verbs:
      - get
      - patch
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "openshift-lightspeed-config.fullname" . }}-keycloak-ca-sync
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openshift-lightspeed-config.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
subjects:
  - kind: ServiceAccount
    name: {{ include "openshift-lightspeed-config.fullname" . }}-keycloak-ca-sync
    namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "openshift-lightspeed-config.fullname" . }}-keycloak-ca-sync
{{- end }}
