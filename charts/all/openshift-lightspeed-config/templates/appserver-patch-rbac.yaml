{{- if .Values.appServerPatch.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openshift-lightspeed-config.fullname" . }}-appserver-patch
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openshift-lightspeed-config.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "openshift-lightspeed-config.fullname" . }}-appserver-patch
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openshift-lightspeed-config.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - {{ .Values.appServerPatch.deploymentName | quote }}
    verbs:
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "openshift-lightspeed-config.fullname" . }}-appserver-patch
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openshift-lightspeed-config.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
subjects:
  - kind: ServiceAccount
    name: {{ include "openshift-lightspeed-config.fullname" . }}-appserver-patch
    namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "openshift-lightspeed-config.fullname" . }}-appserver-patch
{{- end }}
