{{- if and .Values.olsConfig.enabled .Values.keycloakCA.externalSecret.enabled }}
{{- if and .Values.olsConfig.mcpServerSecurity.enabled (ne .Values.keycloakCA.externalSecret.targetKey .Values.olsConfig.mcpServerSecurity.caSecretKey) }}
{{- fail "keycloakCA.externalSecret.targetKey must match olsConfig.mcpServerSecurity.caSecretKey" }}
{{- end }}
{{- if and .Values.olsConfig.mcpServerSecurity.enabled (ne .Values.keycloakCA.externalSecret.targetSecretName .Values.olsConfig.mcpServerSecurity.caSecretName) }}
{{- fail "keycloakCA.externalSecret.targetSecretName must match olsConfig.mcpServerSecurity.caSecretName" }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.keycloakCA.externalSecret.name | quote }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.keycloakCA.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.secretStore.name | quote }}
    kind: {{ .Values.secretStore.kind | quote }}
  target:
    name: {{ .Values.keycloakCA.externalSecret.targetSecretName | quote }}
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: {{ .Values.keycloakCA.externalSecret.targetKey | quote }}
      remoteRef:
        key: {{ .Values.keycloakCA.externalSecret.vaultKey | quote }}
        property: {{ .Values.keycloakCA.externalSecret.vaultProperty | quote }}
{{- end }}
