{{- if and .Values.olsConfig.enabled .Values.vertexCredentials.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.vertexCredentials.externalSecret.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.vertexCredentials.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.secretStore.name | quote }}
    kind: {{ .Values.secretStore.kind | quote }}
  target:
    name: {{ .Values.olsConfig.credentialsSecretName | quote }}
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: {{ .Values.vertexCredentials.externalSecret.targetKey | quote }}
      remoteRef:
        key: {{ .Values.vertexCredentials.externalSecret.vaultKey | quote }}
        property: {{ .Values.vertexCredentials.externalSecret.vaultProperty | quote }}
{{- end }}
