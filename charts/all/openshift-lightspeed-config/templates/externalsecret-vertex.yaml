apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.llm.vertex.credentialsSecretName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openshift-lightspeed-config.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.secretStore.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: {{ .Values.llm.vertex.credentialsSecretName }}
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # OLSConfig.spec.llm.providers[].credentialKey for this provider (see
        # templates/olsconfig.yaml) must match this key exactly.
        {{ .Values.llm.vertex.credentialKey }}: "{{ `{{ .credentials }}` }}"
  data:
    # Reads the same Google ADC JSON this pattern has always used for
    # Gemini-on-Vertex, landing in its own Secret/key (see values.yaml).
    - secretKey: credentials
      remoteRef:
        key: {{ .Values.llm.vertex.vaultKey }}
        property: {{ .Values.llm.vertex.vaultProperty }}
