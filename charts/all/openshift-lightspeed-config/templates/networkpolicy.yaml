{{- if .Values.networkPolicy.enabled }}
# Restricts ingress to the operator-managed Lightspeed app-server pods to
# same-namespace traffic and the Praxis gateway.
#
# podSelector labels (appServer.podSelectorLabels) are CONFIRMED live against
# lightspeed-operator app-server pods -- this policy does select the real
# pods (not a silent no-op). Re-check after operator upgrades that change
# labeling.
#
# IMPORTANT: the operator also creates NetworkPolicy/lightspeed-app-server
# for the same pods, allowing ingress from openshift-monitoring,
# openshift-console, and pods in namespaces labeled
# network.openshift.io/policy-group=ingress (cluster ingress controllers).
# NetworkPolicies targeting the same pods are additive (OR'd), so this
# chart policy CANNOT narrow those operator-granted paths. Treat this as
# defence-in-depth that adds an explicit Praxis allow, not as sole edge
# lockdown.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "openshift-lightspeed-config.fullname" . }}-app-server
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openshift-lightspeed-config.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "openshift-lightspeed-config.appServerSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.praxisPodSelector | nindent 14 }}
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.praxisNamespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.port }}
{{- end }}
