# Matches docker-compose `mas-api`: ROLE=serve, port 8002, same image as mas-worker.

global:
  # Shared pattern anchors used to derive the Keycloak issuer when the
  # Keycloak validator is selected. Empty defaults keep the chart generic.
  clusterBaseDomain: ""
  localClusterDomain: ""
  keycloakRealm: ""

fullnameOverride: mas-api

image:
  registry: ""
  repository: quay.io/redhat-services-prod/mas-tenant/mas-api
  tag: latest
  # When set, image.digest takes precedence over image.tag.
  digest: ""
  pullPolicy: Always

imagePullSecrets: []

replicaCount: 1

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8002

api:
  port: "8002"
  gunicornWorkers: "4"
  gunicornThreads: "1"
  gunicornTimeout: "420"

mongo:
  secretName: mao-secret-mongo
  tls: "false"
  database: unifaidb

redis:
#  secretName: in-memory-db
  secretName: mao-secret-redis

temporal:
  host: temporal
  port: "7233"
  namespace: default

identity:
  # The Pattern can override this to prod and provide the SSO settings below.
  # dev is useful for an out-of-the-box installation and must not be used for
  # an internet-facing deployment.
  providerMode: dev
  ssoIssuerUri: "https://sso.stage.redhat.com/auth/realms/redhat-external"
  ssoAudience: ""
  # Optional explicit Keycloak/OIDC validator settings. When providerMode is
  # keycloak, issuer derives from global.clusterBaseDomain/localClusterDomain
  # plus global.keycloakRealm if this override is empty.
  keycloakIssuerUri: ""
  keycloakJwksUri: ""
  keycloakAudience: ""
  keycloakVerifySsl: true
  keycloakTimeout: 30
  # Extend outbound HTTPS trust for private-CA-signed Routes (e.g. Keycloak or
  # Praxis/OLS). The ConfigMap is published by keycloak-oidc's
  # openshiftOIDC.caBundleSync when configured for this namespace. This works
  # independently of identity.providerMode and never disables TLS verification.
  keycloakCaTrust:
    enabled: false
    configMapName: keycloak-oidc-ca
    configMapKey: ca-bundle.crt
    publicBundlePath: ""
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
  adminAllowedUsers: '[]'

langfuse:
  enabled: "false"
  secretName: mao-secret-langfuse

sharedStorage:
  mountPath: /app/shared
  existingClaim: ""

# HTTP — Route is the OpenShift equivalent of compose publishing 8002.
# The old OpenShift template left this disabled on the public cluster; set enabled: false if needed.
route:
  enabled: true
  host: ""
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

livenessProbe:
  httpGet:
    path: /api/health/
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/health/
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /api/health/
    port: http
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 30

nodeSelector: {}
tolerations: []
affinity: {}

# Fernet keys (RUN_CREDENTIAL_KEYS, a JSON array, newest first) that seal the
# caller's credentials between the A2A/API submitter and the Temporal workers.
# mas-api, mas-worker and mas-a2a must read the same keys. Generate one with:
#   python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())'
# and store '["<key>"]' in Vault (see values-secret.yaml.template).
runCredentials:
  # Secret with key RUN_CREDENTIAL_KEYS. Required: MAS refuses to start without
  # it. Each chart uses its own Secret name (all three deploy into one
  # namespace); vault.key makes them all hold the same keys.
  secretName: mas-api-run-credentials
  vault:
    # Create secretName from Vault through an ExternalSecret.
    enabled: true
    key: secret/data/global/mao-run-credentials
    property: keys

# Durable approval mailbox shared by mas-api, mas-worker and mas-a2a.
hitl:
  approvalCollection: hitl_approvals

secretStore:
  name: vault-backend
  kind: ClusterSecretStore
  refreshInterval: 2m0s
