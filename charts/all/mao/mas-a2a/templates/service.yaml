{{- if .Values.a2a.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mas-a2a.fullname" . }}
  labels:
    {{- include "mas-a2a.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "mas-a2a.selectorLabels" . | nindent 4 }}
{{- end }}
