{{- if and .Values.a2a.enabled (eq (len .Values.a2a.allowedPrincipalsSecretName) 0) (gt (len .Values.a2a.allowedPrincipals) 0) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mas-a2a.fullname" . }}-a2a-auth
  labels:
    {{- include "mas-a2a.labels" . | nindent 4 }}
type: Opaque
stringData:
  A2A_ALLOWED_PRINCIPALS: {{ .Values.a2a.allowedPrincipals | toJson | quote }}
{{- end }}
