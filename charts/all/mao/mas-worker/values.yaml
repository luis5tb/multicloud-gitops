# Matches docker-compose `mas-worker`: same image as mas-api, ROLE=temporal-worker, no ports.

global:
  # Shared pattern anchors used to derive the Keycloak issuer when the
  # Keycloak validator is selected. Empty defaults keep the chart generic.
  clusterBaseDomain: ""
  localClusterDomain: ""
  keycloakRealm: ""

fullnameOverride: mas-worker

# Python log level for the worker process (LOG_LEVEL env). INFO by default;
# set to DEBUG via values-standalone to capture the orchestrator's planning
# LLM request/response when diagnosing delegation/empty-answer issues.
logLevel: INFO

image:
  registry: ""
  repository: quay.io/redhat-services-prod/mas-tenant/mas-api
  tag: latest
  # When set, image.digest takes precedence over image.tag.
  digest: ""
  pullPolicy: Always

imagePullSecrets: []

replicaCount: 1

serviceAccount:
  create: true
  # Token needed for oc_exec tool inside the worker.
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

worker:
  threads: "10"

mongo:
  secretName: mao-secret-mongo
  tls: "false"
  database: unifaidb

redis:
#  secretName: in-memory-db
  secretName: mao-secret-redis

temporal:
  host: temporal
  port: "7233"
  namespace: default

identity:
  # The Pattern can override this to prod and provide the SSO settings below.
  providerMode: dev
  ssoIssuerUri: "https://sso.stage.redhat.com/auth/realms/redhat-external"
  ssoAudience: ""
  # The worker initializes the same AppContainer/token validator as the API;
  # keep these aligned with the API and inbound A2A deployments when using
  # Keycloak mode.
  keycloakIssuerUri: ""
  keycloakJwksUri: ""
  keycloakAudience: ""
  keycloakVerifySsl: true
  keycloakTimeout: 30
  # Opt in only when the Keycloak Route certificate chains to a private CA
  # absent from this image's system trust bundle. The ConfigMap is published
  # by keycloak-oidc's openshiftOIDC.caBundleSync when configured for this ns.
  keycloakCaTrust:
    enabled: false
    configMapName: keycloak-oidc-ca
    configMapKey: ca-bundle.crt
    publicBundlePath: ""
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
  adminAllowedUsers: '[]'

langfuse:
  enabled: "false"
  secretName: mao-secret-langfuse

sharedStorage:
  mountPath: /app/shared
  existingClaim: ""

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

livenessProbe:
  exec:
    command: ["pgrep", "-f", "temporal-worker"]
  initialDelaySeconds: 20
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  exec:
    command: ["pgrep", "-f", "temporal-worker"]
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
