{{- if .Values.vertexCreds.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.vertexCreds.secretName }}
  labels:
    {{- include "mas-worker.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.secretStore.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: {{ .Values.vertexCreds.secretName }}
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # Mounted as this filename; GOOGLE_APPLICATION_CREDENTIALS points at it.
        {{ .Values.vertexCreds.credentialKey }}: "{{ `{{ .credentials }}` }}"
  data:
    # Same Google ADC JSON the openshift-lightspeed-config chart uses for
    # Gemini-on-Vertex (ADC "authorized_user" credentials; google.auth refreshes
    # it). Landing in this chart's own Secret/key in the mao namespace.
    - secretKey: credentials
      remoteRef:
        key: {{ .Values.vertexCreds.vaultKey }}
        property: {{ .Values.vertexCreds.vaultProperty }}
{{- end }}
