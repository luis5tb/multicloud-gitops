{{- if and .Values.runCredentials.secretName .Values.runCredentials.vault.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.runCredentials.secretName }}
  labels:
    {{- include "mas-worker.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.secretStore.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: {{ .Values.runCredentials.secretName }}
    creationPolicy: Owner
  data:
    # JSON array of Fernet keys, newest first. mas-api, mas-worker and mas-a2a
    # all read the same Vault entry so every submitter and worker agrees.
    - secretKey: RUN_CREDENTIAL_KEYS
      remoteRef:
        key: {{ .Values.runCredentials.vault.key }}
        property: {{ .Values.runCredentials.vault.property }}
{{- end }}
