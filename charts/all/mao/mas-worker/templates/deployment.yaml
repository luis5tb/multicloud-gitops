{{- if not .Values.runCredentials.secretName }}
{{- fail "runCredentials.secretName must name the Secret holding RUN_CREDENTIAL_KEYS (shared with the other MAS charts); MAS refuses to start without it" }}
{{- end }}
{{- if eq .Values.identity.providerMode "keycloak" }}
{{- if not (include "mas-worker.keycloakIssuerUri" .) }}
{{- fail "identity.keycloakIssuerUri or global.clusterBaseDomain/global.keycloakRealm is required when identity.providerMode=keycloak" }}
{{- end }}
{{- $hasKeycloakAudience := false }}
{{- range $audience := splitList "," (.Values.identity.keycloakAudience | default "") }}
{{- if trim $audience }}{{- $hasKeycloakAudience = true }}{{- end }}
{{- end }}
{{- if not $hasKeycloakAudience }}
{{- fail "identity.keycloakAudience must contain at least one non-empty audience when identity.providerMode=keycloak" }}
{{- end }}
{{- end }}
{{- if .Values.identity.keycloakCaTrust.enabled }}
{{- if and (eq .Values.identity.providerMode "keycloak") (not .Values.identity.keycloakVerifySsl) }}
{{- fail "identity.keycloakCaTrust.enabled requires identity.keycloakVerifySsl=true" }}
{{- end }}
{{- if or (not .Values.identity.keycloakCaTrust.configMapName) (not .Values.identity.keycloakCaTrust.configMapKey) }}
{{- fail "identity.keycloakCaTrust.configMapName and configMapKey are required when Keycloak CA trust is enabled" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mas-worker.fullname" . }}
  labels:
    {{- include "mas-worker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mas-worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "mas-worker.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "mas-worker.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.identity.keycloakCaTrust.enabled }}
      initContainers:
        - name: build-keycloak-ca-bundle
          image: {{ include "mas-worker.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python3", "-B", "-c"]
          args:
            - |
              import os, ssl, sys
              from pathlib import Path
              output = Path("/var/run/mas-keycloak-trust/ca-bundle.crt")
              private_ca = Path("/var/run/mas-keycloak-ca/ca-bundle.crt")
              candidates = [
                  os.environ.get("PUBLIC_CA_BUNDLE", ""),
                  ssl.get_default_verify_paths().cafile or "",
                  "/etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem",
                  "/etc/pki/tls/certs/ca-bundle.crt",
                  "/etc/pki/tls/cert.pem",
                  "/etc/ssl/certs/ca-certificates.crt",
                  "/etc/ssl/cert.pem",
              ]
              try:
                  import certifi
                  candidates.append(certifi.where())
              except ImportError:
                  pass
              public_path = next((Path(p) for p in candidates if p and Path(p).is_file() and Path(p).stat().st_size), None)
              if public_path is None:
                  sys.exit("no existing public/system CA bundle found; refusing private-CA-only trust")
              if not private_ca.is_file() or not private_ca.stat().st_size:
                  sys.exit("mounted Keycloak CA bundle is missing or empty")
              public_data = public_path.read_bytes()
              private_data = private_ca.read_bytes()
              if b"-----BEGIN CERTIFICATE-----" not in public_data or b"-----BEGIN CERTIFICATE-----" not in private_data:
                  sys.exit("public or Keycloak CA bundle contains no PEM certificates")
              context = ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT)
              context.load_verify_locations(cafile=str(public_path))
              context.load_verify_locations(cafile=str(private_ca))
              if not context.cert_store_stats().get("x509_ca", 0):
                  sys.exit("CA bundle validation produced no trusted CA certificates")
              output.write_bytes(public_data.rstrip() + b"\n" + private_data.lstrip())
          env:
            - name: PUBLIC_CA_BUNDLE
              value: {{ .Values.identity.keycloakCaTrust.publicBundlePath | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.identity.keycloakCaTrust.resources | nindent 12 }}
          volumeMounts:
            - name: keycloak-ca-trust
              mountPath: /var/run/mas-keycloak-trust
            - name: keycloak-ca
              mountPath: /var/run/mas-keycloak-ca
              readOnly: true
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "mas-worker.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: ROLE
              value: temporal-worker
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            {{- if .Values.vertexCreds.enabled }}
            # google-genai's Vertex client (vertexai=true) authenticates via
            # Application Default Credentials read from this file.
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: {{ printf "%s/%s" .Values.vertexCreds.mountPath .Values.vertexCreds.credentialKey | quote }}
            {{- end }}
            - name: WORKER_THREADS
              value: {{ .Values.worker.threads | quote }}
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongo.secretName }}
                  key: db.uri
                  optional: true
            - name: MONGODB_IP
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongo.secretName }}
                  key: db.host
            - name: MONGODB_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongo.secretName }}
                  key: db.port
            - name: MONGODB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongo.secretName }}
                  key: db.username
                  optional: true
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongo.secretName }}
                  key: db.password
                  optional: true
            - name: MONGODB_TLS
              value: {{ .Values.mongo.tls | quote }}
            - name: MONGO_DB
              value: {{ .Values.mongo.database | quote }}
            # Fernet keys sealing caller credentials between the submitter
            # (API/A2A) and the Temporal workers; identical in all MAS charts.
            - name: RUN_CREDENTIAL_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runCredentials.secretName }}
                  key: RUN_CREDENTIAL_KEYS
            - name: HITL_APPROVAL_COLL
              value: {{ .Values.hitl.approvalCollection | quote }}
            - name: CREDENTIAL_RENEWAL_COLL
              value: {{ .Values.credentialRenewal.collection | quote }}
            - name: CREDENTIAL_RENEWAL_TIMEOUT_SECONDS
              value: {{ .Values.credentialRenewal.timeoutSeconds | quote }}
            - name: CREDENTIAL_RENEWAL_MIN_VALIDITY_SECONDS
              value: {{ .Values.credentialRenewal.minValiditySeconds | quote }}
            - name: REDIS_IP
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.secretName }}
                  key: db.endpoint
                  optional: true
            - name: REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.secretName }}
                  key: db.port
                  optional: true
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.secretName }}
                  key: db.auth_token
                  optional: true
            - name: TEMPORAL_IP
              value: {{ .Values.temporal.host | quote }}
            - name: TEMPORAL_PORT
              value: {{ .Values.temporal.port | quote }}
            - name: TEMPORAL_NAMESPACE
              value: {{ .Values.temporal.namespace | quote }}
            - name: IDENTITY_PROVIDER_MODE
              value: {{ .Values.identity.providerMode | quote }}
            - name: SSO_ISSUER_URI
              value: {{ .Values.identity.ssoIssuerUri | quote }}
            - name: SSO_AUDIENCE
              value: {{ .Values.identity.ssoAudience | quote }}
            - name: KEYCLOAK_ISSUER_URI
              value: {{ include "mas-worker.keycloakIssuerUri" . | quote }}
            - name: KEYCLOAK_JWKS_URI
              value: {{ .Values.identity.keycloakJwksUri | quote }}
            - name: KEYCLOAK_AUDIENCE
              value: {{ .Values.identity.keycloakAudience | quote }}
            - name: KEYCLOAK_VERIFY_SSL
              value: {{ .Values.identity.keycloakVerifySsl | quote }}
            - name: KEYCLOAK_TIMEOUT
              value: {{ .Values.identity.keycloakTimeout | quote }}
            {{- if .Values.identity.keycloakCaTrust.enabled }}
            - name: SSL_CERT_FILE
              value: /var/run/mas-keycloak-trust/ca-bundle.crt
            - name: REQUESTS_CA_BUNDLE
              value: /var/run/mas-keycloak-trust/ca-bundle.crt
            - name: CURL_CA_BUNDLE
              value: /var/run/mas-keycloak-trust/ca-bundle.crt
            {{- end }}
            - name: ADMIN_ALLOWED_USERS
              value: {{ .Values.identity.adminAllowedUsers | quote }}
            - name: LANGFUSE_ENABLED
              value: {{ .Values.langfuse.enabled | quote }}
            - name: LANGFUSE_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.langfuse.secretName }}
                  key: langfuse.baseurl
                  optional: true
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.langfuse.secretName }}
                  key: langfuse.public
                  optional: true
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.langfuse.secretName }}
                  key: langfuse.secret
                  optional: true
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: shared-storage
              mountPath: {{ .Values.sharedStorage.mountPath }}
            {{- if .Values.identity.keycloakCaTrust.enabled }}
            - name: keycloak-ca-trust
              mountPath: /var/run/mas-keycloak-trust
              readOnly: true
            {{- end }}
            {{- if .Values.vertexCreds.enabled }}
            - name: vertex-creds
              mountPath: {{ .Values.vertexCreds.mountPath }}
              readOnly: true
            {{- end }}
      volumes:
        - name: shared-storage
          {{- if .Values.sharedStorage.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.sharedStorage.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.identity.keycloakCaTrust.enabled }}
        - name: keycloak-ca
          configMap:
            name: {{ .Values.identity.keycloakCaTrust.configMapName | quote }}
            items:
              - key: {{ .Values.identity.keycloakCaTrust.configMapKey | quote }}
                path: ca-bundle.crt
        - name: keycloak-ca-trust
          emptyDir: {}
        {{- end }}
        {{- if .Values.vertexCreds.enabled }}
        - name: vertex-creds
          secret:
            secretName: {{ .Values.vertexCreds.secretName }}
            items:
              - key: {{ .Values.vertexCreds.credentialKey }}
                path: {{ .Values.vertexCreds.credentialKey }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
