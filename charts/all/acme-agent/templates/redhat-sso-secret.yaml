{{- $redhatEnabled := and (eq .Values.auth.mode "keycloak") .Values.auth.redhatSso.enabled }}
{{- $productionEnabled := and $redhatEnabled .Values.auth.redhatSso.production.enabled }}
{{- $stageEnabled := and $redhatEnabled .Values.auth.redhatSso.stage.enabled }}
{{- $secretName := include "acme-agent.redhatSsoCredentialsSecretName" . }}
{{- if and (or $productionEnabled $stageEnabled) (not .Values.auth.redhatSso.credentialsSecret.existingName) }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "acme-agent.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.secretStore.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: {{ $secretName }}
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        {{- if $productionEnabled }}
        production-client-id: "{{ `{{ .production_client_id }}` }}"
        production-client-secret: "{{ `{{ .production_client_secret }}` }}"
        {{- end }}
        {{- if $stageEnabled }}
        stage-client-id: "{{ `{{ .stage_client_id }}` }}"
        stage-client-secret: "{{ `{{ .stage_client_secret }}` }}"
        {{- end }}
  data:
    {{- if $productionEnabled }}
    - secretKey: production_client_id
      remoteRef:
        key: {{ .Values.auth.redhatSso.production.vaultKey }}
        property: {{ .Values.auth.redhatSso.production.clientIdProperty }}
    - secretKey: production_client_secret
      remoteRef:
        key: {{ .Values.auth.redhatSso.production.vaultKey }}
        property: {{ .Values.auth.redhatSso.production.clientSecretProperty }}
    {{- end }}
    {{- if $stageEnabled }}
    - secretKey: stage_client_id
      remoteRef:
        key: {{ .Values.auth.redhatSso.stage.vaultKey }}
        property: {{ .Values.auth.redhatSso.stage.clientIdProperty }}
    - secretKey: stage_client_secret
      remoteRef:
        key: {{ .Values.auth.redhatSso.stage.vaultKey }}
        property: {{ .Values.auth.redhatSso.stage.clientSecretProperty }}
    {{- end }}
{{- end }}
