listeners:
  - name: a2a
    address: "0.0.0.0:{{ .Values.service.port }}"
    filter_chains: [authorization-and-routing]

filter_chains:
  - name: authorization-and-routing
    filters:
      {{- if .Values.policy.enabled }}
      - filter: policy
        config_path: /etc/praxis/config/policy.yaml
        # This is separate from insecure_options below: it permits the policy
        # engine's configured IdP/JWKS callouts to resolve to private IPs.
        allow_private_idp: {{ .Values.policy.allowPrivateIdp }}
        # This gateway authorizes generic HTTP/A2A requests, not MCP entity
        # requests, so it intentionally has no protocol-classifier requirement.
        require_protocol_metadata: false
        init_timeout_secs: 30
      {{- end }}

      {{- if .Values.agentCard.enabled }}
      # Core 0.7.0 (embedded in the pinned ai:0.4.1 image) has no static-files
      # load-balancer cluster. Serve the discovery card with the built-in
      # static_response filter instead; the preceding policy explicitly allows
      # this public path.
      #
      # MAS A2A validation expects agent card at {base_url}/.well-known/agent-card.json.
      # When base_url includes /a2a, it looks for /a2a/.well-known/agent-card.json.
      # Create TWO static_response filter instances (each with one condition) so
      # Praxis serves the same card at both paths - multiple when: conditions in
      # one filter may require ALL to match (AND), not ANY (OR).
      #
      # The card is generic: it advertises the gateway itself, not whatever
      # backend a2aUpstream currently fronts. When a2aUpstream is enabled,
      # override agentCard.description in the variant to describe the real
      # backend, and set agentCard.capabilities.streaming to match what that
      # backend actually implements -- the client picks message/stream vs
      # message/send based on THIS card, not the backend's own (unreachable
      # from here) agent card. VERIFIED-BROKEN LIVE (2026-11, a2aUpstream ->
      # lightspeed-hub-a2a-adapter poc2 build): this card advertised
      # streaming: true unconditionally, so MAS called message/stream against
      # an adapter that only implements message/send, failing every
      # delegation with a JSON-RPC "method not found" error. Set to false
      # until the fronted backend actually implements message/stream.
      {{- $rpcUrl := .Values.agentCard.rpcUrl | default (printf "https://%s/a2a" (include "praxis-proxy.effectiveRouteHost" .)) }}
      {{- $agentCard := dict "name" .Values.agentCard.name "description" .Values.agentCard.description "supportedInterfaces" (list (dict "url" $rpcUrl "protocolBinding" "JSONRPC" "protocolVersion" "1.0")) "version" .Values.agentCard.version "capabilities" (dict "streaming" .Values.agentCard.capabilities.streaming "pushNotifications" false) "defaultInputModes" (list "text/plain") "defaultOutputModes" (list "text/plain") "url" $rpcUrl }}
      - filter: static_response
        conditions:
          - when:
              path: /.well-known/agent-card.json
              methods: [GET]
        status: 200
        headers:
          - name: Content-Type
            value: application/json
        body: {{ $agentCard | toJson | quote }}

      - filter: static_response
        conditions:
          - when:
              path: /a2a/.well-known/agent-card.json
              methods: [GET]
        status: 200
        headers:
          - name: Content-Type
            value: application/json
        body: {{ $agentCard | toJson | quote }}
      {{- end }}

      # Readiness is answered by the proxy itself (200) rather than routed to
      # a backend: this chart currently configures no upstream clusters, so
      # there is nothing else to health-check. The startup/liveness probes
      # already cover process health via the loopback admin listener; this
      # only proves the main listener and filter chain are serving. When a
      # backend is (re)introduced, consider routing this to it again so the
      # proxy is not marked ready while the backend is down.
      - filter: static_response
        conditions:
          - when:
              path: /readiness
              methods: [GET]
        status: 200
        body: "ok"

      # No upstream clusters are configured, so there is deliberately NO
      # router filter at all: every request that survives the policy
      # filter's catch-all (i.e. allow-listed callers hitting any path other
      # than the public discovery and readiness routes above) falls off the
      # end of the filter chain and is answered with a 404 by Core itself.
      #
      # VERIFIED-BROKEN (2026-11 local podman run of the pinned image
      # ghcr.io/praxis-proxy/ai:0.4.1, praxis-policy 0.3.1): a `router`
      # filter with `routes: []` -- the form this chart previously shipped
      # here as a "clean 404" terminator -- is a FATAL config-load error on
      # the pinned image:
      #   fatal: router: 'routes' is empty; every request would fail with 404
      # The binary refuses to start. The empty-routes caveat recorded in the
      # chart README is therefore closed: the router filter is removed
      # entirely. Re-introduce a router only together with real (non-empty)
      # routes, e.g. when the Task B lightspeed-hub backend lands; the
      # static_response filters above already serve every route this gateway
      # currently answers.
      {{- if .Values.a2aUpstream.enabled }}
      # TASK B REQUEST LEG (a2aUpstream.enabled): the router comes back,
      # with REAL (non-empty) routes this time -- one per registered spoke.
      # The comment above stays accurate for the default (disabled) render.
      #
      # Caller x target enforcement lives HERE, in the router, not in APL:
      # policy.yaml's `http:` route selectors accept only path/path_prefix/
      # method (documented in that file), so the target header can only be
      # validated by the router's exact header matching. Each route below
      # requires the target header to be PRESENT with EXACTLY one registered
      # spoke value; a request whose header is absent or holds an unregistered
      # value matches no route and Core answers 404 (verified live during the
      # pre-Task-A routing era; see chart README "Header routing").
      #
      # VERIFIED-UNFIXABLE ON THE PINNED IMAGE (2026-11, source-confirmed
      # against Core v0.7.0 -- the exact Core embedded in the pinned
      # ghcr.io/praxis-proxy/ai:0.4.1): a MULTI-VALUED target header cannot
      # be rejected here. Core's router header matcher
      # (crates/filter/.../router/matching.rs `headers_match`) uses
      # `get_all(key).any(|v| v == val)` -- OR semantics across a repeated
      # header's values -- so a request smuggling two target headers, one
      # registered and one not, still matches the registered route. The
      # same OR shape is in guardrails' `scan_header_values`
      # (`get_all(...).find_map(...)`), and the `headers` filter has no
      # reject form, so NO built-in filter on this image can count header
      # occurrences. Compensating controls (both REQUIRED before enabling):
      # the ADAPTER must reject duplicate/multi-valued target headers (plan
      # adapter-scope item 5 -- the adapter sees the raw header lines and
      # CAN count them), and the server-side admission policy +
      # run-creators RBAC (charts/all/lightspeed-hub) bound what a smuggled
      # request can achieve anyway. Re-check this gap on the next image bump.
      - filter: router
        routes:
          {{- range $spoke := keys .Values.spokeGateways | sortAlpha }}
          # Exact allow-listed target-header match for registered spoke
          # "{{ $spoke }}". The allow-list IS the spokeGateways map: a
          # caller may only target spokes that have gateways.
          - path_prefix: /
            headers:
              {{ $.Values.a2aUpstream.targetHeader }}: {{ $spoke | quote }}
            cluster: hub-adapter
          {{- end }}

      # Single fixed upstream: the hub A2A adapter's internal-only Service
      # (never a caller-supplied URL or header). Same TLS mechanism as the
      # spoke gateways: verify with the OpenShift service-serving CA bundle
      # injected into the praxis-hub-adapter-ca ConfigMap
      # (templates/a2a-upstream-ca-configmap.yaml). The
      # clusters[].tls.{sni,verify,ca.ca_path} schema is the one
      # byte-for-byte confirmed between Core v0.7.0 (what the pinned
      # ai:0.4.1 embeds) and v0.7.2 and validated live during the routing
      # era (see chart README "Validation evidence").
      #
      # The adapter now SERVES TLS (implemented: --tls-cert-file/
      # --tls-key-file wired to an OpenShift service-serving cert by the
      # lightspeed-hub chart and the a2a-adapter kustomize component,
      # port 8443). Remaining UNCONFIRMED: live service-cert issuance
      # for the adapter Service -- see the lightspeed-hub chart README's
      # cross-chart contract.
      #
      # The target header is deliberately NOT stripped before forwarding:
      # the adapter resolves the AgenticRun's spec.targetCluster from it
      # (its --target-header flag), after the router above has already
      # validated it against the registered spokes.
      - filter: load_balancer
        clusters:
          - name: hub-adapter
            endpoints:
              - {{ include "praxis-proxy.a2aUpstreamEndpoint" . | quote }}
            tls:
              sni: {{ include "praxis-proxy.a2aUpstreamHost" . | quote }}
              verify: true
              ca:
                ca_path: /etc/praxis/hub-adapter-ca/service-ca.crt
      {{- end }}

admin:
  # Kept on loopback: only container-local health probes can access it.
  address: "127.0.0.1:9901"

# Praxis requires these opt-ins for static in-cluster upstreams. No upstream
# clusters are currently configured (see the no-router note above), so these
# only matter if/when one is added back; they do not configure policy-engine
# callouts.
insecure_options:
  allow_private_endpoints: true
  allow_private_upstreams: true
