plugins:
  - name: jwt-client
    kind: identity/jwt
    hooks:
      - identity.resolve
    capabilities:
      - perform_http
    on_error: fail
    config:
      role: client
      header: Authorization
      # Preserve the original OPA decision key exactly: authorized party
      # (azp), not the token subject or a potentially different client_id.
      claims:
        include:
          - azp
      trusted_issuers:
        - issuer: "{{ trimSuffix "/" .Values.identity.keycloak.issuerUrl }}"
          audiences:
            - {{ .Values.identity.keycloak.audience | quote }}
          algorithms:
            - RS256
          decoding_key:
            kind: jwks_url
            url: "{{ printf "%s/protocol/openid-connect/certs" (trimSuffix "/" .Values.identity.keycloak.issuerUrl) }}"
      claim_mapper: keycloak

routes:
  # The A2A discovery document is public by design. Its RPC URL still points
  # at the public Praxis Route, never directly at the RCA Service.
  - http:
      path: /.well-known/agent-card.json
      method: GET
    authorization:
      pre_invocation:
        - "allow"

  # Readiness is routed through to RCA so the proxy is not marked ready while
  # the application, Keycloak, or the workload identity socket is unavailable.
  - http:
      path: /health/ready
      method: GET
    authorization:
      pre_invocation:
        - "allow"

  # Catch-all: all other HTTP requests require a valid Keycloak client token
  # and an explicit allow-list match. The earlier exact routes take priority.
  - http:
      path_prefix: /
    authentication:
      steps:
        - jwt-client
    authorization:
      pre_invocation:
{{ range .Values.policy.allowedCallers }}
        - {{ printf "require(claim.azp == '%s')" . | quote }}
{{ end }}
