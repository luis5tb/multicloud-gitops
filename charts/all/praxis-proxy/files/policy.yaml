plugins:
  - name: jwt-client
    kind: identity/jwt
    hooks:
      - identity.resolve
    # `read_claims` is required for the catch-all route's pre_invocation
    # predicate below to see `claim.azp` at all -- see the long comment on
    # that route for why, and do not remove this capability while that
    # predicate (or any claim.* predicate) exists.
    capabilities:
      - perform_http
      - read_claims
    on_error: fail
    config:
      # DELIBERATELY "user", not "client", despite this resolving an OAuth
      # *client* (acme-agent's service-account) token. Empirically verified
      # against the exact pinned image (ghcr.io/praxis-proxy/ai:0.4.1, whose
      # Cargo.lock resolves praxis-policy to 0.3.1): with `role: client`,
      # identity resolution runs and the claim_mapper logs attempt the
      # "client" claim_map section (confirmed via RUST_LOG=debug -- see
      # chart README "Header routing and the role: user workaround"), but
      # the resulting `client.*` bag namespace (`client.client_id`,
      # `client.claim.azp`, etc., per
      # https://github.com/praxis-proxy/policy/blob/v0.3.1/docs/content/cmf-extensions.md)
      # never becomes visible to this route's pre_invocation predicates in
      # this pinned build: `exists(client.client_id)` and
      # `exists(client.claim.azp)` both evaluate false for a token that
      # demonstrably has `azp` set, with every read_* capability granted.
      # `role: user` populates `subject.*`/`claim.*` instead, and those
      # *are* visible (`exists(subject.id)`/`exists(claim.azp)` both
      # evaluate true for the same token). This looks like a genuine defect
      # or incomplete feature in this exact historical PPE version, not a
      # config mistake; re-test with `role: client` when the image is next
      # upgraded, since that is the semantically correct role for a
      # service-account/OAuth-client caller.
      role: user
      header: Authorization
      trusted_issuers:
        {{- if .Values.identity.oidcIssuers }}
        {{/* Multi-issuer mode: validate tokens from any configured issuer */}}
        {{ range .Values.identity.oidcIssuers }}
        - issuer: {{ .issuerUrl | quote }}
          audiences:
            - {{ .audience | quote }}
          algorithms:
            - RS256
          decoding_key:
            kind: jwks_url
            url: {{ .jwksUrl | quote }}
        {{ end }}
        {{/* Also include the local Keycloak for backward compatibility */}}
        - issuer: "{{ trimSuffix "/" (include "praxis-proxy.effectiveIssuerUrl" .) }}"
          audiences:
            - {{ .Values.identity.keycloak.audience | quote }}
          algorithms:
            - RS256
          decoding_key:
            kind: jwks_url
            url: "{{ printf "%s/protocol/openid-connect/certs" (trimSuffix "/" (include "praxis-proxy.effectiveIssuerUrl" .)) }}"
        {{ else }}
        {{/* Single-issuer mode: only validate tokens from local Keycloak */}}
        - issuer: "{{ trimSuffix "/" (include "praxis-proxy.effectiveIssuerUrl" .) }}"
          audiences:
            - {{ .Values.identity.keycloak.audience | quote }}
          algorithms:
            - RS256
          decoding_key:
            kind: jwks_url
            url: "{{ printf "%s/protocol/openid-connect/certs" (trimSuffix "/" (include "praxis-proxy.effectiveIssuerUrl" .)) }}"
        {{ end }}
      claim_mapper: keycloak

{{- if .Values.__delegation }}
  # RFC 8693 delegation, rendered ONLY when a template injects the
  # __delegation flag into a deep-copied Values tree: the spoke gateways
  # (templates/spoke-gateway-configmap.yaml, A/R -> U) and -- with
  # a2aUpstream.exchangeAtPraxis -- the hub gateway (templates/configmap.yaml,
  # A -> H). A plain render never contains a delegator. Schema
  # VERIFIED end-to-end on the pinned image (ghcr.io/praxis-proxy/ai:0.4.1,
  # praxis-policy 0.3.1) against a mock IdP performing RFC 8693 exchange.
  # This is a POLICY PLUGIN, not a Core filter: the delegation is driven by
  # the `delegate(...)` step appended to the catch-all route's
  # pre_invocation below.
  - name: {{ .Values.__delegation.plugin }}
    kind: delegator/oauth
    hooks: [token.delegate]
    capabilities:
      - read_inbound_credentials
      - write_delegated_tokens
      - perform_http
    config:
      # https REQUIRED in prod (the mock-IdP spike needed
      # insecure_http: true only because the mock listened on plain http;
      # it is deliberately NOT set here).
      token_endpoint: {{ .Values.__delegation.tokenUrl | quote }}
      client_id: {{ .Values.__delegation.clientId | quote }}
      # The secret comes from the env var the gateway's Deployment injects
      # (from the ExternalSecret created by charts/all/keycloak-oidc).
      # Client authentication at the token endpoint is HTTP Basic
      # client_id:client_secret (verified empirically), NOT a body
      # parameter -- and it is sent WITHOUT RFC 6749 form-URL-encoding
      # (VERIFIED-BROKEN LIVE 2026-11-20 with a '%' in the secret), so the
      # secret MUST be alphanumeric (values-secret.yaml.template
      # alphaNumericPolicy).
      client_secret_source:
        kind: env_var
        name: {{ .Values.__delegation.secretEnv }}
      # Optional delegated-token cache (verified field names in the pinned
      # binary; left off -- enable only after tuning for the IdP's token
      # lifetimes, the binary refuses to cache when the staleness margin
      # covers the whole token lifetime):
      # cache:
      #   max_entries: 1024
      #   ttl_ceiling_seconds: 300
      #   staleness:
      #     floor_seconds: 5
      #     fraction: 0.1
      #     jitter_seconds: 1
      #
      # Empirical gotchas recorded from the spike (all reproduced against
      # the pinned image):
      #   * delegate() with no identity resolution raises a
      #     `delegation_without_identity_resolution` alarm and fails -- the
      #     route MUST keep `authentication: steps: [jwt-client]` so the
      #     inbound bearer is resolved first.
      #   * DelegationPayload with an empty bearer fails the delegation --
      #     unauthenticated requests must be rejected by the authentication
      #     step before delegate() runs (they are, here).
      #   * BOTH the jwt resolver plugin and this delegator need the
      #     perform_http capability (the resolver for JWKS fetches, the
      #     delegator for the token-endpoint callout).
{{- end }}

routes:
  # The A2A discovery document is public by design. Its RPC URL points
  # at the public Praxis Route; the card itself is the a2aUpstream
  # backend's own, routed unauthenticated by the router in
  # files/praxis.yaml (404 when a2aUpstream is disabled). Keep these
  # exemptions GET-only and exact-path.
  - http:
      path: /.well-known/agent-card.json
      method: GET
    authorization:
      pre_invocation:
        - "allow"

  # MAS A2A validation expects agent card at {base_url}/.well-known/agent-card.json
  # If base_url is https://.../a2a, it looks for /a2a/.well-known/agent-card.json
  # Serve the same agent card at this path to support MAS validation
  - http:
      path: /a2a/.well-known/agent-card.json
      method: GET
    authorization:
      pre_invocation:
        - "allow"

  # Readiness is answered by the proxy itself via a static_response filter
  # (see files/praxis.yaml) so the path must stay public.
  - http:
      path: /readiness
      method: GET
    authorization:
      pre_invocation:
        - "allow"

  # Catch-all: every other HTTP request requires a valid Keycloak client
  # token and an explicit allow-list match. The earlier exact routes take
  # priority. This authentication/authorization step runs in the `policy`
  # filter, which is ordered strictly before the `router` filter in
  # files/praxis.yaml's filter_chain -- a request denied here never
  # reaches the router, let alone an upstream.
  #
  # NOTE: this allow-list matches the caller only (claim.azp). Core's APL
  # `http:` route selector documented here accepts only path/path_prefix/
  # method -- not headers (see
  # https://github.com/praxis-proxy/policy/blob/v0.4.0/docs/content/http-routing.md:
  # "Anything other than path, path_prefix, and method in that map is a load
  # error") -- so per-target enforcement beyond path matching is Core
  # router's job (files/praxis.yaml), not this policy document's.
  #
  # CORRECTED (empirically, against the pinned image -- see the long comment
  # on the jwt-client plugin's `role` field above):
  #
  #   * Compare `claim.azp`, not `claim.client_id`/`client.client_id`. The
  #     "keycloak" claim_mapper preset's documented "client" claim_map
  #     section (which would populate `client.client_id` from
  #     client_id/azp/clientId) never becomes visible to this route's
  #     predicates in this pinned build regardless of granted capabilities.
  #     Raw claims under `claim.*` (role: user + read_claims, see above) are
  #     visible, so compare the raw `azp` claim directly instead of a mapped
  #     field. This chart previously compared `claim.client_id`, which was
  #     *always* undefined here and therefore never matched -- every holder
  #     of a validly-signed token reached the backend regardless of `azp`,
  #     not just the allow-listed caller. Verified both ways with a live
  #     container and two tokens differing only in `azp`.
  #   * Use an explicit `deny(...)` action, not a bare comparison. A bare
  #     predicate with no action is a documented no-op fallthrough in this
  #     engine's effects model
  #     (https://github.com/praxis-proxy/policy/blob/v0.3.1/docs/content/apl/effects.md:
  #     "pre_invocation: ... run in sequence until one denies"; `allow` is
  #     explicitly a no-op and nothing says a bare predicate becomes an
  #     implicit allow-or-deny) and was verified live to never deny either
  #     an allow-listed or a non-allow-listed caller. Wrapping it in
  #     `require(...)` instead is *also* broken on this pinned build (see
  #     the next paragraph), so the only form verified to work here is an
  #     explicit `deny(...)` action on the negated condition.
  #   * `require(...)` is -- separately -- known broken on this exact
  #     pinned build: wrapping a comparison in `require(...)` is accepted by
  #     the config schema but was observed to deny unconditionally,
  #     regardless of the claim compared, so it cannot be used as a
  #     carve-out either. Revalidate both quirks (the silent client.*
  #     visibility gap and the require() behavior) before relying on either
  #     form again on a future image.
  #
  # This renders one `claim.azp != '<allowed>'` conjunct per
  # policy.allowedCallers entry, ANDed together, so the rule denies unless
  # azp matches at least one allow-listed caller (De Morgan's form of
  # "azp in allowedCallers", since APL's `in` operator needs a `data.*`
  # set attribute rather than an inline list -- see
  # https://github.com/praxis-proxy/policy/blob/v0.4.0/docs/content/apl/attributes.md).
  - http:
      path_prefix: /
    authentication:
      steps:
        - jwt-client
    authorization:
      pre_invocation:
        - {{ $conds := list }}{{ range .Values.policy.allowedCallers }}{{ $conds = append $conds (printf "claim.azp != '%s'" .) }}{{ end }}{{ printf "%s: deny('not an allow-listed caller')" (join " & " $conds) | quote }}
        {{- if .Values.__delegation }}
        # After the azp allow-list conjunct above passes (pre_invocation
        # steps run in sequence until one denies), exchange the inbound
        # token for the hop's audience before forwarding to the fixed
        # upstream (spoke gateway: R -> U for spoke-api; hub gateway: A -> H
        # for hub-adapter). Verified syntax on the pinned image:
        # delegate(<plugin>, target: <upstream cluster name>, audience:
        # <exchange audience>) -- a SINGLE audience, which is why every
        # token's audience names the client that exchanges it next.
        - {{ printf "delegate(%s, target: %s, audience: %s)" .Values.__delegation.plugin .Values.__delegation.target .Values.__delegation.audience | quote }}
        {{- end }}
