{{- $mismatches := list -}}
{{- range .Values.policy.allowedCallers -}}
{{- $mismatches = append $mismatches (printf "claim.azp != '%s'" .) -}}
{{- end }}
plugins:
  - name: jwt-client
    kind: identity/jwt
    hooks:
      - identity.resolve
    capabilities:
      - perform_http
    on_error: fail
    config:
      # Client credentials are projected into the user/subject claim bag by
      # this resolver role; role: client only populates client.* and does not
      # make the JWT's azp claim available to these APL predicates.
      role: user
      header: Authorization
      claims:
        include:
          - azp
      trusted_issuers:
        - issuer: "{{ trimSuffix "/" .Values.identity.keycloak.issuerUrl }}"
          audiences:
            - {{ .Values.identity.keycloak.audience | quote }}
          algorithms:
            - RS256
          decoding_key:
            kind: jwks_url
            url: "{{ printf "%s/protocol/openid-connect/certs" (trimSuffix "/" .Values.identity.keycloak.issuerUrl) }}"
      claim_mapper: keycloak

routes:
  # The A2A discovery document is public by design. Its RPC URL still points
  # at the public Praxis Route, never directly at the RCA Service.
  - http:
      path: /.well-known/agent-card.json
      method: GET
    authorization:
      pre_invocation:
        - "allow"

  # Readiness is routed through to RCA so the proxy is not marked ready while
  # the application, Keycloak, or the workload identity socket is unavailable.
  - http:
      path: /health/ready
      method: GET
    authorization:
      pre_invocation:
        - "allow"

  # Catch-all: all other HTTP requests require a valid Keycloak token and an
  # explicit allow-list match. The earlier exact routes take priority.
  - http:
      path_prefix: /
    authentication:
      steps:
        - jwt-client
    authorization:
      pre_invocation:
        - {{ printf "%s: deny('client is not allow-listed', 'caller_not_allowed')" (join " && " $mismatches) | quote }}
