{{- if .Values.route.enabled }}
{{- /*
host is derived from global.clusterBaseDomain (openshift-lightspeed.apps.<base>)
when not explicitly set -- see _helpers.tpl's effectiveRouteHost; the derivation
fails loud if the anchor is unresolvable, replacing the old non-empty guard.
*/}}
{{- $routeHost := include "praxis-proxy.effectiveRouteHost" . }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "praxis-proxy.fullname" . }}
  labels:
    {{- include "praxis-proxy.labels" . | nindent 4 }}
  {{- with .Values.route.timeout }}
  annotations:
    haproxy.router.openshift.io/timeout: {{ . | quote }}
  {{- end }}
spec:
  host: {{ $routeHost | quote }}
  to:
    kind: Service
    name: {{ include "praxis-proxy.fullname" . }}
  port:
    targetPort: http
  {{- with .Values.route.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
