{{- if .Values.enabled }}
{{- if .Values.route.enabled }}
{{- if not .Values.route.host }}
{{- fail "route.host must be set when the Praxis public Route is enabled" }}
{{- end }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "praxis-proxy.fullname" . }}
  labels:
    {{- include "praxis-proxy.labels" . | nindent 4 }}
  {{- with .Values.route.timeout }}
  annotations:
    haproxy.router.openshift.io/timeout: {{ . | quote }}
  {{- end }}
spec:
  {{- with .Values.route.host }}
  host: {{ . | quote }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "praxis-proxy.fullname" . }}
  port:
    targetPort: http
  {{- with .Values.route.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
