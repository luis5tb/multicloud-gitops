{{- $np := .Values.spokeGatewayConfig.networkPolicy }}
{{- if and $np.enabled (not $np.ingressFromNamespaces) }}
{{- fail "spokeGatewayConfig.networkPolicy.ingressFromNamespaces must list at least one namespace when the spoke-gateway NetworkPolicy is enabled" }}
{{- end }}
{{- if and $np.enabled (gt (len .Values.spokeGateways) 0) }}
{{- if not $np.ingressPodSelectors.read }}
{{- fail "spokeGatewayConfig.networkPolicy.ingressPodSelectors.read must be a non-empty Kubernetes LabelSelector when the NetworkPolicy is enabled" }}
{{- end }}
{{- if and $.Values.spokeGatewayConfig.execution.enabled (not $np.ingressPodSelectors.execution) }}
{{- fail "spokeGatewayConfig.networkPolicy.ingressPodSelectors.execution must be a non-empty Kubernetes LabelSelector when the execution gateway is enabled" }}
{{- end }}
{{- range $key, $cfg := .Values.spokeGateways }}
{{- $modes := list (dict "execution" false) }}
{{- if $.Values.spokeGatewayConfig.execution.enabled }}{{- $modes = append $modes (dict "execution" true) }}{{- end }}
{{- range $mode := $modes }}
{{- $isExec := $mode.execution }}
{{- $name := include "praxis-proxy.spokeGatewayModeName" (dict "key" $key "execution" $isExec) }}
{{- $modeLabel := ternary "exec" "read" $isExec }}
{{- $u := urlParse ($cfg.remoteAPIServer | toString) }}
{{- $hostPort := $u.host | toString }}
{{- $port := "443" }}
{{- if contains ":" $hostPort }}
{{- $port = index (splitList ":" $hostPort) 1 }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "praxis-proxy.labels" $ | nindent 4 }}
    praxis-proxy.spoke-gateway: {{ $key | quote }}
    praxis-proxy.spoke-gateway-mode: {{ $modeLabel | quote }}
spec:
  podSelector:
    matchLabels:
      {{- if $isExec }}
      app.kubernetes.io/name: {{ include "praxis-proxy.spokeGatewayExecAppName" $ | quote }}
      {{- else }}
      app.kubernetes.io/name: {{ include "praxis-proxy.name" $ | quote }}
      {{- end }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
      praxis-proxy.spoke-gateway: {{ $key | quote }}
      praxis-proxy.spoke-gateway-mode: {{ $modeLabel | quote }}
  policyTypes:
    - Ingress
    - Egress
  # Gate sandbox ingress at the gateway: only pods in the configured
  # sandbox namespaces may reach this gateway's 8443 listener. Nothing
  # else in- or outside the namespace can talk to it (no Route exists).
  ingress:
    - from:
        {{- range $ns := $np.ingressFromNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns | quote }}
          podSelector:
            {{- if $isExec }}
            {{- toYaml $np.ingressPodSelectors.execution | nindent 12 }}
            {{- else }}
            {{- toYaml $np.ingressPodSelectors.read | nindent 12 }}
            {{- end }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8443
  # BEST-EFFORT only (see chart README "Spoke gateways (B1, proposed)"):
  # plain Kubernetes NetworkPolicies cannot match on FQDNs, so the remote
  # spoke API / Keycloak IdP+token endpoint / JWKS egress below is
  # port-scoped rather than destination-scoped. FQDN-aware enforcement of
  # "its registered remote API, IdP/JWKS and DNS needs" needs CNI egress
  # facilities (EgressFirewall/EgressFirewallPolicy, an egress router)
  # beyond ordinary NetworkPolicy hostname rules -- this is exactly what
  # PLAN-lightspeed-hub-migration.md records for B1.
  egress:
    # Cluster DNS (name resolution for the remote API host, IdP and JWKS).
    # BOTH 53 and 5353: the dns-default Service listens on 53 but targets
    # the DNS pods' named port `dns` = 5353, and NetworkPolicy (OVN-
    # Kubernetes) matches the DESTINATION POD port after Service DNAT.
    # VERIFIED-BROKEN LIVE (2026-11-20): with only 53 allowed, every lookup
    # from this gateway (and its dnsIPv4Only sidecar's upstream queries)
    # timed out, the JWKS fetch failed, and every sandbox request got 401.
    # 53 is kept for CNIs that match the Service port.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
          podSelector:
            matchLabels:
              dns.operator.openshift.io/daemonset-dns: default
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
    # HTTPS to the fixed remote spoke API, the Keycloak token endpoint and
    # the JWKS URL. Remote kube API servers listen on 6443 (or whatever
    # port this spoke's remoteAPIServer URL carries -- parsed at render
    # time, same parse as the gateway config's load_balancer endpoint),
    # so BOTH that port and 443 (Keycloak/JWKS) must be allowed: an
    # egress rule allowing only 443 silently blackholes the remote API
    # leg. Destination restriction beyond the port needs CNI facilities
    # (see above); the remote is additionally pinned by the gateway
    # config (fixed operator-configured endpoint, verified CA/SNI) and by
    # the exchange audience.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: {{ $port }}
{{- end }}
{{- end }}
{{- end }}
