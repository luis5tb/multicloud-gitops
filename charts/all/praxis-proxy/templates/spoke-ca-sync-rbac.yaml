{{- /*
RBAC for the serving-CA sync bridge (B1). The job reads the
inject-cabundle ConfigMap in this namespace and creates/patches the target
Secret in spokeGatewayConfig.servingCA.targetNamespace (default: this
namespace; MUST be set to repo C's operator namespace in the standalone
variant -- repo C consumes the Secret from there).
*/}}
{{- if gt (len .Values.spokeGateways) 0 }}
{{- $targetNamespace := .Values.spokeGatewayConfig.servingCA.targetNamespace | default .Release.Namespace }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "praxis-proxy.fullname" . }}-spoke-ca-sync
  labels:
    {{- include "praxis-proxy.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "praxis-proxy.fullname" . }}-spoke-ca-sync-source
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "praxis-proxy.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ .Values.spokeGatewayConfig.servingCA.sourceConfigMap | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "praxis-proxy.fullname" . }}-spoke-ca-sync-source
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "praxis-proxy.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
subjects:
  - kind: ServiceAccount
    name: {{ include "praxis-proxy.fullname" . }}-spoke-ca-sync
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "praxis-proxy.fullname" . }}-spoke-ca-sync-source
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "praxis-proxy.fullname" . }}-spoke-ca-sync-target
  namespace: {{ $targetNamespace }}
  labels:
    {{- include "praxis-proxy.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.spokeGatewayConfig.servingCA.secretName | quote }}]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "praxis-proxy.fullname" . }}-spoke-ca-sync-target
  namespace: {{ $targetNamespace }}
  labels:
    {{- include "praxis-proxy.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
subjects:
  - kind: ServiceAccount
    name: {{ include "praxis-proxy.fullname" . }}-spoke-ca-sync
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "praxis-proxy.fullname" . }}-spoke-ca-sync-target
{{- end }}
