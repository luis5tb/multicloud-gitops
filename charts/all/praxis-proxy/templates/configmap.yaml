{{- if empty .Values.policy.allowedCallers }}
{{- fail "policy.allowedCallers must contain at least one client; an empty allow-list would only require a valid token" }}
{{- end }}
{{- /*
files/policy.yaml interpolates each entry directly into a single-quoted APL
string literal (claim.azp != '<entry>'). A value containing a single quote
could break out of that literal and inject arbitrary APL into the rendered
policy document -- reject anything that isn't a plain Keycloak client ID
shape before it ever reaches that template.
*/}}
{{- range .Values.policy.allowedCallers }}
{{- if or (not (kindIs "string" .)) (not (regexMatch "^[A-Za-z0-9._-]+$" .)) }}
{{- fail (printf "policy.allowedCallers entries must be safe Keycloak client IDs (letters, digits, '.', '_', '-' only); got %q" .) }}
{{- end }}
{{- end }}
{{- if and .Values.policy.enabled (not .Values.identity.oidcIssuers) (not .Values.identity.keycloak.audience) }}
{{- fail "identity.keycloak.audience must be set when policy.enabled is true and identity.oidcIssuers is empty (single-issuer mode): name the audience this gateway's callers' Keycloak tokens carry" }}
{{- end }}
{{- /* a2aUpstream (Task B request leg) render-time validation: target
      allow-list = spokeGateways keys, exchangeAtPraxis unsupported, header
      name shape, policy must stay on. See _helpers.tpl. */}}
{{- include "praxis-proxy.a2aUpstreamValidation" . }}
{{- if and .Values.policy.enabled .Values.identity.oidcIssuers (not .Values.identity.keycloak.audience) }}
{{- fail "identity.keycloak.audience must be set when policy.enabled is true and identity.oidcIssuers is non-empty (multi-issuer mode): the chart appends the local Keycloak issuer to the trusted issuers and that entry would carry an empty audience" }}
{{- end }}
{{- if and .Values.policy.caBundleSync.enabled (not .Values.policy.caBundleConfigMap.name) }}
{{- fail "policy.caBundleConfigMap.name is required when policy.caBundleSync.enabled is true" }}
{{- end }}
{{- if and .Values.policy.caBundleSync.enabled (not .Values.policy.caBundleSync.targetConfigMapName) }}
{{- fail "policy.caBundleSync.targetConfigMapName is required when policy.caBundleSync.enabled is true" }}
{{- end }}
{{- if and .Values.policy.caBundleSync.enabled (ne .Values.policy.caBundleConfigMap.name .Values.policy.caBundleSync.targetConfigMapName) }}
{{- fail "policy.caBundleConfigMap.name must match policy.caBundleSync.targetConfigMapName" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "praxis-proxy.fullname" . }}
  labels:
    {{- include "praxis-proxy.labels" . | nindent 4 }}
data:
  praxis.yaml: |
{{ tpl (.Files.Get "files/praxis.yaml") . | indent 4 }}
  policy.yaml: |
{{- if .Values.a2aUpstream.exchangeAtPraxis }}
{{- /* Hub-gateway A->H exchange (a2aUpstream.exchangeAtPraxis): same
      delegation block as the spoke gateways, injected into a deep copy so
      the plain render stays delegator-free. Token A's audience is the
      exchanging client (keycloak-oidc hubGatewayExchanger, e.g. mas-a2a), so
      Keycloak's subject-audience rule holds; H carries the hub audience. */}}
{{- $fdValues := deepCopy .Values }}
{{- $_ := set $fdValues "__delegation" (dict "plugin" "hub-delegator" "target" "hub-adapter" "audience" .Values.a2aUpstream.exchange.audience "clientId" .Values.a2aUpstream.exchange.clientId "secretEnv" "PRAXIS_HUB_EXCHANGE_CLIENT_SECRET" "tokenUrl" (include "praxis-proxy.hubExchangeTokenUrl" .)) }}
{{ tpl (.Files.Get "files/policy.yaml") (dict "Values" $fdValues "Chart" .Chart "Release" .Release "Template" .Template) | indent 4 }}
{{- else }}
{{ tpl (.Files.Get "files/policy.yaml") . | indent 4 }}
{{- end }}
