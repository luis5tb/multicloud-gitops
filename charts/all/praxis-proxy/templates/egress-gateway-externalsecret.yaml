{{- range $key, $cfg := .Values.egressGateways }}
{{- $cs := default dict $cfg.clientSecret }}
{{- if $cs.vaultKey }}
{{- $labelCtx := dict "root" $ "key" $key "cfg" $cfg }}
{{- $store := $.Values.egressGatewayConfig.secretStore }}
---
# The external IdP client's secret, read from the SAME Vault record the
# caller-side component already uses (e.g. ACME's Red Hat SSO credentials),
# so switching stage -> production is a values change, not a new secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "praxis-proxy.egressGatewaySecretName" $labelCtx }}
  labels:
    {{- include "praxis-proxy.egressGatewayLabels" $labelCtx | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ $store.refreshInterval }}
  secretStoreRef:
    name: {{ $store.name }}
    kind: {{ $store.kind }}
  target:
    name: {{ include "praxis-proxy.egressGatewaySecretName" $labelCtx }}
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: {{ $cs.vaultKey | quote }}
        property: {{ $cs.vaultProperty | default "client-secret" | quote }}
{{- end }}
{{- end }}
