{{- range $key, $cfg := .Values.spokeGateways }}
{{- $name := include "praxis-proxy.spokeGatewayName" $key }}
{{- $ca := default dict $cfg.remoteCACert }}
{{- $caKey := $ca.key | default "ca.crt" }}
{{- $replicas := $cfg.replicas | default 1 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "praxis-proxy.labels" $ | nindent 4 }}
    praxis-proxy.spoke-gateway: {{ $key | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: {{ $replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "praxis-proxy.name" $ }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
      praxis-proxy.spoke-gateway: {{ $key | quote }}
  template:
    metadata:
      labels:
        {{- include "praxis-proxy.labels" $ | nindent 8 }}
        praxis-proxy.spoke-gateway: {{ $key | quote }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/spoke-gateway-configmap.yaml") $ | sha256sum }}
    spec:
      {{- if $.Values.dnsIPv4Only.enabled }}
      # Same IPv4-only DNS arrangement as the main gateway (loopback
      # AAAA-stripping CoreDNS sidecar). VERIFIED-BROKEN LIVE (2026-11-20):
      # without it this gateway's JWKS fetch from the Keycloak Route failed
      # with `resolve 'keycloak.apps.<base>:443': deadline exceeded`, so it
      # rejected every sandbox request (401) -- the main gateway had the
      # sidecar, the spoke gateways did not.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 127.0.0.1
        searches:
          - {{ printf "%s.svc.cluster.local" $.Release.Namespace }}
          - svc.cluster.local
          - cluster.local
          {{- range $.Values.dnsIPv4Only.extraSearches }}
          - {{ . | quote }}
          {{- end }}
        options:
          - name: ndots
            value: "5"
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml $.Values.securityContext | nindent 8 }}
        {{- if $.Values.dnsIPv4Only.enabled }}
        # "Safe" sysctl: lets the non-root CoreDNS sidecar bind loopback:53.
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "53"
        {{- end }}
      {{- with $.Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: praxis-spoke-gateway
          # SAME pinned Praxis image as the main gateway -- the per-spoke
          # config is the only difference.
          image: {{ include "praxis-proxy.image" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
            # The oauth delegator's own confidential client identity
            # (A->U exchange). Referenced Secret must exist in this
            # namespace (created by charts/all/keycloak-oidc's
            # spoke-gateway-exchanger-secret.yaml) -- a dangling reference
            # leaves this pod in CreateContainerConfigError, i.e. it fails
            # closed.
            - name: PRAXIS_SPOKE_EXCHANGE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.spokeGatewayConfig.exchangeClient.secretName }}
                  key: {{ $.Values.spokeGatewayConfig.exchangeClient.secretKey }}
            {{- if $.Values.policy.caBundleConfigMap.name }}
            # Same trust-store arrangement as the main gateway: the policy
            # plugin (and the exchange callout to Keycloak's token
            # endpoint) verify TLS with this bundle, which replaces the
            # image's default trust file -- the variant syncs the managed
            # ingress CA plus public roots into it.
            - name: SSL_CERT_FILE
              value: /etc/praxis/ca-bundle/ca-bundle.crt
            {{- end }}
            {{- if $.Values.logLevel }}
            - name: RUST_LOG
              value: {{ $.Values.logLevel | quote }}
            {{- end }}
          args:
            - --config
            - /etc/praxis/config/praxis.yaml
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
            - name: admin-local
              containerPort: 9901
              protocol: TCP
          # Probes use the loopback admin listener: the main listener is
          # TLS-serving (verified schema, but the admin listener keeps the
          # probes independent of TLS/cert rotation), same as the main
          # gateway's arrangement.
          startupProbe:
            exec:
              command: ["wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9901/healthy"]
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 36
          livenessProbe:
            exec:
              command: ["wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9901/healthy"]
            periodSeconds: 20
            timeoutSeconds: 2
          readinessProbe:
            exec:
              command: ["wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9901/healthy"]
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/praxis/config
              readOnly: true
            - name: serving-cert
              mountPath: /etc/praxis/serving-cert
              readOnly: true
            - name: spoke-remote-ca
              mountPath: /etc/praxis/spoke-remote-ca
              readOnly: true
            {{- if $.Values.policy.caBundleConfigMap.name }}
            - name: policy-ca-bundle
              mountPath: /etc/praxis/ca-bundle
              readOnly: true
            {{- end }}
        {{- if $.Values.dnsIPv4Only.enabled }}
        - name: dns-ipv4only
          image: {{ required "praxis-proxy: dnsIPv4Only.image is required when dnsIPv4Only.enabled" $.Values.dnsIPv4Only.image | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args:
            - -conf
            - /etc/coredns/Corefile
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8053
            periodSeconds: 20
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: 8053
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            {{- toYaml $.Values.dnsIPv4Only.resources | nindent 12 }}
          volumeMounts:
            - name: dns-ipv4only-config
              mountPath: /etc/coredns
              readOnly: true
        {{- end }}
      volumes:
        {{- if $.Values.dnsIPv4Only.enabled }}
        - name: dns-ipv4only-config
          configMap:
            name: {{ include "praxis-proxy.fullname" $ }}-dns-ipv4only
            defaultMode: 0444
        {{- end }}
        - name: config
          configMap:
            name: {{ $name }}
            defaultMode: 0444
        - name: serving-cert
          secret:
            secretName: {{ $name }}-serving-cert
            defaultMode: 0444
        # Remote spoke API CA, from the referenced Secret/ConfigMap. Fails
        # closed: if the referenced object/key is missing the pod never
        # starts, so a misconfigured spoke can never fall back to skipping
        # CA verification.
        {{- if $ca.secretName }}
        - name: spoke-remote-ca
          secret:
            secretName: {{ $ca.secretName }}
            items:
              - key: {{ $caKey }}
                path: ca.crt
        {{- else }}
        - name: spoke-remote-ca
          configMap:
            name: {{ $ca.configMapName }}
            items:
              - key: {{ $caKey }}
                path: ca.crt
        {{- end }}
        {{- if $.Values.policy.caBundleConfigMap.name }}
        - name: policy-ca-bundle
          configMap:
            name: {{ $.Values.policy.caBundleConfigMap.name }}
            items:
              - key: {{ $.Values.policy.caBundleConfigMap.key }}
                path: ca-bundle.crt
        {{- end }}
{{- end }}
