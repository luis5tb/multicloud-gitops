{{- if .Values.agentCard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "praxis-proxy.fullname" . }}-agent-card
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "praxis-proxy.labels" . | nindent 4 }}
data:
  agent-card.json: |
    {
      "name": {{ .Values.agentCard.name | quote }},
      "description": {{ .Values.agentCard.description | quote }},
      "version": {{ .Values.agentCard.version | quote }},
      "rpc_url": {{ .Values.agentCard.rpcUrl | default (printf "https://openshift-lightspeed.%s/a2a" (include "praxis-proxy.appsDomain" .)) | quote }},
      "skills": {{ .Values.agentCard.skills | default (list (dict "name" "investigate" "description" "Investigate OpenShift cluster issues and answer questions" "tags" (list "investigation" "troubleshooting"))) | toJson }}
    }
{{- end }}
