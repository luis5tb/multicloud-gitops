{{- $np := .Values.egressGatewayConfig.networkPolicy }}
{{- if and $np.enabled (gt (len .Values.egressGateways) 0) }}
{{- if not $np.ingressFromNamespaces }}
{{- fail "egressGatewayConfig.networkPolicy.ingressFromNamespaces must list at least one namespace when egress gateways and their NetworkPolicy are enabled" }}
{{- end }}
{{- if not $np.ingressPodSelector }}
{{- fail "egressGatewayConfig.networkPolicy.ingressPodSelector must be a non-empty LabelSelector, so a namespace allow-list never becomes namespace-wide access" }}
{{- end }}
{{- range $key, $cfg := .Values.egressGateways }}
{{- $name := include "praxis-proxy.egressGatewayName" $key }}
{{- $labelCtx := dict "root" $ "key" $key }}
{{- $up := include "praxis-proxy.egressGatewayUpstream" $cfg | fromJson }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "praxis-proxy.egressGatewayLabels" $labelCtx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "praxis-proxy.egressGatewaySelectorLabels" $labelCtx | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- range $ns := $np.ingressFromNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns | quote }}
          podSelector:
            {{- toYaml $np.ingressPodSelector | nindent 12 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8443
  # Port-scoped, not FQDN-scoped (plain NetworkPolicy cannot match
  # hostnames); the destinations are pinned by the gateway config instead.
  egress:
    # Cluster DNS: 53 and 5353 (OVN-Kubernetes matches the DNS pods' 5353
    # after Service DNAT -- see the spoke-gateway NetworkPolicy).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
          podSelector:
            matchLabels:
              dns.operator.openshift.io/daemonset-dns: default
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
    # HTTPS: the Keycloak JWKS, the external token endpoint and the upstream.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        {{- if ne $up.port "443" }}
        - protocol: TCP
          port: {{ $up.port }}
        {{- end }}
{{- end }}
{{- end }}
