apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "praxis-proxy.fullname" . }}
  labels:
    {{- include "praxis-proxy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "praxis-proxy.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "praxis-proxy.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: praxis-proxy
          image: {{ include "praxis-proxy.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config
            - /etc/praxis/config/praxis.yaml
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: admin-local
              containerPort: 9901
              protocol: TCP
          startupProbe:
            exec:
              command:
                - wget
                - -q
                - -O
                - /dev/null
                - http://127.0.0.1:9901/healthy
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 36
          livenessProbe:
            exec:
              command:
                - wget
                - -q
                - -O
                - /dev/null
                - http://127.0.0.1:9901/healthy
            periodSeconds: 20
            timeoutSeconds: 2
          readinessProbe:
            exec:
              command:
                - wget
                - -q
                - -O
                - /dev/null
                - http://127.0.0.1:{{ .Values.service.port }}/health/ready
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/praxis/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "praxis-proxy.fullname" . }}
            defaultMode: 0444
