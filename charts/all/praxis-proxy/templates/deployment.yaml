apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "praxis-proxy.fullname" . }}
  labels:
    {{- include "praxis-proxy.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "praxis-proxy.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "praxis-proxy.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.policy.caBundleSync.enabled }}
        ca-bundle-sync-sha256: ""
        {{- end }}
    spec:
      {{- if .Values.dnsIPv4Only.enabled }}
      # Resolve through the loopback AAAA-stripping CoreDNS sidecar so the
      # IPv6-preferring Praxis client only sees IPv4. See values.yaml dnsIPv4Only.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 127.0.0.1
        searches:
          - {{ printf "%s.svc.cluster.local" .Release.Namespace }}
          - svc.cluster.local
          - cluster.local
          {{- range .Values.dnsIPv4Only.extraSearches }}
          - {{ . | quote }}
          {{- end }}
        options:
          - name: ndots
            value: "5"
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
        {{- if .Values.dnsIPv4Only.enabled }}
        # "Safe" sysctl (accepted by OpenShift's restricted-v2 SCC): lets the
        # non-root CoreDNS sidecar bind loopback:53 without NET_BIND_SERVICE.
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "53"
        {{- end }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: praxis-proxy
          image: {{ include "praxis-proxy.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if or .Values.policy.caBundleConfigMap.name .Values.logLevel }}
          env:
            {{- if .Values.policy.caBundleConfigMap.name }}
            - name: SSL_CERT_FILE
              value: /etc/praxis/ca-bundle/ca-bundle.crt
            {{- end }}
            {{- if .Values.logLevel }}
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            {{- end }}
          {{- end }}
          args:
            - --config
            - /etc/praxis/config/praxis.yaml
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: admin-local
              containerPort: 9901
              protocol: TCP
          startupProbe:
            exec:
              command:
                - wget
                - -q
                - -O
                - /dev/null
                - http://127.0.0.1:9901/healthy
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 36
          livenessProbe:
            exec:
              command:
                - wget
                - -q
                - -O
                - /dev/null
                - http://127.0.0.1:9901/healthy
            periodSeconds: 20
            timeoutSeconds: 2
          readinessProbe:
            exec:
              command:
                - wget
                - -q
                - -O
                - /dev/null
                - http://127.0.0.1:{{ .Values.service.port }}/readiness
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/praxis/config
              readOnly: true
            {{- if .Values.policy.caBundleConfigMap.name }}
            - name: policy-ca-bundle
              mountPath: /etc/praxis/ca-bundle
              readOnly: true
            {{- end }}
            {{- if .Values.upstreamTLS.enabled }}
            - name: upstream-ca-bundle
              mountPath: /etc/praxis/upstream-ca
              readOnly: true
            {{- end }}
        {{- if .Values.dnsIPv4Only.enabled }}
        - name: dns-ipv4only
          image: {{ required "praxis-proxy: dnsIPv4Only.image is required when dnsIPv4Only.enabled" .Values.dnsIPv4Only.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -conf
            - /etc/coredns/Corefile
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8053
            periodSeconds: 20
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: 8053
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.dnsIPv4Only.resources | nindent 12 }}
          volumeMounts:
            - name: dns-ipv4only-config
              mountPath: /etc/coredns
              readOnly: true
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "praxis-proxy.fullname" . }}
            defaultMode: 0444
        {{- if .Values.dnsIPv4Only.enabled }}
        - name: dns-ipv4only-config
          configMap:
            name: {{ include "praxis-proxy.fullname" . }}-dns-ipv4only
            defaultMode: 0444
        {{- end }}
        {{- if .Values.policy.caBundleConfigMap.name }}
        - name: policy-ca-bundle
          configMap:
            name: {{ .Values.policy.caBundleConfigMap.name }}
            items:
              - key: {{ .Values.policy.caBundleConfigMap.key }}
                path: ca-bundle.crt
        {{- end }}
        {{- if .Values.upstreamTLS.enabled }}
        - name: upstream-ca-bundle
          configMap:
            name: {{ include "praxis-proxy.fullname" . }}-upstream-ca
            items:
              - key: service-ca.crt
                path: ca-bundle.crt
        {{- end }}
