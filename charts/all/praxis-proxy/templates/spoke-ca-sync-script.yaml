{{- /*
Serving-CA sync bridge (B1). Only rendered when spoke gateways exist:
repo C's `gatewayCASecret` expects a Secret (key ca.crt) in the operator
namespace, but the service CA only arrives via the inject-cabundle
ConfigMap (praxis-spoke-service-ca). The bootstrap Job below copies the
bundle once before sandbox pods start; the CronJob (spoke-ca-sync-cronjob)
keeps it current across service-CA rotation. Shape mirrors the repo's
historical openshift-lightspeed-config keycloak-ca-sync pattern and this
chart's own policy.caBundleSync (Job + CronJob + RBAC + script ConfigMap,
stdlib-only Python). See chart README UNCONFIRMED GUESS #6.
*/}}
{{- if gt (len .Values.spokeGateways) 0 }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "praxis-proxy.fullname" . }}-spoke-ca-sync-script
  labels:
    {{- include "praxis-proxy.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  sync_service_ca.py: |-
{{ .Files.Get "files/sync_service_ca.py" | indent 4 }}
{{- end }}
