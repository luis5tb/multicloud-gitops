{{- /*
PHASE 2 B1. Everything below is disabled by default (empty per-spoke map
in values.yaml). The Praxis-side syntax was VERIFIED at runtime against
the pinned image (ghcr.io/praxis-proxy/ai:0.4.1 / praxis-policy 0.3.1)
locally with podman and a mock IdP -- see the chart README section
"Spoke gateways (B1)" for the verified/open register: the delegator,
TLS listener, header stripping and kube-API pass-through are
VERIFIED-WORKS; real-Keycloak behavior (incl. the STE v2
impersonation-only caveat) and the CA-sync end-to-end path remain open,
so the feature stays off by default.
*/}}
{{- $gatewayNames := dict }}
{{- range $key, $cfg := .Values.spokeGateways }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $key) }}
{{- fail (printf "spokeGateways key %q must be a DNS label (lowercase alphanumerics and '-'): it is embedded in resource names and the Service DNS name repo C's sandbox kubeconfig points at" $key) }}
{{- end }}
{{- if and $.Values.spokeGatewayConfig.execution.enabled (gt (len $key) 45) }}
{{- fail (printf "spokeGateways key %q is too long for the execution gateway name praxis-spoke-%s-exec (maximum key length 45 to keep the DNS label at 63 characters)" $key $key) }}
{{- end }}
{{- $modes := list false }}
{{- if $.Values.spokeGatewayConfig.execution.enabled }}
{{- $modes = append $modes true }}
{{- end }}
{{- range $execution := $modes }}
{{- $name := include "praxis-proxy.spokeGatewayModeName" (dict "key" $key "execution" $execution) }}
{{- $owner := printf "%s/%s" $key (ternary "exec" "read" $execution) }}
{{- if hasKey $gatewayNames $name }}
{{- fail (printf "spoke gateway resource name collision: %s and %s both generate %q; rename a spoke key before enabling execution" (get $gatewayNames $name) $owner $name) }}
{{- end }}
{{- $_ := set $gatewayNames $name $owner }}
{{- end }}
{{- if not (kindIs "map" $cfg) }}
{{- fail (printf "spokeGateways.%s must be a map of per-spoke settings" $key) }}
{{- end }}
{{- if not $cfg.remoteAPIServer }}
{{- fail (printf "spokeGateways.%s.remoteAPIServer is required (https URL of the remote cluster's API server)" $key) }}
{{- end }}
{{- if not (hasPrefix "https://" $cfg.remoteAPIServer) }}
{{- fail (printf "spokeGateways.%s.remoteAPIServer must be an https:// URL; plaintext or insecure-skip-tls-verify upstreams are not supported (see PLAN-lightspeed-hub-migration.md \"PPE behavior and the two TLS legs\")" $key) }}
{{- end }}
{{- if not $cfg.exchangeAudience }}
{{- fail (printf "spokeGateways.%s.exchangeAudience is required (per-spoke Keycloak audience for the exchanged token U)" $key) }}
{{- end }}
{{- $ca := default dict $cfg.remoteCACert }}
{{- if and $ca.secretName $ca.configMapName }}
{{- fail (printf "spokeGateways.%s.remoteCACert: set exactly one of secretName or configMapName, not both" $key) }}
{{- end }}
{{- if not (or $ca.secretName $ca.configMapName) }}
{{- fail (printf "spokeGateways.%s.remoteCACert is required: reference an existing Secret (secretName) or ConfigMap (configMapName) in this namespace holding the spoke API server's CA bundle -- the Deployment fails closed on a dangling reference" $key) }}
{{- end }}
{{- $u := urlParse $cfg.remoteAPIServer }}
{{- $hostPort := $u.host | toString }}
{{- $hostname := $hostPort }}
{{- $port := "443" }}
{{- if contains ":" $hostPort }}
{{- $hostname = index (splitList ":" $hostPort) 0 }}
{{- $port = index (splitList ":" $hostPort) 1 }}
{{- end }}
{{- if not $hostname }}
{{- fail (printf "spokeGateways.%s.remoteAPIServer has no parseable hostname" $key) }}
{{- end }}
{{- if not (regexMatch "^[0-9]+$" $port) }}
{{- fail (printf "spokeGateways.%s.remoteAPIServer has a non-numeric port %q" $key $port) }}
{{- end }}
{{- end }}
{{- if gt (len .Values.spokeGateways) 0 }}
{{- if not $.Values.spokeGatewayConfig.exchangeClient.clientId }}
{{- fail "spokeGatewayConfig.exchangeClient.clientId is required when spokeGateways entries exist (the confidential Keycloak client the gateway authenticates as for the A->U exchange)" }}
{{- end }}
{{- if not $.Values.spokeGatewayConfig.exchangeClient.secretName }}
{{- fail "spokeGatewayConfig.exchangeClient.secretName is required when spokeGateways entries exist (Secret holding the exchanger's client secret; created by charts/all/keycloak-oidc's spoke-gateway-exchanger-secret.yaml)" }}
{{- end }}
{{- if $.Values.spokeGatewayConfig.execution.enabled }}
{{- if not $.Values.spokeGatewayConfig.execution.exchangeClient.clientId }}
{{- fail "spokeGatewayConfig.execution.exchangeClient.clientId is required when spokeGatewayConfig.execution.enabled is true" }}
{{- end }}
{{- if not $.Values.spokeGatewayConfig.execution.exchangeClient.secretName }}
{{- fail "spokeGatewayConfig.execution.exchangeClient.secretName is required when spokeGatewayConfig.execution.enabled is true" }}
{{- end }}
{{- end }}
{{- end }}
{{- $serviceCaRendered := dict }}
{{- range $key, $cfg := .Values.spokeGateways }}
{{- $modes := list (dict "execution" false) }}
{{- if $.Values.spokeGatewayConfig.execution.enabled }}
{{- $modes = append $modes (dict "execution" true) }}
{{- end }}
{{- range $mode := $modes }}
{{- $isExec := $mode.execution }}
{{- $name := include "praxis-proxy.spokeGatewayModeName" (dict "key" $key "execution" $isExec) }}
{{- $modeLabel := ternary "exec" "read" $isExec }}
{{- $client := $.Values.spokeGatewayConfig.exchangeClient }}
{{- $inboundAudience := $.Values.spokeGatewayConfig.inboundAudience | default $client.clientId }}
{{- $secretEnv := "PRAXIS_SPOKE_EXCHANGE_CLIENT_SECRET" }}
{{- $tokenUrl := include "praxis-proxy.spokeExchangeTokenUrl" $ }}
{{- $allowedCallers := $.Values.spokeGatewayConfig.allowedCallers }}
{{- if $isExec }}
{{- $client = $.Values.spokeGatewayConfig.execution.exchangeClient }}
{{- $inboundAudience = $.Values.spokeGatewayConfig.execution.inboundAudience | default $client.clientId }}
{{- $secretEnv = "PRAXIS_SPOKE_EXEC_EXCHANGE_CLIENT_SECRET" }}
{{- $tokenUrl = include "praxis-proxy.spokeExecExchangeTokenUrl" $ }}
{{- $allowedCallers = $.Values.spokeGatewayConfig.execution.allowedCallers | default $.Values.spokeGatewayConfig.allowedCallers }}
{{- end }}
{{- if not (index $serviceCaRendered "done") }}
{{- $_ := set $serviceCaRendered "done" true }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: praxis-spoke-service-ca
  labels:
    {{- include "praxis-proxy.labels" $ | nindent 4 }}
  annotations:
    # Wave -2, same as the sync script ConfigMap: this source ConfigMap
    # MUST land before the spoke-ca-bootstrap Sync hook (wave -1) reads
    # it. With the default wave 0 the hook 404s on a greenfield install
    # (the ConfigMap is only applied after the hook phase), failing the
    # whole sync and leaving every wave-0+ resource Missing -- seen live
    # on bm-cluster 2026-11-23 (the old cluster never hit it because the
    # ConfigMap pre-dated the bridge). The service-ca operator populates
    # service-ca.crt asynchronously after creation; the Job's pod
    # backoff retries cover that short delay.
    argocd.argoproj.io/sync-wave: "-2"
    # The CA the SANDBOX must trust for the gateway's serving certificate:
    # OpenShift's service-ca-operator injects the current cluster
    # service-serving CA bundle into this ConfigMap's `service-ca.crt` key.
    # This is the same mechanism the chart used for its (Task A removed)
    # upstream CA ConfigMap, and the standard in-namespace source for the
    # service CA bundle. Repo C's contract, however, expects a SECRET with
    # key `ca.crt` (controller/agenticrun/gateway.go), so the chart also
    # ships a ConfigMap->Secret sync bridge (spoke-ca-sync-*.yaml,
    # spokeGatewayConfig.servingCA) that copies this bundle into the
    # Secret repo C's `gatewayCASecret` names -- see the chart README
    # UNCONFIRMED GUESS #6.
    service.beta.openshift.io/inject-cabundle: "true"
{{- end }}
{{- $ca := default dict $cfg.remoteCACert }}
{{- $u := urlParse $cfg.remoteAPIServer }}
{{- $hostPort := $u.host | toString }}
{{- $hostname := $hostPort }}
{{- $port := "443" }}
{{- if contains ":" $hostPort }}
{{- $hostname = index (splitList ":" $hostPort) 0 }}
{{- $port = index (splitList ":" $hostPort) 1 }}
{{- end }}
{{- $caKey := $ca.key | default "ca.crt" }}
{{- $caMountPath := "/etc/praxis/spoke-remote-ca/ca.crt" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "praxis-proxy.labels" $ | nindent 4 }}
    praxis-proxy.spoke-gateway: {{ $key | quote }}
    praxis-proxy.spoke-gateway-mode: {{ $modeLabel | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  praxis.yaml: |
    # Per-spoke Praxis configuration for {{ $modeLabel }} gateway "{{ $key }}"
    # (Phase 2 B1). Syntax VERIFIED against the pinned image
    # (ghcr.io/praxis-proxy/ai:0.4.1 / praxis-policy 0.3.1) via a local
    # podman spike; see the chart README "Spoke gateways (B1)" for what
    # was verified and what remains open (real Keycloak, live cluster).
    listeners:
      - name: spoke
        address: "0.0.0.0:8443"
        # VERIFIED schema: TLS certs live under tls.certificates[] (a list
        # of {cert_path, key_path}), NOT directly under tls -- the old
        # tls.{cert_path,key_path} form does not parse on the pinned image.
        # The serving certificate is OpenShift's service-serving cert for
        # the Service (see spoke-gateway-service.yaml's
        # serving-cert-secret-name annotation), so the paths match that
        # Secret's tls.crt/tls.key.
        # Future mTLS-SPIFFE (not enabled): the same tls block also accepts
        # client_cert_mode and trusted_spiffe_ids for mutual-TLS client
        # verification against SPIFFE IDs.
        tls:
          certificates:
            - cert_path: /etc/praxis/serving-cert/tls.crt
              key_path: /etc/praxis/serving-cert/tls.key
        filter_chains: [spoke-gateway]

    filter_chains:
      - name: spoke-gateway
        filters:
          # Same policy filter and same policy.yaml shape as the public
          # gateway: the sandbox presents the caller's Token A (azp must
          # be in policy.allowedCallers), validated against the same
          # trusted issuer(s)/audience. Because A has no groups,
          # pre-exchange policy here cannot require A.groups -- group-based
          # decisions belong to the spoke verifying the exchanged token U.
          # The A->U token exchange itself is NOT a filter: it is the
          # delegator/oauth PLUGIN in this ConfigMap's policy.yaml (see
          # below), driven by the delegate() step on the catch-all route.
          - filter: policy
            config_path: /etc/praxis/config/policy.yaml
            allow_private_idp: {{ $.Values.policy.allowPrivateIdp }}
            require_protocol_metadata: false
            init_timeout_secs: 30

          # Strip internal credential/routing metadata before forwarding.
          # VERIFIED schema: Core's `headers` filter with request_remove
          # (the old `strip_headers` field on the delegator does not exist
          # on the pinned image). A `forwarded_headers` filter also exists
          # upstream if explicit forwarding (rather than removal) of
          # X-Forwarded-* is ever wanted.
          - filter: headers
            request_remove:
              - X-OLS-Cluster
              - X-Forwarded-For
              - X-Forwarded-Host
              - X-Forwarded-Proto
              - X-Forwarded-Server
              - Forwarded

          # Readiness is answered by the proxy itself so the pod's readiness
          # probe does not depend on the remote spoke API. /readiness is
          # explicitly allowed (unauthenticated) in policy.yaml, same as the
          # public gateway.
          - filter: static_response
            conditions:
              - when:
                  path: /readiness
                  methods: [GET]
            status: 200
            body: "ok"

          # VERIFIED-WORKS on the pinned image: arbitrary kube-API methods,
          # paths and query strings, incremental SSE watch streaming,
          # websocket 101 upgrade with bidirectional frames, 5MB bodies and
          # Expect: 100-continue all pass through (see chart README for the
          # residual kubectl-exec SPDY subprotocol question, which needs a
          # live cluster). The route matches ALL paths and forwards to ONE
          # fixed, operator-configured remote cluster (never a caller-
          # supplied URL or header).
          - filter: router
            routes:
              - path_prefix: /
                cluster: spoke-api

          # Fixed remote upstream. The clusters[].tls.{sni,verify,ca.ca_path}
          # schema is the one byte-for-byte confirmed between Core v0.7.0
          # (what the pinned ai:0.4.1 embeds) and v0.7.2 and validated live
          # during the routing era (see chart README "Validation evidence").
          # verify: true with the spoke's own CA -- no
          # insecure-skip-tls-verify, no arbitrary redirects carrying
          # credentials.
          - filter: load_balancer
            clusters:
              - name: spoke-api
                endpoints:
                  - "{{ $hostname }}:{{ $port }}"
                tls:
                  sni: {{ $hostname | quote }}
                  verify: true
                  ca:
                    ca_path: {{ $caMountPath | quote }}

    admin:
      # Kept on loopback: only container-local health probes can access it.
      address: "127.0.0.1:9901"

    # Same opt-ins as the main gateway: the fixed spoke API endpoint is a
    # static in-cluster/private destination, so the pinned image's
    # config-load-time and runtime private-address checks need these. They
    # only ever apply to the single operator-configured endpoint above.
    insecure_options:
      allow_private_endpoints: true
      allow_private_upstreams: true
    {{- with $.Values.spokeGatewayConfig.maxResponseBytes }}
    # Global response ceiling (Praxis default 10 MiB when omitted). Kube
    # API responses stream through here; an unbounded `kubectl logs` of a
    # chatty pod exceeds the default and fails with 500 "streamed response
    # body exceeds global body limit" (VERIFIED LIVE 2026-11-20, 12.4 MB log).
    body_limits:
      max_response_bytes: {{ int . }}
    {{- end }}
  policy.yaml: |
{{- /*
    The spoke's policy.yaml is the shared files/policy.yaml PLUS the B1
    delegation additions, gated on a __delegation flag injected into a
    deep-copied Values tree (so the PUBLIC gateway's policy.yaml -- rendered
    from the same file without the flag -- is byte-identical to before and
    never contains the delegator). The flag selects:
      * the delegator/oauth plugin (kind/hooks/capabilities/config schema
        VERIFIED on the pinned image vs a mock IdP doing RFC 8693 exchange),
        whose client_secret_source names the env var the spoke Deployment
        already injects (PRAXIS_SPOKE_EXCHANGE_CLIENT_SECRET);
      * the delegate() step appended to the catch-all route's
        pre_invocation, exchanging inbound Token A for an
        audience-{{ $cfg.exchangeAudience }} Token U before forwarding to
        the spoke-api cluster.
    Empirical gotchas are recorded as comments in files/policy.yaml.
*/}}
{{- $spokeValues := deepCopy $.Values }}
{{- $_ := set $spokeValues "__delegation" (dict "plugin" "spoke-delegator" "target" "spoke-api" "audience" $cfg.exchangeAudience "clientId" $client.clientId "secretEnv" $secretEnv "tokenUrl" $tokenUrl) }}
{{- /* Inbound audience for local-Keycloak tokens: the audience of the hop
      THIS gateway fronts -- its own exchanger client ID by default, since
      Keycloak only exchanges a subject token carrying the exchanging client
      in `aud`. Never the hub gateway's identity.keycloak.audience (that is
      mas-a2a, which the run token R does not carry).
      VERIFIED LIVE (2026-11-20): R = H exchanged by the adapter for
      aud praxis-spoke-gateway, accepted by Keycloak as the subject of this
      gateway's R->U exchange. */}}
{{- $_ := set $spokeValues.identity.keycloak "audience" $inboundAudience }}
{{- /* azp allow-list for the spoke gateways. An exchanged token's `azp` is
      the client that PERFORMED the exchange, so the run token R carries
      azp=<adapter exchanger client> (lightspeed-hub-a2a), not the original
      caller (acme-agent). VERIFIED-BROKEN LIVE (2026-11-20): inheriting the
      hub gateway's policy.allowedCallers denied every sandbox kube call with
      403 "not an allow-listed caller". Empty = inherit (Token A mode). */}}
{{- with $allowedCallers }}
{{- $_ := set $spokeValues.policy "allowedCallers" . }}
{{- end }}
{{ tpl ($.Files.Get "files/policy.yaml") (dict "Values" $spokeValues "Chart" $.Chart "Release" $.Release "Template" $.Template) | indent 4 }}
{{- end }}
{{- end }}
