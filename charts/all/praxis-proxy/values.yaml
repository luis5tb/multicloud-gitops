fullnameOverride: praxis-proxy

replicaCount: 1

# RUST_LOG for the Praxis binary (it's built on Rust's `tracing` ecosystem).
# Unset by default -- the binary's own built-in default applies (sparse,
# roughly info-level: occasional events like a JWKS refresh, not per-request
# detail). Can be a bare level ("debug") applied to the whole binary, or
# scoped per-crate/module to avoid flooding logs with irrelevant detail, e.g.
# "info,praxis_filter=debug,praxis_policy_plugin_identity_jwt=debug" (crate
# names are literally the module-path prefix already shown in each log
# line -- praxis_filter covers routing/load-balancing, see
# praxis_policy_plugin_identity_jwt for JWT validation). Confirmed live that
# per-cluster routing/request counts are also available without any log
# level change at all, via the admin-only (loopback) metrics endpoint:
# `oc exec <pod> -- wget -q -O - http://127.0.0.1:9901/metrics`.
logLevel: ""

image:
  repository: ghcr.io/praxis-proxy/ai
  # Pin an upstream release; do not use latest for the authorization gateway.
  #
  # DELIBERATELY NOT BUMPED to "0.7.2": that is a Praxis *Core* pre-release
  # tag, not a praxis-proxy/ai release. Checked 2026-10-01 (see chart
  # README "Upstream maturity and pinning" and
  # LIGHTSPEED_DESIGN.md SS7): the newest published `ai` release is
  # still v0.4.1 (2026-09-26, skopeo-confirmed against this exact digest --
  # no numeric tag beyond 0.4.1 exists in the registry), and its own
  # Cargo.lock resolves praxis-proxy-core to 0.7.0. The `ai` main branch
  # (commit 4110021, 2026-10-01) has moved its Cargo.lock to resolve
  # praxis-proxy-core 0.7.2, so upstream is actively integrating it, but
  # `main` is an unpinned floating branch with no release/tag/digest --
  # not something to deploy from. Building our own image from that commit
  # is out of scope for this pass (no Rust toolchain/publish credentials
  # here); re-check for a new tagged `ai` release before the next bump.
  tag: "0.4.1"
  digest: sha256:83c86c059162cd17a0ee7bc3e5146e4be02f811bada6d38027acc6668b8be903
  pullPolicy: IfNotPresent
  pullSecrets: []

service:
  port: 8080

route:
  enabled: false
  host: ""
  # Optional OpenShift HAProxy route timeout for long-running A2A requests.
  timeout: ""
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

# This chart is a generic policy-enforcing A2A gateway. It currently
# configures NO upstream clusters: the OpenShift Lightspeed investigation
# backend it used to front was removed (see PLAN-lightspeed-hub-migration.md
# Task A); a future backend (Task B, lightspeed-hub) will re-introduce
# routed upstreams. Until then Praxis serves its own agent card and
# readiness (see files/praxis.yaml) and enforces the caller allow-list.
global:
  # Single cluster-domain anchor shared across this pattern's charts (see
  # templates/_helpers.tpl). Base domain WITHOUT the apps. prefix, e.g.
  # ocp.example.com; falls back to the framework-injected localClusterDomain
  # (apps wildcard domain) with apps. stripped. Empty here keeps the chart
  # generic -- the real value comes from the clustergroup values layer.
  clusterBaseDomain: ""
  localClusterDomain: ""
  # Keycloak realm the issuer URL derives from (must equal the keycloak-oidc
  # Application's keycloak.realm). Defaults to rca.
  keycloakRealm: ""

identity:
  keycloak:
    # Derived from global.clusterBaseDomain + global.keycloakRealm when empty
    # (https://keycloak.apps.<base>/realms/<realm>) -- see
    # templates/_helpers.tpl's effectiveIssuerUrl. Set explicitly only to
    # override that derivation.
    issuerUrl: ""
    # Inbound audience expected on local-Keycloak tokens. Must be set to
    # whichever audience this gateway's callers' tokens actually carry; there
    # is no default because the audience belongs to the backend contract, not
    # this chart. Used for the local Keycloak issuer in both modes: alone in
    # single-issuer mode (identity.oidcIssuers empty), and for the local
    # Keycloak entry the chart appends alongside identity.oidcIssuers in
    # multi-issuer mode (the chart fails loud if it is empty in either mode).
    audience: ""
  # Multi-issuer OIDC configuration for validating tokens from multiple trusted
  # identity providers. When oidcIssuers is non-empty, Praxis validates tokens
  # from ANY of the listed issuers (the list keycloak entry above is ignored).
  # Each issuer entry needs issuer URL, JWKS URL, and the expected audience.
  # Leave empty to use single-issuer mode (identity.keycloak above).
  oidcIssuers: []
    # - name: red-hat-sso-prod
    #   issuerUrl: https://sso.redhat.com/auth/realms/redhat-external
    #   jwksUrl: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/certs
    #   audience: api.ask_red_hat
    # - name: red-hat-sso-stage
    #   issuerUrl: https://sso.stage.redhat.com/auth/realms/redhat-external
    #   jwksUrl: https://sso.stage.redhat.com/auth/realms/redhat-external/protocol/openid-connect/certs
    #   audience: api.ask_red_hat

policy:
  # When true (default), Praxis runs its policy filter: it validates the caller
  # JWT (trusted issuers/JWKS) and enforces the `allowedCallers` azp allow-list
  # before routing. Set false to run Praxis as a pure router/load-balancer (no
  # token verification, no azp gate) -- only do this when a downstream boundary
  # validates the token instead. Disabling this also skips the
  # enforcementTest Job (it asserts Praxis DENIES, which cannot hold when the
  # policy filter is off). See the chart README and agents/AUTHENTICATION.md.
  enabled: true
  allowedCallers:
    - acme-agent
  # Allow-list enforcement check (PostSync hook Job). Guards against a silent
  # fail-open regression: the pinned Praxis image has admitted every
  # validly-signed token before (see files/policy.yaml and AGENTS.md), so this
  # asserts the proxy DENIES a caller whose azp is not in the allow-list. A
  # forwarded/200 fails the Job (and the sync) instead of going unnoticed.
  # Enabled by default. See files/enforcement_check.py and the chart README.
  enforcementTest:
    enabled: true
    # Image for the check Job (Python stdlib only -- no extra deps).
    image: registry.access.redhat.com/ubi9/python-312-minimal:9.6
    # Any protected path (not /.well-known/agent-card.json or /readiness, which
    # are public by design) -- the catch-all route requires auth.
    protectedPath: /
    timeoutSeconds: 30
    # STRONG check (opt-in): credentials for a Keycloak client whose azp is NOT
    # in allowedCallers above. When set, the Job mints a real, validly-signed
    # token and asserts Praxis denies it on azp -- the check that actually
    # catches the allow-list fail-open. Left empty, the Job runs only the
    # weaker always-on check (unauthenticated/bad-token requests are rejected),
    # which does NOT exercise that specific fail-open. See chart README.
    minter:
      clientId: ""
      clientSecret:
        # Reference an existing Secret key holding the client secret.
        name: ""
        key: client-secret
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  # Praxis AI 0.4.1 only exposes a filter-wide private-destination opt-in.
  # Enable only when a statically configured policy endpoint (such as the
  # Keycloak JWKS URL) resolves to a non-public cluster address. This also
  # permits loopback and link-local destinations, so keep policy callouts
  # operator-controlled and never user-supplied.
  allowPrivateIdp: false
  caBundleConfigMap:
    name: ""
    key: ca-bundle.crt
  caBundleSync:
    enabled: false
    sourceNamespace: openshift-config-managed
    sourceConfigMap: default-ingress-cert
    sourceKey: ca-bundle.crt
    targetConfigMapName: praxis-keycloak-ca
    # SSL_CERT_FILE replaces OpenSSL's default trust store, so when policy
    # enforcement validates external OIDC issuers (e.g. Red Hat SSO's public
    # JWKS) the synced bundle must also carry public roots, not just the cluster
    # ingress CA. When true, the sync appends the sync container's own public CA
    # roots to the ingress CA. Required for policy.enabled=true with external
    # issuers; harmless (public roots) when only Keycloak is validated.
    includeSystemRoots: false
    systemRootsPath: /etc/pki/tls/certs/ca-bundle.crt
    schedule: "*/5 * * * *"
    image: registry.access.redhat.com/ubi9/python-312-minimal:9.6
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

securityContext:
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# IPv4-only clusters: the pinned Praxis image's HTTP client resolves external
# hosts to IPv6 and does NOT fall back to IPv4, so on an IPv4-only pod its
# outbound JWKS fetch for policy.oidcIssuers (e.g. Red Hat SSO sso.redhat.com)
# fails with ConnectNoRoute / Network unreachable. That is why the standalone
# variant historically ran policy.enabled=false (router-only). This opt-in
# sidecar runs a tiny CoreDNS that strips AAAA answers and forwards everything
# else to the cluster DNS, and points the pod's own resolver at it
# (dnsPolicy: None), so the Praxis client only ever receives A records and
# connects over IPv4. It lets policy.enabled=true work with external issuers on
# an IPv4-only cluster WITHOUT rebuilding the Praxis image. CoreDNS binds
# loopback:53 as non-root via the "safe" sysctl net.ipv4.ip_unprivileged_port_start
# (accepted by OpenShift's restricted-v2 SCC; verified live). In-cluster names
# still resolve (non-AAAA queries are forwarded unchanged).
dnsIPv4Only:
  enabled: false
  # CoreDNS image. Empty on purpose (AGENTS.md: no image refs in chart defaults).
  # Set it in the variant -- the in-cluster OpenShift CoreDNS image is a good
  # choice because it needs no extra pull.
  image: ""
  # Cluster DNS Service ClusterIP that non-AAAA queries are forwarded to.
  # OpenShift's default is the dns-default Service in openshift-dns (172.30.0.10).
  clusterDnsIP: "172.30.0.10"
  # Extra DNS search domains appended after the namespace-scoped cluster ones
  # (dnsPolicy: None requires searches to be set explicitly).
  extraSearches: []
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

# PHASE 2 B1 (verified on the pinned image, still disabled by default):
# per-spoke Praxis
# spoke-gateways -- internal, TLS-serving proxy endpoints that forward the
# sandbox kube-API path to one FIXED registered remote cluster API each,
# exchanging the inbound caller token (A) for a spoke-audience token (U)
# with PPE's own confidential Keycloak client identity before forwarding.
# See PLAN-lightspeed-hub-migration.md "B1 wiring" and
# "PPE behavior and the two TLS legs", and the chart README section
# "Spoke gateways (B1, proposed)".
#
# DISABLED BY DEFAULT (empty map renders nothing). The Praxis-side syntax
# (delegator/oauth plugin + delegate() step, TLS-serving listener, header
# stripping, kube-API pass-through) was VERIFIED at runtime against the
# pinned image (ghcr.io/praxis-proxy/ai:0.4.1, whose Cargo.lock resolves
# praxis-policy to 0.3.1) locally with podman and a mock IdP -- but real
# Keycloak exchange behavior (incl. the STE v2 impersonation-only caveat)
# and live-cluster behavior are still open, and the sandbox-namespace /
# CA-sync wiring is not yet finalized. Do not enable until those close.
# Every verified/open item is listed in the chart README's "Spoke gateways
# (B1)" register.
#
# Map keyed by target-cluster name (a DNS label: lowercase alphanumerics
# and '-'; it is embedded in resource names and in the Service DNS name
# repo C's generated sandbox kubeconfig points at, e.g.
# https://praxis-spoke-<name>.praxis-proxy.svc.cluster.local:8443 --
# keep it in sync with repo C's config template). The map is PURELY
# per-spoke: shared cross-spoke settings live in spokeGatewayConfig
# below, so a spoke literally named "exchangeClient" or "networkPolicy"
# renders (or fails validation) as a spoke -- it is never silently
# dropped as a reserved key. Each entry:
#
#   remoteAPIServer  (required) https URL of the remote cluster's API
#                    server, e.g. https://api.<spoke-domain>:6443. The
#                    gateway dials this FIXED host over new HTTPS,
#                    verifying the remote CA and SNI. Never caller input.
#                    The URL's port (parsed at render time) is also what
#                    the per-spoke egress NetworkPolicy allows, alongside
#                    TCP 443 (Keycloak/JWKS) and cluster DNS.
#   exchangeAudience (required) per-spoke Keycloak audience minted onto the
#                    exchanged token U (must have a matching audience
#                    mapper in charts/all/keycloak-oidc's
#                    keycloak.spokeGatewayExchanger.spokeAudiences).
#   remoteCACert     (required) reference to an existing Secret or
#                    ConfigMap in THIS namespace holding the spoke API
#                    server's CA bundle -- the pattern the chart used for
#                    its (since-removed) upstream CA: a plain Secret or
#                    ConfigMap referenced by name and key, which must
#                    already exist (the Deployment fails closed if the
#                    reference is dangling). The in-cluster
#                    inject-cabundle annotation CANNOT be used here: it
#                    only trusts Services in this same cluster, not a
#                    remote spoke's API CA (see historical
#                    upstream-ca-configmap.yaml, removed with Task A).
#                      secretName: name of an existing Secret
#                      configMapName: name of an existing ConfigMap
#                      key: key inside it holding the CA bundle
#                           (default ca.crt)
#                    Exactly one of secretName/configMapName is required.
#   replicas         (optional, default 1) per-spoke gateway replicas.
spokeGateways: {}
  #  example-spoke:
  #    remoteAPIServer: "https://api.example-spoke.example.test:6443"
  #    exchangeAudience: "praxis-spoke-example-spoke"
  #    remoteCACert:
  #      secretName: praxis-spoke-example-spoke-api-ca
  #      key: ca.crt
  #    replicas: 1

# Shared spoke-gateway settings (apply to every entry in spokeGateways;
# kept OUT of that map so it stays purely per-spoke). Nothing here
# renders while spokeGateways is empty.
spokeGatewayConfig:
  # PPE's own exchanger client identity, shared by every spoke gateway
  # (the exchange is performed by the gateway, not the sandbox). The
  # client and its Vault-backed secret are created by
  # charts/all/keycloak-oidc (keycloak.spokeGatewayExchanger) -- the
  # ExternalSecret lands in this namespace as this Secret name.
  exchangeClient:
    # Client ID of the confidential Keycloak client the gateway
    # authenticates as when exchanging A for U.
    clientId: praxis-spoke-gateway
    # Secret (in this namespace) holding the exchanger's client secret
    # under secretKey. Created by charts/all/keycloak-oidc's
    # spoke-gateway-exchanger-secret.yaml when
    # keycloak.spokeGatewayExchanger.enabled is true.
    secretName: praxis-spoke-gateway-client
    secretKey: client-secret
    # Keycloak token endpoint used for the exchange. Empty derives
    # <issuer>/protocol/openid-connect/token from
    # identity.keycloak.issuerUrl (i.e. from global.clusterBaseDomain);
    # override only to diverge.
    tokenUrl: ""
  # Best-effort NetworkPolicy hardening per gateway pod (rendered once per
  # spoke-gateway entry). Plain Kubernetes NetworkPolicies cannot match on
  # FQDNs: the remote API / IdP / JWKS egress rule below is port-scoped
  # only (TCP 443 plus the spoke's own parsed remote API port, to
  # anywhere), and real FQDN-aware enforcement needs CNI egress
  # facilities (EgressFirewall/FirewallPolicy, egress routers) --
  # exactly what PLAN-lightspeed-hub-migration.md records. Egress to the
  # cluster DNS (openshift-dns) is allowed for name resolution.
  networkPolicy:
    enabled: true
    # Namespaces allowed to reach the gateway's 8443 listener (the
    # sandbox pods repo C creates). The [mao] default is a PLACEHOLDER
    # tied to design-doc open question Q4 (where repo C's sandboxes run
    # is undecided -- repo C currently runs them in its operator
    # namespace): it is a mandatory-override value, not a correct
    # default. Set it to repo C's actual sandbox namespace(s) in
    # variants/standalone/values-standalone.yaml before enabling.
    ingressFromNamespaces:
      - mao
  # Serving-CA delivery bridge to repo C (lightspeed-agentic-operator,
  # a2a-support): repo C's `gatewayCASecret` expects a SECRET with key
  # `ca.crt` (controller/agenticrun/gateway.go mounts it as the
  # kubeconfig's certificate-authority), but OpenShift's
  # service-ca-operator only injects the serving-CA bundle into a
  # CONFIGMAP key (`service-ca.crt`). This bridge mirrors the repo's
  # historical CA-sync shape (one-shot bootstrap Job + CronJob + RBAC +
  # stdlib-only Python script) copying the praxis-spoke-service-ca
  # ConfigMap bundle into the Secret named below. The Secret is created
  # and rotated by the sync job (NOT rendered as a manifest, so Argo
  # never fights the job's writes). The OpenShift service CA ROTATES
  # (roughly every two years, with overlap); the CronJob keeps the
  # Secret current so repo C sandboxes keep verifying the gateway's
  # serving cert across rotation.
  servingCA:
    # Target Secret name. Must equal repo C's `gateway-ca-secret`
    # configuration value (what values-standalone passes to repo C).
    secretName: praxis-spoke-gateway-ca
    # Key inside the target Secret (repo C's contract: ca.crt).
    secretKey: ca.crt
    # Namespace the sync job writes the Secret into. Empty (default)
    # writes into this chart's namespace. NOTE: repo C consumes the
    # Secret from the OPERATOR namespace where its controller runs --
    # in the standalone variant this MUST be set to repo C's operator
    # namespace (the sync job's RBAC is rendered there accordingly).
    targetNamespace: ""
    # Source ConfigMap (in this chart's namespace) carrying the
    # inject-cabundle serving-CA bundle.
    sourceConfigMap: praxis-spoke-service-ca
    sourceKey: service-ca.crt
    # How often the CronJob re-syncs the bundle (service-CA rotation
    # and re-injection are not instantaneous; hourly is cheap and keeps
    # the Secret well within the rotation overlap window).
    schedule: "0 * * * *"
    # Image for the sync Job (Python stdlib only -- no extra deps).
    image: registry.access.redhat.com/ubi9/python-312-minimal:9.6
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

# Static agent card served by Praxis at the A2A discovery paths. The card is
# generic by design: this gateway currently fronts no investigation backend
# (see the global comment above), so it only advertises itself. rpcUrl is
# derived from the Praxis Route when empty. Override name/description in the
# variant when a backend with real skills is introduced.
agentCard:
  enabled: true
  name: "praxis-a2a-gateway"
  description: "Policy-enforcing A2A gateway. No agent backend is currently registered behind it."
  # Empty derives https://praxis-proxy.apps.<clusterBaseDomain>/a2a
  rpcUrl: ""
  version: "1.0.0"
