replicaCount: 1

image:
  repository: quay.io/containers/kubernetes_mcp_server
  tag: latest
  pullPolicy: IfNotPresent
  pullSecrets: []

serviceAccount:
  create: true
  name: ""
  # server.clusterAuthMode=passthrough gets its security from replacing this
  # SA's own token with the caller's forwarded token per request in code, not
  # from denying the mount -- the client library still needs it to construct
  # any in-cluster connection at all (host/port/CA come from the same
  # projected volume). Disabling this breaks startup entirely: "in-cluster
  # manager cannot be used outside of a cluster".
  automountToken: true

service:
  port: 8080

server:
  enabledTools:
    - resources_create_or_update
    - resources_get
  readOnly: false
  requireOAuth: true
  skipJWTVerification: true
  clusterAuthMode: passthrough
  stateless: true
  logLevel: 2

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

securityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
