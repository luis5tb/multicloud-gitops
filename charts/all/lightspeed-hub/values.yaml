# M4 SKELETON (DISABLED BY DEFAULT). This chart deploys the hub A2A adapter
# (docs/LIGHTSPEED_HUB_ADAPTER_DESIGN.md, Task B) and the
# lightspeed-agentic-operator (repo C, branch a2a-support) stack it drives.
# The Go adapter is being built in parallel (M1-M3); every adapter env var,
# image and flag below is a PLACEHOLDER pending the adapter's final contract (source: lightspeed-hub repo, branch a2a, module a2a-adapter).
# Nothing renders while enabled=false -- the pattern can carry the chart
# dormant, exactly like charts/all/mao/mas-a2a's a2a.enabled gating.
#
# Per repo convention (AGENTS.md): all defaults here are generic/empty -- no
# real hostnames, trust domains or image pins belong in this file. Cluster-
# specific values go in variants/standalone/values-standalone.yaml only.

# Top-level gating, mirroring mas-a2a's a2a.enabled pattern: with false, the
# chart renders NO Kubernetes resources. Flip to true only after the M1-M3
# outputs land (real image pin, final adapter flags, confirmed run namespace).
enabled: false

global:
  # Single cluster-domain anchor shared across this pattern's charts (see
  # templates/_helpers.tpl). Base domain WITHOUT the apps. prefix, e.g.
  # ocp.example.com; falls back to the framework-injected localClusterDomain
  # (apps wildcard domain) with apps. stripped. Empty here keeps the chart
  # generic -- the real value comes from the clustergroup values layer. The
  # Keycloak issuer URL the adapter exchanges tokens against derives from it.
  clusterBaseDomain: ""
  localClusterDomain: ""
  # Keycloak realm the issuer URL derives from (must equal the keycloak-oidc
  # Application's keycloak.realm). Defaults to rca.
  keycloakRealm: ""

fullnameOverride: ""
nameOverride: ""

imagePullSecrets: []
replicaCount: 1

serviceAccount:
  create: true
  # Dedicated SA for the adapter. The adapter must NEVER create AgenticRuns
  # as this SA's own identity (design doc §3.3) -- it impersonates the
  # requester's Token H; the SA exists for the run-token Secret writer role
  # (§5.2) and controller watch permissions only.
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

service:
  # Internal-only ClusterIP Service (design §1: reachable only through
  # Praxis; NO Route is rendered by this chart, ever). Port 8443: the
  # adapter serves TLS by default (adapter.tls below), matching
  # praxis-proxy's a2aUpstream.port default.
  type: ClusterIP
  port: 8443

adapter:
  # PLACEHOLDER image pending a published adapter build (source: lightspeed-hub repo, branch a2a). The final pin
  # must be an immutable digest or exact tag, QUOTED in the variant (the
  # all-digit-tag/scientific-notation trap -- see docs/ARCHITECTURE.md).
  # The adapter gets its OWN image, separate from repo B / repo C images
  # (design §8.2: independent upgrade cadence).
  image:
    repository: quay.io/example/lightspeed-hub-adapter
    tag: placeholder
    digest: ""
    pullPolicy: IfNotPresent

  # Listen port of the A2A server (flag --listen). With adapter.tls
  # enabled (the default) this is the TLS port; praxis-proxy's
  # a2aUpstream connects here over TLS.
  port: 8443

  # TLS serving (adapter flags --tls-cert-file/--tls-key-file; the
  # adapter's config.Validate requires both set together or both empty).
  # PRODUCTION SHAPE (default, enabled): the Service carries
  # service.beta.openshift.io/serving-cert-secret-name so OpenShift's
  # service-ca operator mints and rotates a serving cert (tls.crt/tls.key)
  # into servingCertSecretName; the Deployment mounts that Secret and
  # passes certFile/keyFile as the two flags. This is required because
  # praxis-proxy's a2aUpstream hop connects over TLS and verifies the
  # service-serving CA. UNCONFIRMED (live-cluster only): that the
  # service-ca operator actually issues the cert for this Service on the
  # target cluster -- the annotation is standard OpenShift but issuance
  # has not yet been observed on a live install.
  # enabled=false = plain HTTP (both flags OMITTED entirely): LOCAL DEV
  # ONLY (e.g. a port-forward to a locally-run adapter); never use behind
  # Praxis on a real cluster. servingCertSecretName empty means
  # <fullname>-serving-cert.
  tls:
    enabled: true
    servingCertSecretName: ""
    certFile: /etc/a2a-adapter/tls/tls.crt
    keyFile: /etc/a2a-adapter/tls/tls.key

  # spec.analysis.agent on created runs (flag --run-agent). "default" is
  # the AgenticRun CRD's own documented default agent.
  runAgent: default

  # M3 bounds (design §2.3/§5.5/§6.4), as Go duration strings -- the
  # defaults mirror the adapter's flag defaults exactly
  # (a2a-adapter/internal/config/config.go); override only with reason.
  clockSkew: 30s            # grace after exp in the pre-start Token A check
  streamDeadline: 30m       # wall-clock bound on message/stream
  renewalTimeout: 15m       # per-pause auth-required window (§6.4)
  maxCredentialPauses: 3    # total credential pauses per run (§6.4)
  terminalCleanupGrace: 1m  # grace after terminal before the run-token Secret is deleted (§5.5)
  sweepInterval: 5s         # watcher sweeper cadence

  # Namespace where AgenticRuns, their run-token Secrets (ls-run-token-{uid})
  # and repo C's sandbox pods live. Design §8.3: adapter + sandboxes + runs
  # all share the operator namespace so the §5.2 writer/reader RBAC isolation
  # is exact. Empty ("") means the chart's own release namespace (the
  # lightspeed-hub Application namespace) -- the recommended single-namespace
  # shape. UNCONFIRMED GUESS pending design open question Q4 (live Phase 0
  # confirmation of where repo C actually runs sandboxes in this branch).
  runNamespace: ""

  # Hub audience of the A->H token exchange (design §3.2). REQUIRED when
  # enabled -- no default, because the audience belongs to the Keycloak
  # backend contract (keycloak-oidc chart work), not this chart.
  hubAudience: ""

  # RUN TOKEN (the adapter's --run-token-audience). When set, the adapter
  # stores R = exchange(Token A, this audience) in the run-token Secret
  # instead of the caller's raw Token A. R's lifespan is the exchange
  # client's (keycloak-oidc hubExchange.accessTokenLifespanSeconds), so a
  # short-lived Token A no longer cuts an AgenticRun step short, and R is
  # usable only at the spoke gateway (praxis-proxy
  # spokeGatewayConfig.inboundAudience). Must equal keycloak-oidc's
  # hubExchange.runTokenAudience (the audience mapper that makes it
  # requestable). Empty = store Token A (requires the adapter image with
  # the flag; older images reject unknown flags).
  runTokenAudience: ""

  # The inbound bearer is already Token H: the Praxis hub gateway
  # (praxis-proxy a2aUpstream.exchangeAtPraxis) exchanged the caller's
  # Token A before forwarding. The adapter creates AgenticRuns with it
  # directly (no A->H exchange) and, with runTokenAudience, exchanges H into
  # the run token R -- it never sees Token A. adapter.keycloak.clientId must
  # then be Token H's audience (praxis-proxy a2aUpstream.exchange.audience),
  # since Keycloak only lets the client named in H's `aud` exchange it.
  inboundHubToken: false

  # Deterministic target header (design §4.2). Header name for the hub leg;
  # the model never constructs it -- rename is chart-level, decided with the
  # concurrent praxis work. UNCONFIRMED GUESS: "X-Hub-Cluster" is the design
  # doc's proposal, not a confirmed final name.
  targetHeader: X-Hub-Cluster

  # Fail-fast allow-list of spoke names passed as the adapter's
  # --allowed-targets flag (comma-joined). Empty = no enforcement (the
  # admission policy is the hard gate either way). MUST stay identical to
  # praxis-proxy's spokeGateways keys -- the adapter's unknown-target
  # failure is the model-facing spelling guard, not a security boundary.
  allowedTargets: []

  # "Only the configured group can create AgenticRuns" (Phase 1 RBAC goal):
  # the Kubernetes GROUP (as the hub API maps it from the exchanged Token
  # H's groups claim -- with the default OIDC groupsPrefix, "keycloak:<
  # Keycloak group>", e.g. keycloak:acme-agent-rca) bound to a Role
  # granting create on agenticruns in the run namespace. Empty (default)
  # renders no RoleBinding, which together with the deny-all admission
  # policy keeps run creation fully closed. This gates creation itself;
  # the admission policy additionally restricts WHICH targetCluster --
  # see templates/run-creators-rbac.yaml.
  hubRunCreatorsGroup: ""

  keycloak:
    # Issuer the adapter validates Token A against / exchanges A->H at.
    # issuerUrl derives from global.clusterBaseDomain + global.keycloakRealm
    # (https://keycloak.apps.<base>/realms/<realm>) when empty; tokenUrl
    # derives as <issuer>/protocol/openid-connect/token when empty. Override
    # only to diverge. Both must be https -- the adapter rejects anything
    # else at startup (credentials in transit).
    issuerUrl: ""
    tokenUrl: ""
    # Confidential Keycloak client the adapter authenticates as for the
    # A->H exchange (design §3.2 fallback placement: the adapter performs the
    # exchange itself until/unless Praxis can -- Q3). The client and its
    # Vault-backed secret are keycloak-oidc chart work (M1). NOT required
    # (and must be empty) in SVID mode -- see adapter.svid below: the
    # adapter's config.Validate makes client auth either secret OR SVID.
    clientId: ""
    clientSecretSecret:
      name: ""
      key: client-secret
    # Outbound HTTPS trust (independent of adapter.tls serving and SVID auth).
    # Opt in when the issuer Route uses a private CA. Reuses the adapter image:
    # it must contain /bin/sh, cat, grep and a system/public PEM CA bundle.
    # An init container combines that bundle with this namespace-local
    # ConfigMap; SSL_CERT_FILE points Go at the result. Never private-CA-only.
    # Provision the ConfigMap separately, e.g. keycloak-oidc's caBundleSync.
    # On CA rotation replace the pods: init output and Go roots do not reload
    # merely because the source ConfigMap changes (see README).
    caTrust:
      enabled: false
      caBundleConfigMapName: ""
      caBundleKey: ca-bundle.crt
      # Empty auto-detects common system bundle paths; a nonempty override
      # must exist and contain PEM certificates (no silent fallback).
      publicBundlePath: ""
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi

  # SPIFFE SVID client auth for the A->H exchange (alternative to the
  # confidential client above; mirrors the adapter's --svid-socket flag /
  # SPIFFE_SOCKET env). When enabled: keycloak.clientId must be empty and
  # no clientSecretSecret is needed; the pod receives the Workload API
  # socket path via the SPIFFE_SOCKET env (the socket itself must be
  # provided by the cluster's SPIRE/SPIFFE deployment -- wire the volume
  # in the variant; this chart only passes the path through).
  svid:
    enabled: false
    socketPath: unix:///run/spire/sockets/agent.sock

  # Agent-card fields (design §2.1; flags --card-*). The name default is
  # aligned with the ADAPTER FLAG DEFAULT "lightspeed-hub"
  # (a2a-adapter/internal/config/config.go) -- do not diverge the two
  # without changing both. url is the Praxis-fronted RPC endpoint callers
  # use; empty derives https://praxis-proxy.apps.<clusterBaseDomain>/a2a
  # (templates/_helpers.tpl lightspeed-hub.agentCardUrl). It MUST be
  # non-empty and point at Praxis when praxis-proxy's
  # a2aUpstream is on: Praxis then serves THIS card to callers,
  # and a2a-sdk (MAS) needs the url to pick the 0.3 JSON-RPC transport.
  # protocolVersion must stay 0.3.x -- the adapter's a2a-go v0.3 server only
  # speaks message/send|message/stream; a "1.0" card makes clients call
  # SendMessage/SendStreamingMessage and fail with "method not found".
  agentCard:
    name: lightspeed-hub
    description: "Red Hat cluster investigation via lightspeed-hub"
    url: ""
    version: 0.1.0
    protocolVersion: 0.3.0
    skillId: cluster-investigation
    skillName: "Red Hat cluster investigation"
    skillDescription: "Investigate a Red Hat cluster (or spoke) via the lightspeed-hub agentic stack: analysis-only AgenticRuns with per-run requester credentials."

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# NetworkPolicy hardening: the adapter Service admits ONLY the Praxis pods'
# namespace (design §1). Default matches the praxis-proxy Application's
# namespace in the standalone variant. UNCONFIRMED GUESS: whether a
# namespaceSelector alone is sufficient on the target cluster's CNI (pod
# selector narrowing is a follow-up once praxis-proxy carries stable pod
# labels).
networkPolicy:
  enabled: true
  praxisNamespace: praxis-proxy

# Run-token Secret writer RBAC (design §5.2). The adapter SA gets a Role in
# the run namespace ONLY, granting create/get/update/delete on secrets --
# delete is the §5.5 terminal-run Secret cleanup grant (M3: implemented in
# a2a-adapter internal/server/watch.go). Namespace isolation is the real
# boundary: no other Secrets should live in the run namespace. The READER
# side is repo C's operator SA in the lightspeed-agentic-operator repo
# (cross-repo: it reads by name, gateway.go, and needs no grant from this
# chart) -- see README.
runTokenSecretRBAC:
  enabled: true

# Requester x target authorization admission policy (design §4.3). A
# ValidatingAdmissionPolicy + binding (CEL, paramKind ConfigMap, mirroring
# repo C's config/admission/agenticrun-suspension-policy.yaml pattern)
# validating spec.targetCluster against the authenticated requester's
# mapping on CREATE/UPDATE of agenticruns.
#
# SAFE DEFAULT: DENY-ALL. The exact authorization mapping (which principal
# may target which spoke) is an OPEN DESIGN ITEM (design §4.3 / §10); until
# admissionPolicy.allowTargets lists a principal, every create/update of an
# AgenticRun with spec.targetCluster set is denied. A missing param ConfigMap
# also denies (parameterNotFoundAction: Deny -- never fail open).
#
# Mapping shape: keys are authenticated request usernames (Token H's mapped
# user, e.g. keycloak-oidc's OIDC username mapping) OR group names -- with
# keycloak-oidc exchangeRoles, Token H's audience-scoped role group, e.g.
# keycloak:lightspeed-hub-a2a:agenticrun-creator; values are lists of
# allowed targetCluster names. An empty map is the deny-all default.
admissionPolicy:
  enabled: true
  paramConfigMapName: lightspeed-hub-target-policy
  allowTargets: {}
    # example (example.test placeholders only -- set real values in the
    # variant, never here):
    # keycloak:acme-agent-rca:
    #   - example-spoke
    # system:serviceaccount:lightspeed-hub:some-client:
    #   - example-spoke

# The lightspeed-agentic-operator (repo C, branch a2a-support) stack.
# Design §8.1 item 5 / §8.3: CRDs, operator Deployment and the configuration
# ConfigMap all land in the run namespace (one namespace shared with the
# adapter and sandbox pods).
agenticOperator:
  enabled: true

  # PLACEHOLDER image pending the pinned repo C a2a-support build (design
  # §8.2). Rollback image = the upstream spoke-sa-mode image (byte-identical
  # behavior when the gateway ConfigMap keys are absent).
  image:
    repository: quay.io/example/lightspeed-agentic-operator
    tag: placeholder
    digest: ""
    pullPolicy: IfNotPresent

  # CRD VENDING DECISION (RESOLVED, M4): the ten agentic.openshift.io CRDs
  # are VENDORED into this chart (templates/agentic-operator-crds.yaml)
  # from the lightspeed-agentic-operator repo's config/crd/bases, branch
  # a2a-support -- see that template's provenance header for the source
  # commit and the re-vendor mechanism (the upstream schema-drift test is
  # the guard against drift with the pinned operator image). Mechanism:
  # a values-gated TEMPLATE (not Helm's crds/ dir) because ArgoCD does not
  # apply a Helm chart's crds/ directory, and crds/ would also install
  # while enabled=false, breaking the dormant-chart guarantee -- see
  # README "CRD source". Each CRD carries argocd sync-wave -1 so it lands
  # before the operator Deployment (default wave 0).
  crds:
    install: true

  # The configuration ConfigMap repo C reads (pkg/configuration/constants.go:
  # ConfigMapName "lightspeed-agentic-configuration"). In gateway mode repo C
  # fails loudly without the three keys below -- this chart mirrors that by
  # failing at render time when they are empty.
  config:
    # sandbox-credential-mode: "gateway" (CredentialModeGateway) or
    # "spoke-sa" (repo C default). Gateway mode requires the two keys below.
    sandboxCredentialMode: gateway
    # gateway-server-url-template: {targetCluster}-substituted URL of the
    # hub-local spoke-facing PPE gateway the sandbox kubeconfig points at.
    # Must match the concurrent praxis-proxy spoke-gateway Service naming,
    # e.g. https://praxis-spoke-{targetCluster}.praxis-proxy.svc.cluster.local:8443.
    # OWNED by the praxis implementer; referenced here (design §8.1 item 6).
    gatewayServerURLTemplate: ""
    # gateway-ca-secret: Secret (in THIS namespace, key ca.crt) holding the
    # spoke gateways' serving CA. Must name the Secret the praxis-proxy
    # chart's spokeGatewayConfig.servingCA bridge maintains (default
    # praxis-spoke-gateway-ca) -- with its targetNamespace set to this
    # chart's namespace.
    gatewayCASecret: ""
    # terminal-ttl-days (optional, repo C default 14): AgenticRun retention
    # before TTL cleanup; A2A artifacts live exactly as long as the CRs
    # (design §2.3).
    terminalTTLDays: 14

  # Sandbox pod the operator runs each step in (ConfigMap keys sandbox-mode /
  # sandbox-pod-spec). image has no default (deployment-owned; set it in the
  # variant) and the render fails when empty.
  sandbox:
    mode: bare-pod
    image: ""
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

  # Agent configuration the operator needs to run anything (all three are
  # CLUSTER-scoped CRs; adapted from the mao-poc-rca branch's
  # lightspeed-agentic-operator chart). VERIFIED-BROKEN LIVE (2026-11-20):
  # with none of them present every adapter-created run failed terminally
  # with `workflow resolution failed: Agent "default" not found`, and -- even
  # with an Agent -- would have stalled waiting for MANUAL Analysis approval,
  # since without an ApprovalPolicy the operator auto-approves only the
  # Escalation stage.
  agent:
    enabled: false
    # The Agent's NAME is always adapter.runAgent (the agent the adapter
    # requests on every AgenticRun), so the two cannot drift.
    # model: the model ID on the provider below (e.g. claude-opus-4-6 for
    # Vertex/Anthropic). No default -- belongs to the deployment, set it in
    # the variant; the render fails when empty.
    model: ""
    maxTurns: 200
    timeouts:
      analysisSeconds: 1200
      executionSeconds: 1200
      verificationSeconds: 600
    # Only GoogleCloudVertex is wired here (the pattern's shared Vault ADC
    # credential, also used by mao/mas-worker). Add another type alongside
    # if needed.
    llmProvider:
      name: vertex
      vertex:
        # GCP project and region of the Vertex AI endpoint. No defaults --
        # set them in the variant (the render fails when empty).
        projectID: ""
        region: ""
        # Anthropic (Claude on Vertex) or Google (Gemini).
        modelProvider: Anthropic
        # Secret (in the operator/run namespace) the LLMProvider references;
        # the operator requires the key GOOGLE_APPLICATION_CREDENTIALS.
        credentialsSecretName: llm-creds-vertex
        # Pattern-wide Vault ADC JSON (values-secret.yaml.template
        # llm-creds-vertex), the same record mao/mas-worker consumes.
        vaultKey: secret/data/global/llm-creds-vertex
        vaultProperty: credentials
    # The operator reads the ApprovalPolicy named "cluster". Adapter runs
    # are analysis-only, so Analysis MUST be Automatic or every run waits
    # for a human; Execution stays Manual (cluster mutations need a human).
    approvalPolicy:
      maxConcurrentRuns: 5
      stages:
        - name: Analysis
          approval: Automatic
        - name: Execution
          approval: Manual
        - name: Verification
          approval: Automatic
        # Escalation only produces a report; keep it Automatic so a
        # verification failure is not stranded at the gate.
        - name: Escalation
          approval: Automatic

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Spoke-side READ access for gateway-mode investigations when this cluster
# also acts as a spoke (templates/spoke-reader-rbac.yaml). The sandbox reads
# the spoke AS THE REQUESTER via Token U; these ClusterRoleBindings grant the
# U role group (keycloak-oidc exchangeRoles: keycloak:<spokeAudience>:<role>)
# what an investigation may see. Never list a user, only role groups.
spokeReaderRBAC:
  enabled: false
  groups: []
  #   - keycloak:praxis-spoke-hub:reader
  clusterRoles:
    - cluster-reader
    - cluster-monitoring-view

# Vault-backed ExternalSecrets rendered by this chart (agent LLM credentials).
secretStore:
  name: vault-backend
  kind: ClusterSecretStore
  refreshInterval: 15m

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Probe paths are the adapter's real GET /healthz (unauthenticated 200;
# safe: internal-only Service behind the NetworkPolicy, which admits only
# the praxis-proxy namespace -- see the a2a-adapter README (lightspeed-hub repo, branch `a2a`) "TLS serving"
# / HealthHandler). The probe PORT NAME and SCHEME are derived by the chart
# from adapter.tls.enabled (https + HTTPS when TLS is on) and are therefore
# NOT set here; only the path and the timing fields are.
livenessProbe:
  httpGet:
    path: /healthz
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /healthz
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
