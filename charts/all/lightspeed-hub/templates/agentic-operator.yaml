{{- if .Values.enabled }}
{{- if .Values.agenticOperator.enabled }}
{{- $runNamespace := include "lightspeed-hub.runNamespace" . }}
{{- if eq .Values.agenticOperator.config.sandboxCredentialMode "gateway" }}
{{- if not .Values.agenticOperator.config.gatewayServerURLTemplate }}
{{- fail "agenticOperator.config.gatewayServerURLTemplate is required when sandboxCredentialMode=gateway (repo C's ConfigMap load fails loudly without it -- pkg/configuration/config.go)" }}
{{- end }}
{{- if not .Values.agenticOperator.config.gatewayCASecret }}
{{- fail "agenticOperator.config.gatewayCASecret is required when sandboxCredentialMode=gateway (repo C's ConfigMap load fails loudly without it -- pkg/configuration/config.go)" }}
{{- end }}
{{- end }}
{{- $sb := .Values.agenticOperator.sandbox }}
{{- if not $sb.image }}
{{- fail "agenticOperator.sandbox.image is required: the operator builds every sandbox pod from sandbox-pod-spec and fails each step with 'base PodSpec with at least one container is required' without it" }}
{{- end }}
# The configuration ConfigMap repo C reads by well-known name
# (pkg/configuration/constants.go: ConfigMapName). Key names are repo C's
# contract, verbatim.
apiVersion: v1
kind: ConfigMap
metadata:
  name: lightspeed-agentic-configuration
  namespace: {{ $runNamespace }}
  labels:
    {{- include "lightspeed-hub.labels" . | nindent 4 }}
data:
  sandbox-credential-mode: {{ .Values.agenticOperator.config.sandboxCredentialMode | quote }}
  {{- if eq .Values.agenticOperator.config.sandboxCredentialMode "gateway" }}
  gateway-server-url-template: {{ .Values.agenticOperator.config.gatewayServerURLTemplate | quote }}
  {{- with .Values.agenticOperator.config.gatewayExecutionServerURLTemplate }}
  gateway-execution-server-url-template: {{ . | quote }}
  {{- end }}
  gateway-ca-secret: {{ .Values.agenticOperator.config.gatewayCASecret | quote }}
  {{- end }}
  terminal-ttl-days: {{ .Values.agenticOperator.config.terminalTTLDays | quote }}
  # Sandbox workload shape (repo C KeySandboxMode / KeySandboxPodSpec). The
  # base PodSpec is JSON; the operator adds the run's env, mounts (gateway
  # kubeconfig, run identity) and service account on top. VERIFIED-BROKEN
  # LIVE (2026-11-20): without sandbox-pod-spec every run failed at analysis
  # with `build pod spec: base PodSpec with at least one container is
  # required`. Ported from the mao-poc-rca branch's operator chart.
  sandbox-mode: {{ $sb.mode | quote }}
  sandbox-pod-spec: {{ (dict
      "containers" (list (dict
        "name" "agent"
        "image" $sb.image
        "imagePullPolicy" $sb.imagePullPolicy
        "resources" $sb.resources
        "securityContext" (dict
          "allowPrivilegeEscalation" false
          "runAsNonRoot" true
          "capabilities" (dict "drop" (list "ALL"))
          "seccompProfile" (dict "type" "RuntimeDefault"))))
      "securityContext" (dict "runAsNonRoot" true "seccompProfile" (dict "type" "RuntimeDefault"))
    ) | toJson | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lightspeed-hub.fullname" . }}-agentic-operator
  namespace: {{ $runNamespace }}
  labels:
    {{- include "lightspeed-hub.labels" . | nindent 4 }}
---
# Webhook serving cert: repo C's manager registers its admission webhooks
# (/mutate-agenticrunapproval, /validate-agent) UNCONDITIONALLY (cmd/main.go
# has no disable gate), so the manager refuses to start without a cert at
# /tmp/k8s-webhook-server/serving-certs. This Service + the OpenShift
# service-ca annotation provision exactly that (keys tls.crt/tls.key --
# controller-runtime's expected names). NOTE (known limitation, README):
# no Mutating/ValidatingWebhookConfiguration is rendered yet, so the
# endpoints are served but never invoked -- the AgenticRunApproval
# approver-identity mutator and the Agent validator are effectively OFF
# until the webhook configurations are wired with this Service's CA bundle
# (documented follow-up in the chart README).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lightspeed-hub.fullname" . }}-agentic-operator-webhook
  namespace: {{ $runNamespace }}
  labels:
    {{- include "lightspeed-hub.labels" . | nindent 4 }}
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: {{ include "lightspeed-hub.fullname" . }}-agentic-operator-webhook
spec:
  ports:
    - port: 9443
      targetPort: 9443
      name: webhook
  selector:
    app.kubernetes.io/name: {{ include "lightspeed-hub.name" . }}-agentic-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
---
# Operator Deployment (repo C, branch a2a-support). PLACEHOLDER: the manager
# args below are the standard controller-runtime shape; repo C's actual
# flags (leader election, metrics/webhook addresses) must be confirmed
# against its config/manager kustomize before activation -- UNCONFIRMED
# GUESS, listed in the README. Its CRDs are vendored in
# templates/agentic-operator-crds.yaml and its RBAC in
# templates/agentic-operator-rbac.yaml (both sync-wave -1, so they land
# before this Deployment at the default wave 0).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lightspeed-hub.fullname" . }}-agentic-operator
  namespace: {{ $runNamespace }}
  labels:
    {{- include "lightspeed-hub.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "lightspeed-hub.name" . }}-agentic-operator
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "lightspeed-hub.name" . }}-agentic-operator
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "lightspeed-hub.fullname" . }}-agentic-operator
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: manager
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # PLACEHOLDER image pending the pinned repo C a2a-support build.
          image: {{ include "lightspeed-hub.operatorImage" . | quote }}
          imagePullPolicy: {{ .Values.agenticOperator.image.pullPolicy }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          # Webhook serving cert (see the Service above): repo C's manager
          # hard-requires tls.crt/tls.key at this CertDir or it exits at
          # startup ("setup problem running manager").
          volumeMounts:
            - name: webhook-cert
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
          ports:
            - name: webhook
              containerPort: 9443
              protocol: TCP
          {{- with .Values.agenticOperator.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: webhook-cert
          secret:
            # Created by the service-ca annotator from the webhook Service
            # above; keys tls.crt / tls.key.
            secretName: {{ include "lightspeed-hub.fullname" . }}-agentic-operator-webhook
            defaultMode: 0444
{{- end }}
{{- end }}
