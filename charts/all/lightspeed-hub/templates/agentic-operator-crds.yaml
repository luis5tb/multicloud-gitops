      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: "AgenticOLSConfig is a cluster-scoped singleton that controls
          system-wide\nagentic behavior. The cluster admin creates a single AgenticOLSConfig\nnamed
          \"cluster\". When spec.suspended is true, new work is blocked and\nin-flight
          runs are stopped. Resumption requires SafeToResume=True for the\ncurrent
          suspended generation.\n\nWhen no AgenticOLSConfig CR exists, the system
          behaves as if\nsuspended is false — the CR is not required for normal operation.\n\nExample:\n\n\tapiVersion:
          agentic.openshift.io/v1alpha1\n\tkind: AgenticOLSConfig\n\tmetadata:\n\t
          \ name: cluster\n\tspec:\n\t  suspended: false"
