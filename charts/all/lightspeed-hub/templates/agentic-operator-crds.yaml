spec:
  group: agentic.openshift.io
  names:
    kind: AgenticRun
    listKind: AgenticRunList
    plural: agenticruns
    singular: agenticrun
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.request
      name: Request
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: "AgenticRun represents a unit of work managed by the agentic
          platform.\nIt is the primary resource component teams and adapters interact
          with.\n\nA AgenticRun defines the workflow shape inline: which steps run
          and which\nagent handles each step. Analysis is always required. Omit execution\nand/or
          verification to skip those steps.\n\nExample — analysis only (advisory):\n\n\tapiVersion:
          agentic.openshift.io/v1alpha1\n\tkind: AgenticRun\n\tmetadata:\n\t  name:
          one-off-investigation\n\tspec:\n\t  request: \"Investigate why pod foo is
          crashlooping\"\n\t  tools:\n\t    skills:\n\t      - image: registry.redhat.io/acs/acs-agentic-skills:latest\n\t
          \ analysis:\n\t    agent: smart\n\nExample — full remediation (analyze →
          execute → verify):\n\n\tapiVersion: agentic.openshift.io/v1alpha1\n\tkind:
          AgenticRun\n\tmetadata:\n\t  name: fix-nginx-cve-2024-1234\n\t  namespace:
          stackrox\n\tspec:\n\t  request: \"Fix CVE-2024-1234 in nginx:1.21\"\n\t
          \ tools:\n\t    skills:\n\t      - image: registry.redhat.io/acs/acs-agentic-skills:latest\n\t
          \   requiredSecrets:\n\t      - name: acs-api-token\n\t        mountAs:\n\t
          \         type: EnvVar\n\t          envVar:\n\t            name: ACS_API_TOKEN\n\t
          \ analysis:\n\t    agent: smart\n\t  execution:\n\t    agent: default\n\t
          \ verification:\n\t    agent: fast"
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of AgenticRun.
            properties:
              analysis:
                description: analysis defines the agent used for the analysis step.
                minProperties: 1
                properties:
                  agent:
                    description: |-
                      agent is the name of the cluster-scoped Agent CR to use for this step.
                      Defaults to "default" when omitted.
                    maxLength: 253
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: 'must be a valid DNS subdomain: lowercase alphanumeric
                        characters, hyphens, and dots'
                      rule: self.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$')
                type: object
              analysisOutput:
                description: |-
                  analysisOutput configures the analysis step's structured output.
                  The mode field controls which built-in properties are included
                  (Default: all; Minimal: only title). The schema field optionally
                  defines adapter-specific structured data injected as "components".

                  When omitted, the analysis uses the full default schema with all
                  built-in properties and no custom components.

                  Immutable: the output contract is fixed at creation.
                minProperties: 1
                properties:
                  mode:
                    default: Default
                    description: |-
                      mode controls which built-in properties the analysis output schema
                      includes. Default includes all built-in properties (diagnosis,
                      remediation plan, summary, rbac, verification). Minimal includes only the
                      base structure (options array with title per option). Omit or set
                      to "Default" for standard remediation workflows.
                    enum:
                    - Default
                    - Minimal
                    type: string
                  schema:
                    description: |-
                      schema is a JSON Schema injected as a required "components"
                      property in each analysis output option. Use this to require
                      adapter-specific structured data beyond the base analysis schema.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                type: object
                x-kubernetes-validations:
                - message: schema is required when mode is Minimal
                  rule: self.mode != 'Minimal' || has(self.schema)
              execution:
                description: |-
                  execution defines the agent used for the execution step.
                  Omit to skip execution (advisory/assisted patterns).
                minProperties: 1
                properties:
                  agent:
                    description: |-
                      agent is the name of the cluster-scoped Agent CR to use for this step.
                      Defaults to "default" when omitted.
                    maxLength: 253
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: 'must be a valid DNS subdomain: lowercase alphanumeric
                        characters, hyphens, and dots'
                      rule: self.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$')
                type: object
              request:
                description: |-
                  request is the user's original request, alert description, or a
                  description of what triggered this agentic run. This text is passed to
                  the analysis agent as the primary input.

                  Immutable: AgenticRuns are run-to-completion (like Jobs). To change
                  the request, create a new AgenticRun. Use spec.revisionFeedback for
                  iterative feedback on an existing analysis.
                maxLength: 32768
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: request is immutable after creation
                  rule: self == oldSelf
              revisionFeedback:
                description: |-
                  revisionFeedback is the user's free-text feedback requesting changes
                  to the analysis. Patching this field bumps metadata.generation, which
                  the operator detects (generation > observedGeneration) and triggers
                  re-analysis with the feedback appended to the original request.

                  Mutable: this and terminalTTL below are the only mutable spec
                  fields. All other spec fields are immutable via CEL rules.
                maxLength: 32768
                minLength: 1
                type: string
              targetCluster:
                description: |-
                  targetCluster optionally references a spoke cluster by name.
                  When set, the operator creates ephemeral service accounts and
                  RBAC on the spoke cluster via the standing kubeconfig Secret
