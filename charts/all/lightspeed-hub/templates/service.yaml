{{- if .Values.enabled }}
{{- if not .Values.adapter.hubAudience }}
{{- fail "adapter.hubAudience must be set when the chart is enabled" }}
{{- end }}
{{- if not (include "lightspeed-hub.keycloakIssuerUrl" .) }}
{{- fail "adapter.keycloak.issuerUrl (or global.clusterBaseDomain / global.localClusterDomain to derive it) is required when the chart is enabled" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lightspeed-hub.fullname" . }}
  {{- if .Values.adapter.tls.enabled }}
  annotations:
    # OpenShift's service-ca operator mints and rotates the adapter's TLS
    # serving cert (tls.crt/tls.key) into this Secret; the Deployment
    # mounts it for --tls-cert-file/--tls-key-file. Required because
    # praxis-proxy's a2aUpstream hop connects over TLS and verifies the
    # service-serving CA. UNCONFIRMED (live cluster): actual issuance.
    service.beta.openshift.io/serving-cert-secret-name: {{ include "lightspeed-hub.servingCertSecretName" . }}
  {{- end }}
  labels:
    {{- include "lightspeed-hub.labels" . | nindent 4 }}
spec:
  # Internal-only by design (design doc §1): the adapter is reachable ONLY
  # through Praxis. This chart deliberately renders NO Route -- do not add
  # one; see the chart README ("Why no Route").
  type: {{ .Values.service.type }}
  ports:
    - name: {{ include "lightspeed-hub.portName" . }}
      port: {{ .Values.service.port }}
      targetPort: {{ include "lightspeed-hub.portName" . }}
      protocol: TCP
  selector:
    {{- include "lightspeed-hub.selectorLabels" . | nindent 4 }}
{{- end }}
