{{- if and .Values.enabled .Values.adapter.hubRunApproversGroup }}
{{- $runNamespace := include "lightspeed-hub.runNamespace" . }}
# Approval decisions are made with the caller's Token H, not the adapter's
# ServiceAccount. Keep this Role namespaced and limited to the approval CR;
# it does not grant run creation or any spoke permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "lightspeed-hub.fullname" . }}-run-approvers
  namespace: {{ $runNamespace }}
  labels:
    {{- include "lightspeed-hub.labels" . | nindent 4 }}
rules:
  - apiGroups: ["agentic.openshift.io"]
    resources: ["agenticrunapprovals"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "lightspeed-hub.fullname" . }}-run-approvers
  namespace: {{ $runNamespace }}
  labels:
    {{- include "lightspeed-hub.labels" . | nindent 4 }}
subjects:
  - kind: Group
    name: {{ .Values.adapter.hubRunApproversGroup | quote }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "lightspeed-hub.fullname" . }}-run-approvers
{{- end }}
