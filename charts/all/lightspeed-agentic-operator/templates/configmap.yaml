apiVersion: v1
kind: ConfigMap
metadata:
  name: lightspeed-agentic-configuration
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  sandbox-mode: "bare-pod"
  sandbox-pod-spec: |-
    {{ (dict
      "containers" (list (dict
        "name" "agent"
        "image" .Values.image.sandbox
        "resources" (dict
          "requests" (dict "cpu" "100m" "memory" "256Mi")
          "limits" (dict "cpu" "1" "memory" "1Gi"))
        "securityContext" (dict
          "allowPrivilegeEscalation" false
          "runAsNonRoot" true
          "capabilities" (dict "drop" (list "ALL"))
          "seccompProfile" (dict "type" "RuntimeDefault"))))
      "securityContext" (dict "runAsNonRoot" true "seccompProfile" (dict "type" "RuntimeDefault"))
    ) | toJson }}
