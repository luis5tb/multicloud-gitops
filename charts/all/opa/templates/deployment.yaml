apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opa.fullname" . }}
  labels:
    {{- include "opa.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "opa.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "opa.labels" . | nindent 8 }}
      annotations:
        # subPath below bind-mounts the single rego file directly, which
        # means kubelet never live-updates it on a ConfigMap change (a known
        # subPath limitation) -- this annotation forces a new ReplicaSet
        # instead whenever the policy content actually changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "opa.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: opa
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          args:
            - run
            - --server
            - --addr=:{{ .Values.service.port }}
            - --disable-telemetry
            - /policies
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # subPath mounts only this one file, not the whole ConfigMap
            # directory -- mounting the directory makes OPA load the same
            # rego content three times (the top-level symlink, Kubernetes'
            # "..data" symlink, and the real timestamped directory it points
            # to), which OPA rejects as "multiple default rules ... found".
            - name: policy
              mountPath: /policies/rca_authorization.rego
              subPath: rca_authorization.rego
              readOnly: true
      volumes:
        - name: policy
          configMap:
            name: {{ include "opa.fullname" . }}-policy
