apiVersion: "external-secrets.io/v1"
kind: ExternalSecret
metadata:
  name: postgresql-db
  namespace: {{ .Release.Namespace }}
  {{- if .Values.externalSecrets.postgresqlDb.metadata }}
  {{- toYaml .Values.externalSecrets.postgresqlDb.metadata | nindent 2 }}
  {{- end }}
spec:
  {{ include "keycloak.externalSecrets.lifecycle" (dict "local" .Values.externalSecrets.postgresqlDb "global" .Values.global) | nindent 2 }}
  secretStoreRef:
    name: {{ .Values.global.secretStore.name }}
    kind: {{ .Values.global.secretStore.kind }}
  target:
    name: {{ .Values.keycloak.postgresqlDb.secretName }}
    {{ include "keycloak.externalSecrets.targetLifecycle" (dict "local" .Values.externalSecrets.postgresqlDb "global" .Values.global) | nindent 4 }}
    template:
      {{- if .Values.externalSecrets.postgresqlDb.targetMetadata }}
      metadata:
        {{- toYaml .Values.externalSecrets.postgresqlDb.targetMetadata | nindent 8 }}
      {{- end }}
      type: Opaque
      data:
        username: {{ .Values.keycloak.postgresqlDb.username }}
        database: {{ .Values.keycloak.postgresqlDb.database }}
        password: "{{ `{{ .password }}` }}"
  data:
  - secretKey: password
    remoteRef:
      key: {{ .Values.keycloak.postgresqlDb.passwordVaultKey }}
      property: db-password