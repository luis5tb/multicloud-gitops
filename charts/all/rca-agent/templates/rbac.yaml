apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "rca-agent.fullname" . }}
  labels:
    {{- include "rca-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: ["agentic.openshift.io"]
    resources: ["agenticruns"]
    verbs: ["create", "get"]
  - apiGroups: ["agentic.openshift.io"]
    resources: ["analysisresults"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "rca-agent.fullname" . }}
  labels:
    {{- include "rca-agent.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "rca-agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "rca-agent.fullname" . }}

