{{- if and .Values.litellm.enabled (not .Values.litellm.existingSecret.name) }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.litellm.credentialsSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rca-agent.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.secretStore.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: {{ .Values.litellm.credentialsSecretName }}
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        LITELLM_API_KEY: "{{ `{{ .api_key }}` }}"
  data:
    - secretKey: api_key
      remoteRef:
        key: {{ .Values.litellm.vaultKey }}
        property: {{ .Values.litellm.vaultProperty }}
{{- end }}
