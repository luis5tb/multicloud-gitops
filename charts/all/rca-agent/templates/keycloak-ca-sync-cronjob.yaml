{{- if .Values.identity.keycloak.caBundleSync.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "rca-agent.fullname" . }}-keycloak-ca-sync
  labels:
    {{- include "rca-agent.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  schedule: {{ .Values.identity.keycloak.caBundleSync.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 180
      template:
        metadata:
          labels:
            app.kubernetes.io/name: rca-agent-ca-sync
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
{{ include "rca-agent.keycloakCaSyncPodSpec" . | nindent 10 }}
{{- end }}
