{{- if .Values.identity.clusterSpiffeID.enabled }}
{{- if not .Values.identity.clusterSpiffeID.trustDomain }}
{{- fail "identity.clusterSpiffeID.trustDomain must be set when identity.clusterSpiffeID.enabled is true" }}
{{- end }}
{{- $serviceAccountName := include "rca-agent.serviceAccountName" . }}
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: {{ .Values.identity.clusterSpiffeID.name }}
spec:
  spiffeIDTemplate: "spiffe://{{ .Values.identity.clusterSpiffeID.trustDomain }}/ns/{{ .Release.Namespace }}/sa/{{ $serviceAccountName }}"
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: {{ .Release.Namespace }}
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "rca-agent.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  jwtTtl: "300s"
{{- end }}
