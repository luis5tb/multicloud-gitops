{{- if and .Values.identity.keycloak.caBundle (or .Values.identity.keycloak.caBundleSecret.name .Values.identity.keycloak.caBundleConfigMap.name) }}
{{- fail "configure only one of identity.keycloak.caBundle, caBundleSecret, or caBundleConfigMap" }}
{{- end }}
{{- if and .Values.identity.keycloak.caBundleSecret.name .Values.identity.keycloak.caBundleConfigMap.name }}
{{- fail "configure only one of identity.keycloak.caBundleSecret or caBundleConfigMap" }}
{{- end }}
{{- if not .Values.litellm.enabled }}
{{- fail "litellm.enabled must remain true: the RCA agent model is configured through LiteLLM" }}
{{- end }}
{{- if not .Values.openshiftMcp.enabled }}
{{- fail "openshiftMcp.enabled must remain true: AgenticRuns are managed through OpenShift MCP" }}
{{- end }}
{{- if and .Values.litellm.existingSecret.name .Values.litellm.vaultKey }}
{{- fail "configure either litellm.existingSecret.name or litellm.vaultKey, not both" }}
{{- end }}
{{- if and (not .Values.litellm.existingSecret.name) (not .Values.litellm.vaultKey) }}
{{- fail "configure litellm.existingSecret.name or litellm.vaultKey" }}
{{- end }}
{{- if not .Values.identity.enabled }}
{{- fail "identity.enabled must remain true: the RCA agent requires ZTWIM/SPIRE workload identity" }}
{{- end }}
{{- if and .Values.route.enabled (ne .Values.a2a.publicProtocol "https") }}
{{- fail "a2a.publicProtocol must be \"https\" when route.enabled is true: google-adk's RemoteA2aAgent refuses a card advertising a non-loopback http RPC url, so callers outside this pod need the route's TLS origin advertised here, not the in-cluster Service DNS name" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rca-agent.fullname" . }}
  labels:
    {{- include "rca-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "rca-agent.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "rca-agent.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "rca-agent.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: rca-agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: PORT
              value: "8000"
            - name: A2A_PUBLIC_HOST
              value: {{ .Values.a2a.publicHost | quote }}
            - name: A2A_PUBLIC_PORT
              value: {{ .Values.a2a.publicPort | quote }}
            - name: A2A_PUBLIC_PROTOCOL
              value: {{ .Values.a2a.publicProtocol | quote }}
            - name: ADK_MODEL
              value: {{ .Values.adk.model | quote }}
            - name: LITELLM_API_BASE
              value: {{ .Values.litellm.apiBase | quote }}
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default .Values.litellm.credentialsSecretName .Values.litellm.existingSecret.name }}
                  key: {{ if .Values.litellm.existingSecret.name }}{{ .Values.litellm.existingSecret.key }}{{ else }}LITELLM_API_KEY{{ end }}
            - name: AGENTIC_RUN_NAMESPACE
              value: {{ default .Release.Namespace .Values.agenticRun.namespace | quote }}
            - name: AGENTIC_RUN_ANALYSIS_AGENT
              value: {{ .Values.agenticRun.analysisAgent | quote }}
            - name: AGENTIC_RUN_TIMEOUT_SECONDS
              value: {{ .Values.agenticRun.timeoutSeconds | quote }}
            - name: AGENTIC_RUN_POLL_INTERVAL_SECONDS
              value: {{ .Values.agenticRun.pollIntervalSeconds | quote }}
            - name: AGENTIC_RUN_SKILLS
              value: {{ toJson .Values.agenticRun.skills | quote }}
            - name: OPENSHIFT_MCP_URL
              value: {{ .Values.openshiftMcp.url | quote }}
            - name: OPENSHIFT_MCP_TRANSPORT
              value: {{ .Values.openshiftMcp.transport | quote }}
            - name: OPENSHIFT_MCP_CREATE_TOOL
              value: {{ .Values.openshiftMcp.createTool | quote }}
            - name: OPENSHIFT_MCP_GET_TOOL
              value: {{ .Values.openshiftMcp.getTool | quote }}
            - name: OPENSHIFT_MCP_TIMEOUT_SECONDS
              value: {{ .Values.openshiftMcp.timeoutSeconds | quote }}
            - name: KEYCLOAK_ISSUER_URL
              value: {{ .Values.identity.keycloak.issuerUrl | quote }}
            - name: KEYCLOAK_AUDIENCES
              value: {{ join "," .Values.identity.keycloak.audiences | quote }}
            - name: KEYCLOAK_TOKEN_URL
              value: {{ .Values.identity.keycloak.tokenExchange.tokenUrl | quote }}
            - name: KEYCLOAK_TOKEN_EXCHANGE_CLIENT_ID
              value: {{ .Values.identity.keycloak.tokenExchange.clientId | quote }}
            - name: KEYCLOAK_TOKEN_EXCHANGE_AUDIENCE
              value: {{ .Values.identity.keycloak.tokenExchange.audience | quote }}
            - name: KEYCLOAK_TOKEN_EXCHANGE_SCOPE
              value: {{ .Values.identity.keycloak.tokenExchange.scope | quote }}
            - name: KEYCLOAK_CLIENT_ASSERTION_TYPE
              value: {{ .Values.identity.keycloak.tokenExchange.clientAssertionType | quote }}
            - name: SPIFFE_ENDPOINT_SOCKET
              value: {{ .Values.identity.workloadApiSocket | quote }}
            # This JWT-SVID is used only as the client_assertion authenticating
            # rca-agent-mcp to Keycloak (identity.py's KeycloakTokenExchanger),
            # so its audience must be the Keycloak realm issuer -- that's what
            # Keycloak's federated-jwt client validator checks it against by
            # default, not an arbitrary workload name.
            - name: SPIFFE_JWT_AUDIENCE
              value: {{ .Values.identity.keycloak.issuerUrl | quote }}
            - name: KEYCLOAK_TIMEOUT_SECONDS
              value: {{ .Values.identity.timeoutSeconds | quote }}
            - name: SPIFFE_TIMEOUT_SECONDS
              value: {{ .Values.identity.timeoutSeconds | quote }}
            {{- if .Values.identity.keycloak.caBundle }}
            - name: KEYCLOAK_CA_BUNDLE
              value: {{ .Values.identity.keycloak.caBundle | quote }}
            {{- else if .Values.identity.keycloak.caBundleSecret.name }}
            - name: KEYCLOAK_CA_BUNDLE
              value: /etc/rca-agent/keycloak-ca/ca.crt
            {{- else if .Values.identity.keycloak.caBundleConfigMap.name }}
            - name: KEYCLOAK_CA_BUNDLE
              value: /etc/rca-agent/keycloak-ca/ca.crt
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /.well-known/agent-card.json
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.identity.enabled }}
            - name: spiffe-workload-api
              mountPath: {{ .Values.identity.workloadApiMountPath }}
              readOnly: true
            {{- end }}
            {{- if or .Values.identity.keycloak.caBundleSecret.name .Values.identity.keycloak.caBundleConfigMap.name }}
            - name: keycloak-ca
              mountPath: /etc/rca-agent/keycloak-ca
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.identity.enabled }}
        - name: spiffe-workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
        {{- end }}
        {{- if .Values.identity.keycloak.caBundleSecret.name }}
        - name: keycloak-ca
          secret:
            secretName: {{ .Values.identity.keycloak.caBundleSecret.name }}
            items:
              - key: {{ .Values.identity.keycloak.caBundleSecret.key }}
                path: ca.crt
        {{- else if .Values.identity.keycloak.caBundleConfigMap.name }}
        - name: keycloak-ca
          configMap:
            name: {{ .Values.identity.keycloak.caBundleConfigMap.name }}
            items:
              - key: {{ .Values.identity.keycloak.caBundleConfigMap.key }}
                path: ca.crt
        {{- end }}
