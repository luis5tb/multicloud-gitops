fullnameOverride: rca-agent

replicaCount: 1

image:
  repository: quay.io/your-org/rca-agent
  tag: latest
  pullPolicy: IfNotPresent
  pullSecrets: []

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 8000

route:
  enabled: false
  host: ""
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

a2a:
  # The A2A agent card this Deployment advertises must point at a reachable,
  # https-or-loopback origin -- google-adk's RemoteA2aAgent refuses to fetch
  # (and, once fetched, refuses to trust the RPC url inside) a card served
  # over plain http on a non-loopback host. In-cluster Service DNS is
  # non-loopback plain http, so calling agents (e.g. ericsson-agent) need
  # this Deployment reachable over TLS -- set these three to match
  # route.enabled/route.host once that's turned on, rather than the
  # in-cluster Service DNS name.
  publicHost: localhost
  publicPort: 8000
  publicProtocol: http

litellm:
  # The ADK agent always calls LiteLLM. The proxy can route to Gemini,
  # Anthropic, OpenAI, or another approved provider without changing this pod.
  enabled: true
  model: openai/rca-agent
  apiBase: http://litellm.litellm.svc.cluster.local:4000
  credentialsSecretName: rca-agent-litellm
  vaultKey: secret/data/global/rca-agent-litellm
  vaultProperty: api-key
  existingSecret:
    name: ""
    key: LITELLM_API_KEY

secretStore:
  name: vault-backend
  kind: ClusterSecretStore
  refreshInterval: 2m0s

identity:
  # ZTWIM/SPIRE identity is mandatory for A2A requests.
  enabled: true
  # The SPIFFE CSI driver always names this file spire-agent.sock -- it is
  # not configurable server-side, so this must match regardless of the mount
  # path chosen below.
  workloadApiSocket: unix:///spiffe-workload-api/spire-agent.sock
  workloadApiMountPath: /spiffe-workload-api
  timeoutSeconds: 5
  keycloak:
    # Set this to the deployed realm issuer, for example:
    # https://keycloak.keycloak-system.svc.cluster.local/realms/<realm>
    issuerUrl: ""
    audiences:
      - rca-agent
      - openshift
    tokenExchange:
      # The RCA client must be allowed to exchange an inbound caller token in
      # Keycloak. This must be a confidential client distinct from the public
      # login client used for Native OIDC (see charts/all/keycloak-oidc,
      # keycloak.mcpClientId) -- a public client cannot authenticate itself
      # to perform a token exchange.
      clientId: rca-agent-mcp
      tokenUrl: ""
      audience: openshift-mcp
      scope: ""
      clientAssertionType: urn:ietf:params:oauth:client-assertion-type:jwt-spiffe
    # Existing path inside the container, if the CA is supplied by another
    # volume. Prefer caBundleSecret or caBundleConfigMap below.
    caBundle: ""
    caBundleSecret:
      name: ""
      key: ca.crt
    caBundleConfigMap:
      name: ""
      key: ca.crt

  # ZTWIM must have a matching ClusterSPIFFEID registration. This optional
  # object is disabled by default because the cluster trust domain is an
  # installation-specific value.
  clusterSpiffeID:
    enabled: false
    name: rca-agent
    trustDomain: ""

agenticRun:
  namespace: ""
  analysisAgent: default
  timeoutSeconds: 900
  pollIntervalSeconds: 5
  # Skills bundle attached to every AgenticRun this agent creates. Static
  # across requests -- override per-deployment if a different skills image or
  # set of paths is needed.
  skills:
    - image: quay.io/openshiftanalytics/agentic-skills:latest
      paths:
        - /skills/cluster-troubleshoot/investigate-alert

adk:
  model: openai/rca-agent

openshiftMcp:
  enabled: true
  url: http://openshift-mcp-server.openshift-mcp-server.svc.cluster.local:8080/mcp
  transport: streamable-http
  createTool: resources_create_or_update
  getTool: resources_get
  timeoutSeconds: 30

rbac:
  # The agent uses the caller's bearer token through OpenShift MCP. It must
  # not receive a service-account Role for AgenticRuns by default.
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

securityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
