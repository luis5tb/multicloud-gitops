{{- if .Values.openshiftOIDC.enabled }}
{{- /*
issuerURL and consoleRoute are derived from global.clusterBaseDomain when not
explicitly overridden (see _helpers.tpl's effective* helpers); the derivation
fails loud if the anchor is unresolvable, so the old non-empty guards here are
redundant.
*/}}
apiVersion: config.openshift.io/v1
kind: Authentication
metadata:
  name: cluster
  labels:
    {{- include "keycloak-oidc.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  type: OIDC
  webhookTokenAuthenticator: null
  oidcProviders:
    - name: {{ .Values.openshiftOIDC.providerName | quote }}
      issuer:
        issuerURL: {{ include "keycloak-oidc.effectiveIssuerURL" . | quote }}
        # Must include every clientID referenced by oidcClients below --
        # OpenShift rejects tokens issued to a platform client whose ID
        # isn't also a trusted audience of this provider.
        audiences:
          - {{ .Values.keycloak.clientId | quote }}
          - {{ .Values.keycloak.consoleClientId | quote }}
          {{- range .Values.openshiftOIDC.extraAudiences }}
          - {{ . | quote }}
          {{- end }}
        {{- if .Values.openshiftOIDC.caConfigMapName }}
        issuerCertificateAuthority:
          name: {{ .Values.openshiftOIDC.caConfigMapName | quote }}
        {{- end }}
      claimMappings:
        username:
          claim: {{ .Values.openshiftOIDC.usernameClaim | quote }}
          prefixPolicy: Prefix
          prefix:
            prefixString: {{ .Values.openshiftOIDC.usernamePrefix | quote }}
        groups:
          claim: {{ .Values.openshiftOIDC.groupsClaim | quote }}
          prefix: {{ .Values.openshiftOIDC.groupsPrefix | quote }}
      # Without these, OpenShift switches to OIDC but reports "no OIDC
      # client found" for both cli and console, breaking login entirely --
      # the API server's own token validation works, but nothing can
      # actually obtain a token through the browser or `oc login`.
      oidcClients:
        - componentName: cli
          componentNamespace: openshift-console
          clientID: {{ .Values.keycloak.clientId | quote }}
        - componentName: console
          componentNamespace: openshift-console
          clientID: {{ .Values.keycloak.consoleClientId | quote }}
          clientSecret:
            name: {{ .Values.openshiftOIDC.consoleClientSecretName | quote }}
{{- end }}
