{{- if .Values.keycloak.hubExchange.enabled }}
{{- $hub := .Values.keycloak.hubExchange }}
# TASK B / PHASE 1. Two ExternalSecrets pulling the same Vault value, one
# per namespace (same pattern as spoke-gateway-exchanger-secret.yaml):
# KeycloakRealmImport's placeholder substitution
# (keycloak-realm-import.yaml) needs the client secret in
# keycloak.namespace, and the hub A2A adapter (charts/all/lightspeed-hub)
# reads it from targetNamespace as adapter.keycloak.clientSecretSecret.name
# -- ExternalSecret always targets its own namespace, so one resource
# can't cover both.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $hub.secretName }}
  namespace: {{ .Values.keycloak.namespace }}
  labels:
    {{- include "keycloak-oidc.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.secretStore.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: {{ $hub.secretName }}
  data:
    - secretKey: client-secret
      remoteRef:
        key: {{ $hub.vaultKey }}
        property: {{ $hub.vaultProperty }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $hub.secretName }}
  namespace: {{ $hub.targetNamespace }}
  labels:
    {{- include "keycloak-oidc.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.secretStore.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: {{ $hub.secretName }}
  data:
    - secretKey: client-secret
      remoteRef:
        key: {{ $hub.vaultKey }}
        property: {{ $hub.vaultProperty }}
{{- end }}
