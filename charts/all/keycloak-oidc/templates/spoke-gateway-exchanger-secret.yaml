{{- if .Values.keycloak.spokeGatewayExchanger.enabled }}
{{- $exchanger := .Values.keycloak.spokeGatewayExchanger }}
# PHASE 2 B1 (PROPOSED). Two ExternalSecrets pulling the same Vault value,
# one per namespace (same pattern as console-client-secret.yaml):
# KeycloakRealmImport's placeholder substitution
# (keycloak-realm-import.yaml) needs the client secret in
# keycloak.namespace, and the praxis-proxy spoke-gateway pods read it from
# targetNamespace (charts/all/praxis-proxy's
# spokeGatewayConfig.exchangeClient.secretName) -- ExternalSecret always targets
# its own namespace, so one resource can't cover both.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $exchanger.secretName }}
  namespace: {{ .Values.keycloak.namespace }}
  labels:
    {{- include "keycloak-oidc.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.secretStore.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: {{ $exchanger.secretName }}
  data:
    - secretKey: client-secret
      remoteRef:
        key: {{ $exchanger.vaultKey }}
        property: {{ $exchanger.vaultProperty }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $exchanger.secretName }}
  namespace: {{ $exchanger.targetNamespace }}
  labels:
    {{- include "keycloak-oidc.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.secretStore.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: {{ $exchanger.secretName }}
  data:
    - secretKey: client-secret
      remoteRef:
        key: {{ $exchanger.vaultKey }}
        property: {{ $exchanger.vaultProperty }}
{{- end }}
