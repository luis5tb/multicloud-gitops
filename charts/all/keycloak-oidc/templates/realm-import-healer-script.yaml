{{- if and .Values.realmImport.enabled .Values.realmImport.selfHeal.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "keycloak-oidc.fullname" . }}-realm-import-healer-script
  namespace: {{ .Values.keycloak.namespace }}
  labels:
    {{- include "keycloak-oidc.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  heal_realm_import.py: |-
{{ .Files.Get "files/heal_realm_import.py" | indent 4 }}
{{- end }}
