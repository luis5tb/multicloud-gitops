{{- if .Values.realmImport.enabled }}
{{- $hasExternalCredentials := false }}
{{- range .Values.keycloak.externalOidcProviders }}
{{- $credentials := default dict .credentials }}
{{- if or $credentials.vaultKey $credentials.existingSecretName }}
{{- $hasExternalCredentials = true }}
{{- end }}
{{- end }}
{{- if not .Values.keycloak.masA2aAudience }}
{{- fail "keycloak.masA2aAudience must be set to a dedicated non-empty audience for the MAS inbound A2A client" }}
{{- end }}
{{- if or (eq .Values.keycloak.masA2aAudience "openshift") (eq .Values.keycloak.masA2aAudience .Values.keycloak.masApiAudience) }}
{{- fail "keycloak.masA2aAudience must be distinct from openshift and masApiAudience" }}
{{- end }}
{{- if not .Values.keycloak.masApiAudience }}
{{- fail "keycloak.masApiAudience must be set to a dedicated non-empty audience for the MAS API" }}
{{- end }}
{{- if or (eq .Values.keycloak.masApiAudience "openshift") (eq .Values.keycloak.masApiAudience .Values.keycloak.masA2aAudience) }}
{{- fail "keycloak.masApiAudience must be distinct from openshift and masA2aAudience" }}
{{- end }}
{{- if .Values.keycloak.spiffeIdentityProvider.enabled }}
{{- /*
trustDomain is derived from global.clusterBaseDomain (apps.<base>) when not
explicitly overridden -- see _helpers.tpl's effectiveTrustDomain. bundleEndpoint
is an in-cluster Service URL, not domain-derived, so it still must be set.
*/}}
{{- if not .Values.keycloak.spiffeIdentityProvider.bundleEndpoint }}
{{- fail "keycloak.spiffeIdentityProvider.bundleEndpoint must be set when keycloak.spiffeIdentityProvider.enabled is true (the SPIRE OIDC discovery provider JWKS endpoint)" }}
{{- end }}
{{- end }}
{{- if .Values.keycloak.spokeGatewayExchanger.enabled }}
{{- $exchanger := .Values.keycloak.spokeGatewayExchanger }}
{{- if not $exchanger.vaultKey }}
{{- fail "keycloak.spokeGatewayExchanger.vaultKey is required when keycloak.spokeGatewayExchanger.enabled is true (Vault path holding the exchanger client's secret)" }}
{{- end }}
{{- if not $exchanger.clientId }}
{{- fail "keycloak.spokeGatewayExchanger.clientId must be set when keycloak.spokeGatewayExchanger.enabled is true" }}
{{- end }}
{{- range $aud := $exchanger.spokeAudiences }}
{{- if or (not (kindIs "string" .)) (not .) }}
{{- fail "keycloak.spokeGatewayExchanger.spokeAudiences entries must be non-empty strings (per-spoke Keycloak audiences matching each spoke gateway's exchangeAudience)" }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.keycloak.hubExchange.enabled }}
{{- $hub := .Values.keycloak.hubExchange }}
{{- if not $hub.vaultKey }}
{{- fail "keycloak.hubExchange.vaultKey is required when keycloak.hubExchange.enabled is true (Vault path holding the adapter exchange client's secret)" }}
{{- end }}
{{- if not $hub.clientId }}
{{- fail "keycloak.hubExchange.clientId must be set when keycloak.hubExchange.enabled is true" }}
{{- end }}
{{- if not $hub.hubAudience }}
{{- fail "keycloak.hubExchange.hubAudience is required when keycloak.hubExchange.enabled is true: it is the audience of the exchanged Token H (must equal charts/all/lightspeed-hub's adapter.hubAudience)" }}
{{- end }}
{{- /* Audience-distinctness fail-guards: the hub audience names a distinct
      consumer (the hub kube API path via the adapter), so it must never
      collide with the platform audience, the MAS audiences, or any spoke
      exchange audience -- a collision would make a token minted for one
      consumer silently valid for another. */}}
{{- if or (eq $hub.hubAudience "openshift") (eq $hub.hubAudience .Values.keycloak.masA2aAudience) (eq $hub.hubAudience .Values.keycloak.masApiAudience) }}
{{- fail "keycloak.hubExchange.hubAudience must be distinct from openshift, keycloak.masA2aAudience and keycloak.masApiAudience" }}
{{- end }}
{{- if eq $hub.hubAudience $hub.clientId }}
{{- fail "keycloak.hubExchange.hubAudience must be distinct from keycloak.hubExchange.clientId (the client ID is itself minted as a Token A audience by subjectTokenAudienceMapper)" }}
{{- end }}
{{- if .Values.keycloak.spokeGatewayExchanger.enabled }}
{{- range $aud := .Values.keycloak.spokeGatewayExchanger.spokeAudiences }}
{{- if eq $aud $hub.hubAudience }}
{{- fail "keycloak.hubExchange.hubAudience must be distinct from every keycloak.spokeGatewayExchanger.spokeAudiences entry (spoke vs hub audiences name different consumers)" }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: {{ .Values.keycloak.realm }}
  namespace: {{ .Values.keycloak.namespace }}
  labels:
    {{- include "keycloak-oidc.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.realmImport.syncWave | quote }}
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  keycloakCRName: {{ .Values.keycloak.name }}
  {{- if or .Values.keycloak.consoleClientSecretVaultKey .Values.keycloak.consoleAdminUser.enabled $hasExternalCredentials .Values.keycloak.spokeGatewayExchanger.enabled .Values.keycloak.hubExchange.enabled }}
  placeholders:
    {{- if .Values.keycloak.spokeGatewayExchanger.enabled }}
    # Resolves $(PRAXIS_SPOKE_EXCHANGER_SECRET) below into the spoke
    # gateway exchanger client's secret (Vault-backed, see
    # spoke-gateway-exchanger-secret.yaml).
    PRAXIS_SPOKE_EXCHANGER_SECRET:
      secret:
        name: {{ .Values.keycloak.spokeGatewayExchanger.secretName }}
        key: client-secret
    {{- end }}
    {{- if .Values.keycloak.hubExchange.enabled }}
    # Resolves $(HUB_EXCHANGE_SECRET) below into the hub adapter's
    # exchange client secret (Vault-backed, see hub-exchange-secret.yaml).
    HUB_EXCHANGE_SECRET:
      secret:
        name: {{ .Values.keycloak.hubExchange.secretName }}
        key: client-secret
    {{- end }}
    {{- range $index, $provider := .Values.keycloak.externalOidcProviders }}
    {{- $credentials := default dict $provider.credentials }}
    {{- if or $credentials.vaultKey $credentials.existingSecretName }}
    EXTERNAL_IDP_{{ $index }}_CLIENT_ID:
      secret:
        name: {{ include "keycloak-oidc.externalProviderSecretName" (dict "root" $ "provider" $provider) }}
        key: client-id
    EXTERNAL_IDP_{{ $index }}_CLIENT_SECRET:
      secret:
        name: {{ include "keycloak-oidc.externalProviderSecretName" (dict "root" $ "provider" $provider) }}
        key: client-secret
    {{- end }}
    {{- end }}
    {{- if .Values.keycloak.consoleClientSecretVaultKey }}
    # Resolves $(CONSOLE_CLIENT_SECRET) below into openshift-console's client
    # secret, sourced from the same Secret/Vault value
    # openshiftOIDC.consoleClientSecretName reads (see console-client-secret.yaml)
    # -- see that file's comment for why this needs its own copy of the
    # Secret in this namespace rather than reading the openshift-config one
    # directly.
    CONSOLE_CLIENT_SECRET:
      secret:
        name: {{ .Values.openshiftOIDC.consoleClientSecretName }}
        key: clientSecret
    {{- end }}
    {{- if .Values.keycloak.consoleAdminUser.enabled }}
    # Resolves $(CONSOLE_ADMIN_PASSWORD) below into consoleAdminUser's
    # initial password (see console-admin-user-secret.yaml).
    CONSOLE_ADMIN_PASSWORD:
      secret:
        name: {{ .Values.keycloak.consoleAdminUser.passwordSecretName }}
        key: password
    {{- end }}
  {{- end }}
  realm:
    realm: {{ .Values.keycloak.realm | quote }}
    enabled: true
    displayName: {{ .Values.keycloak.displayName | quote }}
    groups:
      {{- if .Values.keycloak.adminGroupName }}
      - name: {{ .Values.keycloak.adminGroupName | quote }}
      {{- end }}
      - name: {{ .Values.keycloak.acmeGroupName | quote }}
    clients:
      # Named openshift-cli (OpenShift's own name for this platform-client
      # role, see oidcClients[componentName: cli] in openshift-authentication.yaml).
      # Purely human/oc-login/console access via OpenShift Native OIDC,
      # unrelated to the agent request flow.
      - clientId: {{ .Values.keycloak.clientId | quote }}
        name: {{ .Values.keycloak.clientName | quote }}
        enabled: true
        protocol: openid-connect
        publicClient: true
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        # Needed for `oc login` when openshiftOIDC.enabled registers this
        # client as the "cli" OIDC platform client (public, no secret).
        # OpenShift's built-in external-OIDC CLI flow listens on localhost:8080.
        redirectUris:
          - "http://localhost:8080"
          - "http://localhost:8080/callback"
        protocolMappers:
          - name: groups
            protocol: openid-connect
            protocolMapper: oidc-group-membership-mapper
            config:
              claim.name: groups
              full.path: "false"
              access.token.claim: "true"
              id.token.claim: "true"
              userinfo.token.claim: "true"
          - name: openshift-audience
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.custom.audience: openshift
              access.token.claim: "true"
          # Distinct resource audience for the separately deployed MAS A2A
          # endpoint. This mapper on openshift-cli is for human callers; the
          # acme-agent client also receives the same audience mapper below.
          # Do not reuse the openshift API-server audience. Existing realms
          # are not reconciled after this one-shot import; see the Keycloak chart
          # reconciled after this one-shot import; see the Keycloak chart
          # README for the manual existing-realm step.
          - name: mas-a2a-audience
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.custom.audience: {{ .Values.keycloak.masA2aAudience | quote }}
              access.token.claim: "true"
          # Separate resource audience for authorized human administrators of
          # the public MAS management API. This is intentionally not the MAS
          # inbound A2A audience; existing realms need this mapper added to the
          # openshift-cli client manually (realm import is one-shot).
          - name: mas-api-audience
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.custom.audience: {{ .Values.keycloak.masApiAudience | quote }}
              access.token.claim: "true"
      # Confidential client used by acme-agent's client-credentials call.
      #
      # Authenticates via the federated client authentication/"spiffe"
      # identity provider above, using acme-agent's own SPIRE JWT-SVID. The
      # MAS audience mapper exists so the token this client mints satisfies
      # MAS's inbound A2A audience check.
      - clientId: {{ .Values.keycloak.acmeClientId | quote }}
        name: {{ .Values.keycloak.acmeClientName | quote }}
        enabled: true
        protocol: openid-connect
        publicClient: false
        standardFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: true
        {{- if .Values.keycloak.spiffeIdentityProvider.enabled }}
        clientAuthenticatorType: federated-jwt
        {{- end }}
        {{- if or .Values.keycloak.spiffeIdentityProvider.enabled .Values.keycloak.acmeAccessTokenLifespanSeconds }}
        attributes:
          {{- if .Values.keycloak.spiffeIdentityProvider.enabled }}
          jwt.credential.issuer: {{ .Values.keycloak.spiffeIdentityProvider.alias | quote }}
          jwt.credential.sub: {{ printf "spiffe://%s/ns/%s/sa/%s" (include "keycloak-oidc.effectiveTrustDomain" .) .Values.keycloak.acmeWorkload.namespace .Values.keycloak.acmeWorkload.serviceAccount | quote }}
          {{- end }}
          {{- if .Values.keycloak.acmeAccessTokenLifespanSeconds }}
          # Test aid: short-lived Token A to exercise expiry and renewal.
          access.token.lifespan: {{ .Values.keycloak.acmeAccessTokenLifespanSeconds | toString | quote }}
          {{- end }}
        {{- end }}
        protocolMappers:
          # MAS validates its inbound A2A calls against a dedicated audience.
          # Put that audience on ACME's client-credentials token so Token A
          # can pass MAS validation.
          - name: {{ printf "%s-audience" .Values.keycloak.masA2aAudience }}
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.custom.audience: {{ .Values.keycloak.masA2aAudience | quote }}
              access.token.claim: "true"
          # Without this, the token this client mints carries no groups
          # claim at all, so group-based authorization on downstream
          # consumers has nothing to key on for calls attributed to
          # acme-agent.
          - name: groups
            protocol: openid-connect
            protocolMapper: oidc-group-membership-mapper
            config:
              claim.name: groups
              full.path: "false"
              access.token.claim: "true"
              id.token.claim: "true"
              userinfo.token.claim: "true"
          {{- if and .Values.keycloak.spokeGatewayExchanger.enabled .Values.keycloak.spokeGatewayExchanger.subjectTokenAudienceMapper }}
          # PHASE 2 B1 (PROPOSED): RFC 8693 exchange prerequisite (b) --
          # the SUBJECT token (A) must already carry the exchanging client
          # as an audience; the `audience` request parameter only ever
          # narrows, never adds. This puts the exchanger's client ID on
          # acme-agent's client-credentials tokens so the spoke gateway
          # can exchange them. UNCONFIRMED GUESS: adds an audience to every
          # Token A; verify no audience-sensitive validator (MAS, Praxis
          # allow-list) rejects the extra audience. One-shot realm import
          # only -- existing realms need the mapper added manually.
          - name: praxis-spoke-exchanger-audience
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.custom.audience: {{ .Values.keycloak.spokeGatewayExchanger.clientId | quote }}
              access.token.claim: "true"
          {{- end }}
          {{- if and .Values.keycloak.hubExchange.enabled .Values.keycloak.hubExchange.subjectTokenAudienceMapper }}
          # TASK B / PHASE 1: RFC 8693 exchange prerequisite (b) for the
          # A->H exchange -- the SUBJECT token (A) must already carry the
          # exchanging client (the hub adapter) as an audience. UNCONFIRMED
          # GUESS: adds an audience to every Token A; verify no
          # audience-sensitive validator (MAS, Praxis allow-list) rejects
          # the extra audience. One-shot realm import only -- existing
          # realms need this mapper added manually.
          - name: hub-exchanger-audience
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.custom.audience: {{ .Values.keycloak.hubExchange.clientId | quote }}
              access.token.claim: "true"
          {{- end }}
      {{- if .Values.keycloak.spokeGatewayExchanger.enabled }}
      # PHASE 2 B1 (PROPOSED): confidential client the per-spoke Praxis
      # spoke-gateways authenticate as when exchanging Token A for a
      # spoke-audience Token U (RFC 8693). Secret is Vault-backed via the
      # placeholder above (spoke-gateway-exchanger-secret.yaml materializes
      # it in both keycloak.namespace and the praxis-proxy namespace).
      # UNCONFIRMED GUESS: the exact mapper/attribute set needed for
      # internal->internal exchange on this Keycloak build -- standard
      # token exchange requires standard.token.exchange.enabled on the
      # exchanging client (attribute below); whether mappers on this
      # client also apply to EXCHANGED tokens (vs only client-credentials
      # tokens) depends on live Keycloak behavior. Caveats recorded in
      # PLAN-lightspeed-hub-migration.md: the subject token must already
      # carry this client as audience (see the acme-agent mapper above);
      # omit client_id for SVID client-assertion flows (a SPIFFE sub never
      # equals a Keycloak client_id); after the exchange azp becomes this
      # client, so downstream policy must key on sub/groups and record azp
      # as provenance only. One-shot realm import only -- existing realms
      # need this client created manually (see chart README).
      - clientId: {{ .Values.keycloak.spokeGatewayExchanger.clientId | quote }}
        name: {{ .Values.keycloak.spokeGatewayExchanger.clientName | quote }}
        enabled: true
        protocol: openid-connect
        publicClient: false
        standardFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: true
        secret: $(PRAXIS_SPOKE_EXCHANGER_SECRET)
        attributes:
          standard.token.exchange.enabled: "true"
        {{- with .Values.keycloak.spokeGatewayExchanger.spokeAudiences }}
        protocolMappers:
          {{- range $aud := . }}
          # One per registered spoke: the audience the exchanged Token U
          # carries for that spoke's API server. UNCONFIRMED GUESS: see the
          # values.yaml spokeAudiences comment.
          - name: {{ printf "%s-audience" $aud | quote }}
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.custom.audience: {{ $aud | quote }}
              access.token.claim: "true"
          {{- end }}
        {{- end }}
      {{- end }}
      {{- if .Values.keycloak.hubExchange.enabled }}
      # TASK B / PHASE 1: confidential client the hub A2A adapter
      # (charts/all/lightspeed-hub) authenticates as when exchanging the
      # caller's Token A for the hub-audience Token H (RFC 8693). Secret is
      # Vault-backed via the placeholder above (hub-exchange-secret.yaml
      # materializes it in both keycloak.namespace and the lightspeed-hub
      # namespace). UNCONFIRMED GUESS: the exact mapper/attribute set
      # needed for internal->internal exchange on this Keycloak build --
      # standard.token.exchange.enabled is required on the exchanging
      # client, and whether the mappers below apply to EXCHANGED tokens
      # (vs only client-credentials tokens) needs live validation (plan
      # spike item #5, see values.yaml hubExchange.groupMappers). After
      # the exchange azp becomes this client, so downstream policy must
      # key on sub/groups and record azp as provenance only. One-shot
      # realm import only -- existing realms need this client created
      # manually (see chart README).
      - clientId: {{ .Values.keycloak.hubExchange.clientId | quote }}
        name: {{ .Values.keycloak.hubExchange.clientName | quote }}
        enabled: true
        protocol: openid-connect
        publicClient: false
        standardFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: true
        secret: $(HUB_EXCHANGE_SECRET)
        attributes:
          standard.token.exchange.enabled: "true"
        protocolMappers:
          # The hub audience on the exchanged Token H (must equal
          # charts/all/lightspeed-hub's adapter.hubAudience).
          - name: {{ printf "%s-audience" .Values.keycloak.hubExchange.hubAudience | quote }}
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.custom.audience: {{ .Values.keycloak.hubExchange.hubAudience | quote }}
              access.token.claim: "true"
          {{- if .Values.keycloak.hubExchange.groupMappers }}
          # Group protocol mapper so the EXCHANGED Token H carries the
          # principal's Keycloak groups (which the hub API's OIDC group
          # mapping + RoleBindings consume), while minted Token A stays
          # groupless. UNCONFIRMED GUESS: whether this mapper applies to
          # RFC 8693-exchanged tokens on this Keycloak build (plan spike
          # item #5) -- validate against a live realm before relying on
          # it (see values.yaml hubExchange.groupMappers).
          - name: groups
            protocol: openid-connect
            protocolMapper: oidc-group-membership-mapper
            config:
              claim.name: groups
              full.path: "false"
              access.token.claim: "true"
              id.token.claim: "true"
              userinfo.token.claim: "true"
          {{- end }}
      {{- end }}
      {{- /* Audience-only clients: one per audience an exchanger REQUESTS
             (hubExchange.hubAudience, each spokeGatewayExchanger
             spokeAudiences entry). */}}
      {{- $audienceClients := list }}
      {{- if .Values.keycloak.hubExchange.enabled }}
      {{- $audienceClients = append $audienceClients .Values.keycloak.hubExchange.hubAudience }}
      {{- end }}
      {{- if .Values.keycloak.spokeGatewayExchanger.enabled }}
      {{- range .Values.keycloak.spokeGatewayExchanger.spokeAudiences }}
      {{- $audienceClients = append $audienceClients . }}
      {{- end }}
      {{- end }}
      {{- $otherClientIds := list .Values.keycloak.clientId .Values.keycloak.acmeClientId .Values.keycloak.consoleClientId .Values.keycloak.spokeGatewayExchanger.clientId .Values.keycloak.hubExchange.clientId }}
      {{- range $aud := $audienceClients | uniq }}
      {{- if has $aud $otherClientIds }}
      {{- fail (printf "exchange audience %q collides with an existing client ID in the realm; audience-only clients must have their own names" $aud) }}
      {{- end }}
      # AUDIENCE-ONLY CLIENT {{ $aud | quote }}: represents a RESOURCE SERVER
      # (a hub/spoke kube API that accepts this audience via
      # openshiftOIDC.extraAudiences), not an application. It exists ONLY so
      # Keycloak 26 standard token exchange accepts `audience={{ $aud }}`:
      # the requested audience must be the client ID of an existing client,
      # otherwise the exchange fails with 400 invalid_client "Audience not
      # found". VERIFIED-BROKEN LIVE (2026-11): the lightspeed-hub adapter's
      # A->H exchange failed exactly that way while the audience was only a
      # custom string in a mapper. The exchanged token's aud still comes
      # from the exchanging client's audience mapper; this client just makes
      # the name resolvable. Every flow is disabled, so nothing can log in or
      # mint tokens as it. One-shot realm import only -- an already-imported
      # realm needs it created manually (see chart README "Audience-only
      # clients").
      - clientId: {{ $aud | quote }}
        name: {{ printf "Audience: %s" $aud | quote }}
        enabled: true
        protocol: openid-connect
        publicClient: false
        standardFlowEnabled: false
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        frontchannelLogout: false
      {{- end }}
      # Confidential client registered as the web console's OIDC platform
      # client when openshiftOIDC.enabled is true.
      #
      # If keycloak.consoleClientSecretVaultKey is set, its secret comes from
      # the placeholder above (Vault-backed, no manual step). Otherwise
      # Keycloak generates this client's secret at import time -- MANUAL
      # STEP: copy it into a Secret in the openshift-config namespace (see
      # the README) before setting openshiftOIDC.enabled=true, or the
      # console will fail to log in with "no OIDC client found" / invalid_client.
      - clientId: {{ .Values.keycloak.consoleClientId | quote }}
        name: {{ .Values.keycloak.consoleClientName | quote }}
        enabled: true
        protocol: openid-connect
        publicClient: false
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        {{- if .Values.keycloak.consoleClientSecretVaultKey }}
        secret: $(CONSOLE_CLIENT_SECRET)
        {{- end }}
        {{- if .Values.openshiftOIDC.enabled }}
        redirectUris:
          - "{{ include "keycloak-oidc.effectiveConsoleRoute" . }}/auth/callback"
        {{- end }}
        # Without this, tokens issued to this client carry no groups claim,
        # so claimMappings.groups on Authentication/cluster has nothing to
        # map -- console users authenticate fine but land in no groups at
        # all, silently losing any RBAC granted via keycloak.adminGroupName.
        protocolMappers:
          - name: groups
            protocol: openid-connect
            protocolMapper: oidc-group-membership-mapper
            config:
              claim.name: groups
              full.path: "false"
              access.token.claim: "true"
              id.token.claim: "true"
              userinfo.token.claim: "true"
    # Puts acme-agent's own service-account user into its dedicated group
    # so its tokens actually carry the groups claim the mapper above adds.
    # serviceAccountsEnabled: true auto-creates this user
    # (service-account-<clientId>); this only sets its group membership, it
    # does not create the user itself.
    users:
      - username: {{ printf "service-account-%s" .Values.keycloak.acmeClientId | quote }}
        serviceAccountClientId: {{ .Values.keycloak.acmeClientId | quote }}
        enabled: true
        groups:
          - {{ printf "/%s" .Values.keycloak.acmeGroupName | quote }}
      {{- if .Values.keycloak.consoleAdminUser.enabled }}
      # Human user in adminGroupName (-> cluster-admin, see that value's
      # comment), so the console has at least one working login once
      # openshiftOIDC.enabled is true, with no manual Admin Console step.
      # temporary: true forces a password change on first login -- the
      # generated Vault value is a bootstrap credential, not meant to be
      # kept long-term.
      - username: {{ .Values.keycloak.consoleAdminUser.username | quote }}
        enabled: true
        credentials:
          - type: password
            value: $(CONSOLE_ADMIN_PASSWORD)
            temporary: true
        groups:
          - {{ printf "/%s" .Values.keycloak.adminGroupName | quote }}
      {{- end }}
    {{- if or .Values.keycloak.spiffeIdentityProvider.enabled .Values.keycloak.externalOidcProviders }}
    # Backs the acme-agent confidential client's federated-jwt authentication
    # above. Config key names are this Keycloak build's actual internal
    # field names (verified against the running server), not the field
    # labels shown in the Admin Console -- "issuer" holds the SPIFFE trust
    # domain, not an OIDC issuer URL, because Keycloak's SpiffeIdentityProviderConfig
    # reuses the generic IdentityProviderModel.ISSUER config key for it.
    identityProviders:
      {{- if .Values.keycloak.spiffeIdentityProvider.enabled }}
      - alias: {{ .Values.keycloak.spiffeIdentityProvider.alias | quote }}
        providerId: spiffe
        enabled: true
        config:
          issuer: {{ printf "spiffe://%s" (include "keycloak-oidc.effectiveTrustDomain" .) | quote }}
          bundleEndpoint: {{ .Values.keycloak.spiffeIdentityProvider.bundleEndpoint | quote }}
      {{- end }}
    {{- end }}
    {{- if .Values.keycloak.externalOidcProviders }}
    {{- /* External OIDC providers trusted for token exchange. Keycloak validates
    tokens from these issuers when they are used as subject_token in RFC 8693
    token exchange. These are oidc identity providers, not spiffe providers. */}}
    {{- range $index, $provider := .Values.keycloak.externalOidcProviders }}
      - alias: {{ .alias | quote }}
        providerId: oidc
        enabled: true
        {{- if .displayName }}
        displayName: {{ .displayName | quote }}
        {{- end }}
        {{- $config := include "keycloak-oidc.externalProviderConfig" $provider | fromJson }}
        {{- $credentials := default dict $provider.credentials }}
        {{- if or $credentials.vaultKey $credentials.existingSecretName }}
        {{- $_ := set $config "clientId" (printf "$(EXTERNAL_IDP_%d_CLIENT_ID)" $index) }}
        {{- $_ := set $config "clientSecret" (printf "$(EXTERNAL_IDP_%d_CLIENT_SECRET)" $index) }}
        {{- end }}
        config:
          {{- toYaml $config | nindent 10 }}
    {{- end }}
    {{- end }}
    {{- if ne (include "keycloak-oidc.externalGroupMappings" .) "[]" }}
    identityProviderMappers:
      {{- range $provider := .Values.keycloak.externalOidcProviders }}
      {{- $groups := default list .hardcodedGroups }}
      {{- range $group := $groups }}
      - name: {{ printf "%s-%s" (trimPrefix "/" $group) $provider.alias | quote }}
        identityProviderAlias: {{ $provider.alias | quote }}
        identityProviderMapper: oidc-hardcoded-group-idp-mapper
        config:
          group: {{ printf "/%s" (trimPrefix "/" $group) | quote }}
          syncMode: FORCE
      {{- end }}
      {{- end }}
    {{- end }}
{{- end }}
