{{- if .Values.realmImport.enabled }}
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: {{ .Values.keycloak.realm }}
  namespace: {{ .Values.keycloak.namespace }}
  labels:
    {{- include "keycloak-oidc.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.realmImport.syncWave | quote }}
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  keycloakCRName: {{ .Values.keycloak.name }}
  realm:
    realm: {{ .Values.keycloak.realm | quote }}
    enabled: true
    displayName: {{ .Values.keycloak.displayName | quote }}
    groups:
      - name: {{ .Values.keycloak.groupName | quote }}
    clients:
      - clientId: {{ .Values.keycloak.clientId | quote }}
        name: {{ .Values.keycloak.clientName | quote }}
        enabled: true
        protocol: openid-connect
        publicClient: true
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        protocolMappers:
          - name: groups
            protocol: openid-connect
            protocolMapper: oidc-group-membership-mapper
            config:
              claim.name: groups
              full.path: "false"
              access.token.claim: "true"
              id.token.claim: "true"
              userinfo.token.claim: "true"
          - name: openshift-audience
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.custom.audience: openshift
              access.token.claim: "true"
      # Confidential client used only for the OpenShift MCP token exchange.
      # It must NOT be the public login client above: token exchange
      # authenticates the client itself, which a public client cannot do.
      #
      # MANUAL STEP: this client must be switched to Keycloak's federated
      # client authentication (see
      # https://www.keycloak.org/2026/01/federated-client-authentication),
      # referencing the "spiffe" identity provider configured by the
      # "keycloak" application's spiffeIdentityProvider override, so the
      # jwt-spiffe assertion from rca-agent's SPIRE JWT-SVID authenticates
      # this client with no static secret. The exact client-authenticator
      # field is version-specific and cannot be templated blindly here;
      # configure it in the Keycloak Admin Console under this client's
      # Credentials tab, then grant it token-exchange permission for the
      # openshift-mcp audience (Fine-Grained Admin Permissions).
      - clientId: {{ .Values.keycloak.mcpClientId | quote }}
        name: {{ .Values.keycloak.mcpClientName | quote }}
        enabled: true
        protocol: openid-connect
        publicClient: false
        standardFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
      # Confidential client used by ericsson-agent's client-credentials call.
      #
      # MANUAL STEP: same federated client authentication caveat as above
      # applies here.
      - clientId: {{ .Values.keycloak.ericssonClientId | quote }}
        name: {{ .Values.keycloak.ericssonClientName | quote }}
        enabled: true
        protocol: openid-connect
        publicClient: false
        standardFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: true
{{- end }}
