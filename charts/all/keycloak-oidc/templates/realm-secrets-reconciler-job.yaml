{{- if and .Values.realmImport.enabled .Values.openshiftOIDC.issuerURL (or .Values.keycloak.consoleClientSecretVaultKey .Values.keycloak.consoleAdminUser.enabled) }}
# KeycloakRealmImport only ever gets one shot at resolving its $(...)
# placeholders (see keycloak-realm-import.yaml) -- if that substitution loses
# a startup race against the referenced Secret/ExternalSecret/Vault chain
# (observed in practice: ClusterSecretStore not yet Ready during a fresh
# cluster's bootstrap window), it silently bakes in the literal placeholder
# text as the client secret / user password, with no retry, ever. This
# PostSync hook re-asserts both values directly against the running realm on
# every ArgoCD sync, so a botched one-shot substitution -- or any later
# rotation of the underlying Vault value -- self-heals on the next sync
# instead of requiring a manual Admin REST API/Console fix.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.keycloak.realm }}-realm-secrets-reconciler
  namespace: {{ .Values.keycloak.namespace }}
  labels:
    {{- include "keycloak-oidc.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "keycloak-oidc.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: reconcile
          image: {{ .Values.realmSecretsReconciler.image }}
          env:
            # Reuses the same public issuer origin rca-agent/acme-agent
            # already authenticate against (identity.keycloak.issuerUrl) --
            # not the in-cluster Service DNS name, which this chart never
            # otherwise references.
            - name: KEYCLOAK_BASE_URL
              value: {{ trimSuffix (printf "/realms/%s" .Values.keycloak.realm) .Values.openshiftOIDC.issuerURL | quote }}
            - name: KEYCLOAK_REALM
              value: {{ .Values.keycloak.realm | quote }}
            - name: KEYCLOAK_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.adminUser.secretName }}
                  key: {{ .Values.keycloak.adminUser.usernameKey }}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.adminUser.secretName }}
                  key: {{ .Values.keycloak.adminUser.passwordKey }}
            {{- if .Values.keycloak.consoleClientSecretVaultKey }}
            - name: CONSOLE_CLIENT_ID
              value: {{ .Values.keycloak.consoleClientId | quote }}
            - name: CONSOLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.openshiftOIDC.consoleClientSecretName }}
                  key: clientSecret
            {{- end }}
            {{- if .Values.keycloak.consoleAdminUser.enabled }}
            - name: CONSOLE_ADMIN_USERNAME
              value: {{ .Values.keycloak.consoleAdminUser.username | quote }}
            - name: CONSOLE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.consoleAdminUser.passwordSecretName }}
                  key: password
            {{- end }}
          command: ["python3", "-u", "-c"]
          args:
            - |
              import json, os, sys, urllib.error, urllib.parse, urllib.request

              base = os.environ["KEYCLOAK_BASE_URL"].rstrip("/")
              realm = os.environ["KEYCLOAK_REALM"]

              def call(method, path, token=None, data=None, form=False):
                  headers = {}
                  body = None
                  if data is not None:
                      if form:
                          body = urllib.parse.urlencode(data).encode()
                          headers["Content-Type"] = "application/x-www-form-urlencoded"
                      else:
                          body = json.dumps(data).encode()
                          headers["Content-Type"] = "application/json"
                  if token:
                      headers["Authorization"] = "Bearer " + token
                  request = urllib.request.Request(base + path, data=body, headers=headers, method=method)
                  try:
                      with urllib.request.urlopen(request, timeout=30) as resp:
                          raw = resp.read()
                          return json.loads(raw) if raw else None
                  except urllib.error.HTTPError as e:
                      sys.exit(f"{method} {path} failed: HTTP {e.code}")

              print("Authenticating to the Keycloak master realm...")
              token_resp = call("POST", "/realms/master/protocol/openid-connect/token", data={
                  "grant_type": "password",
                  "client_id": "admin-cli",
                  "username": os.environ["KEYCLOAK_ADMIN_USERNAME"],
                  "password": os.environ["KEYCLOAK_ADMIN_PASSWORD"],
              }, form=True)
              token = token_resp["access_token"]

              console_client_id = os.environ.get("CONSOLE_CLIENT_ID")
              if console_client_id:
                  print(f"Reconciling {console_client_id}'s client secret in realm {realm}...")
                  clients = call("GET", f"/admin/realms/{realm}/clients?clientId={urllib.parse.quote(console_client_id)}", token=token)
                  if not clients:
                      sys.exit(f"client {console_client_id} not found in realm {realm}")
                  client_uuid = clients[0]["id"]
                  client = call("GET", f"/admin/realms/{realm}/clients/{client_uuid}", token=token)
                  client["secret"] = os.environ["CONSOLE_CLIENT_SECRET"]
                  call("PUT", f"/admin/realms/{realm}/clients/{client_uuid}", token=token, data=client)
                  print("Client secret reconciled.")

              console_admin_username = os.environ.get("CONSOLE_ADMIN_USERNAME")
              if console_admin_username:
                  print(f"Reconciling {console_admin_username}'s password in realm {realm}...")
                  users = call("GET", f"/admin/realms/{realm}/users?username={urllib.parse.quote(console_admin_username)}&exact=true", token=token)
                  if not users:
                      sys.exit(f"user {console_admin_username} not found in realm {realm}")
                  user_id = users[0]["id"]
                  call("PUT", f"/admin/realms/{realm}/users/{user_id}/reset-password", token=token, data={
                      "type": "password",
                      "value": os.environ["CONSOLE_ADMIN_PASSWORD"],
                      "temporary": True,
                  })
                  print("User password reconciled.")

              print("Done.")
{{- end }}
