{{- if and .Values.realmImport.enabled (or .Values.keycloak.consoleClientSecretVaultKey .Values.keycloak.consoleAdminUser.enabled .Values.openshiftOIDC.enabled) }}
# KeycloakRealmImport only ever gets one shot (see keycloak-realm-import.yaml):
# it resolves its $(...) placeholders once, AND it is applied only when the
# realm does not already exist -- so any field that was absent or wrong at
# first-import time is never retroactively fixed by a re-sync. Three things
# this breaks in practice:
#   - $(...) placeholder substitution losing a startup race against the
#     referenced Secret/ExternalSecret/Vault chain (ClusterSecretStore not yet
#     Ready during a fresh cluster's bootstrap) bakes in the literal
#     placeholder text as the client secret / user password, with no retry.
#   - the openshift-console client's redirectUris being empty because the
#     realm was imported while openshiftOIDC.enabled was false (or predates
#     the redirectUris in the chart) -- the browser then hits Keycloak's
#     "Invalid parameter: redirect_uri" at console login.
# This PostSync hook re-asserts all of these directly against the running realm
# on every ArgoCD sync, so a botched one-shot import -- or any later rotation
# of a Vault value or flip of openshiftOIDC.enabled -- self-heals on the next
# sync instead of requiring a manual Admin REST API/Console fix.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.keycloak.realm }}-realm-secrets-reconciler
  namespace: {{ .Values.keycloak.namespace }}
  labels:
    {{- include "keycloak-oidc.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "keycloak-oidc.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: reconcile
          image: {{ .Values.realmSecretsReconciler.image }}
          env:
            # Reuses the same public issuer origin acme-agent and OpenShift
            # Lightspeed already authenticate against (identity.keycloak.issuerUrl) --
            # not the in-cluster Service DNS name, which this chart never
            # otherwise references.
            - name: KEYCLOAK_BASE_URL
              value: {{ trimSuffix (printf "/realms/%s" .Values.keycloak.realm) (include "keycloak-oidc.effectiveIssuerURL" .) | quote }}
            - name: KEYCLOAK_REALM
              value: {{ .Values.keycloak.realm | quote }}
            - name: KEYCLOAK_SKIP_TLS_VERIFY
              value: {{ .Values.realmSecretsReconciler.skipTlsVerify | quote }}
            {{- if .Values.realmSecretsReconciler.caBundleConfigMapName }}
            - name: KEYCLOAK_CA_BUNDLE
              value: /etc/keycloak-ca/ca-bundle.crt
            {{- end }}
            - name: KEYCLOAK_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.adminUser.secretName }}
                  key: {{ .Values.keycloak.adminUser.usernameKey }}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.adminUser.secretName }}
                  key: {{ .Values.keycloak.adminUser.passwordKey }}
            {{- if or .Values.keycloak.consoleClientSecretVaultKey .Values.openshiftOIDC.enabled }}
            - name: CONSOLE_CLIENT_ID
              value: {{ .Values.keycloak.consoleClientId | quote }}
            {{- end }}
            {{- if .Values.keycloak.consoleClientSecretVaultKey }}
            - name: CONSOLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.openshiftOIDC.consoleClientSecretName }}
                  key: clientSecret
            {{- end }}
            {{- if .Values.openshiftOIDC.enabled }}
            # Must match the redirectUris the realm import renders for this
            # client (keycloak-realm-import.yaml) -- same effectiveConsoleRoute
            # derivation, so an existing realm converges to what a fresh import
            # would have produced.
            - name: CONSOLE_REDIRECT_URIS
              value: {{ list (printf "%s/auth/callback" (include "keycloak-oidc.effectiveConsoleRoute" .)) | toJson | quote }}
            {{- end }}
            {{- if .Values.keycloak.consoleAdminUser.enabled }}
            - name: CONSOLE_ADMIN_USERNAME
              value: {{ .Values.keycloak.consoleAdminUser.username | quote }}
            - name: CONSOLE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.consoleAdminUser.passwordSecretName }}
                  key: password
            {{- end }}
          {{ if .Values.realmSecretsReconciler.caBundleConfigMapName }}
          volumeMounts:
            - name: keycloak-ca
              mountPath: /etc/keycloak-ca
              readOnly: true
          {{ end }}
          command: ["python3", "-u", "-c"]
          args:
            - |
              import json, os, ssl, sys, urllib.error, urllib.parse, urllib.request

              base = os.environ["KEYCLOAK_BASE_URL"].rstrip("/")
              realm = os.environ["KEYCLOAK_REALM"]
              skip_tls_verify = os.environ.get("KEYCLOAK_SKIP_TLS_VERIFY", "false").lower() == "true"
              ca_bundle = os.environ.get("KEYCLOAK_CA_BUNDLE")
              # create_default_context(cafile=...) REPLACES the system's
              # default trust store with only what's in cafile -- fine for a
              # self-signed internal ingress CA (a single root cert is
              # enough), but breaks verification on clusters whose ingress
              # uses a real public CA (e.g. ZeroSSL/Let's Encrypt) if the
              # synced bundle only has the leaf's intermediate chain and not
              # the actual trusted root. load_verify_locations() on top of
              # create_default_context() ADDS the custom CA as an extra
              # trust anchor instead, so both cases keep working.
              tls_context = ssl.create_default_context()
              if ca_bundle:
                  tls_context.load_verify_locations(cafile=ca_bundle)
              if skip_tls_verify:
                  print("WARNING: TLS certificate verification is disabled for Keycloak requests.")
                  tls_context = ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT)
                  tls_context.check_hostname = False
                  tls_context.verify_mode = ssl.CERT_NONE

              def call(method, path, token=None, data=None, form=False):
                  headers = {}
                  body = None
                  if data is not None:
                      if form:
                          body = urllib.parse.urlencode(data).encode()
                          headers["Content-Type"] = "application/x-www-form-urlencoded"
                      else:
                          body = json.dumps(data).encode()
                          headers["Content-Type"] = "application/json"
                  if token:
                      headers["Authorization"] = "Bearer " + token
                  request = urllib.request.Request(base + path, data=body, headers=headers, method=method)
                  try:
                      with urllib.request.urlopen(request, timeout=30, context=tls_context) as resp:
                          raw = resp.read()
                          return json.loads(raw) if raw else None
                  except urllib.error.HTTPError as e:
                      sys.exit(f"{method} {path} failed: HTTP {e.code}")

              print("Authenticating to the Keycloak master realm...")
              token_resp = call("POST", "/realms/master/protocol/openid-connect/token", data={
                  "grant_type": "password",
                  "client_id": "admin-cli",
                  "username": os.environ["KEYCLOAK_ADMIN_USERNAME"],
                  "password": os.environ["KEYCLOAK_ADMIN_PASSWORD"],
              }, form=True)
              token = token_resp["access_token"]

              console_client_id = os.environ.get("CONSOLE_CLIENT_ID")
              if console_client_id:
                  print(f"Reconciling the {console_client_id} client in realm {realm}...")
                  clients = call("GET", f"/admin/realms/{realm}/clients?clientId={urllib.parse.quote(console_client_id)}", token=token)
                  if not clients:
                      sys.exit(f"client {console_client_id} not found in realm {realm}")
                  client_uuid = clients[0]["id"]
                  client = call("GET", f"/admin/realms/{realm}/clients/{client_uuid}", token=token)
                  reconciled = []
                  console_secret = os.environ.get("CONSOLE_CLIENT_SECRET")
                  if console_secret:
                      client["secret"] = console_secret
                      reconciled.append("secret")
                  # redirectUris can't be fixed by re-running the one-shot realm
                  # import once the realm exists, so re-assert them here -- else
                  # console login fails with "Invalid parameter: redirect_uri".
                  redirect_uris = os.environ.get("CONSOLE_REDIRECT_URIS")
                  if redirect_uris:
                      desired = json.loads(redirect_uris)
                      if client.get("redirectUris") != desired:
                          client["redirectUris"] = desired
                          reconciled.append("redirectUris")
                  if reconciled:
                      call("PUT", f"/admin/realms/{realm}/clients/{client_uuid}", token=token, data=client)
                      print(f"Console client reconciled ({', '.join(reconciled)}).")
                  else:
                      print("Console client already in the desired state.")

              console_admin_username = os.environ.get("CONSOLE_ADMIN_USERNAME")
              if console_admin_username:
                  print(f"Reconciling {console_admin_username}'s password in realm {realm}...")
                  users = call("GET", f"/admin/realms/{realm}/users?username={urllib.parse.quote(console_admin_username)}&exact=true", token=token)
                  if not users:
                      sys.exit(f"user {console_admin_username} not found in realm {realm}")
                  user_id = users[0]["id"]
                  call("PUT", f"/admin/realms/{realm}/users/{user_id}/reset-password", token=token, data={
                      "type": "password",
                      "value": os.environ["CONSOLE_ADMIN_PASSWORD"],
                      "temporary": True,
                  })
                  print("User password reconciled.")

              print("Done.")
{{ if .Values.realmSecretsReconciler.caBundleConfigMapName }}
      volumes:
        - name: keycloak-ca
          configMap:
            name: {{ .Values.realmSecretsReconciler.caBundleConfigMapName }}
            items:
              - key: ca-bundle.crt
                path: ca-bundle.crt
{{ end }}
{{- end }}
