{{- if .Values.keycloak.consoleClientSecretVaultKey }}
# Two identical ExternalSecrets pulling the same Vault value, one per
# namespace: KeycloakRealmImport's placeholder substitution
# (keycloak-realm-import.yaml) needs it in keycloak.namespace, and
# Authentication/cluster's oidcClients[].clientSecret
# (openshiftOIDC.consoleClientSecretName) needs it in openshift-config --
# ExternalSecret always targets its own namespace, so one resource can't
# cover both. Deriving both from the same Vault value, instead of letting
# Keycloak generate one and hand-copying it, is what removes the manual step
# documented in the README.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.openshiftOIDC.consoleClientSecretName }}
  namespace: {{ .Values.keycloak.namespace }}
  labels:
    {{- include "keycloak-oidc.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.secretStore.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: {{ .Values.openshiftOIDC.consoleClientSecretName }}
  data:
    - secretKey: clientSecret
      remoteRef:
        key: {{ .Values.keycloak.consoleClientSecretVaultKey }}
        property: {{ .Values.keycloak.consoleClientSecretVaultProperty }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.openshiftOIDC.consoleClientSecretName }}
  namespace: openshift-config
  labels:
    {{- include "keycloak-oidc.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.secretStore.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: {{ .Values.openshiftOIDC.consoleClientSecretName }}
  data:
    - secretKey: clientSecret
      remoteRef:
        key: {{ .Values.keycloak.consoleClientSecretVaultKey }}
        property: {{ .Values.keycloak.consoleClientSecretVaultProperty }}
{{- end }}
