{{- if .Values.rbac.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.agenticRun.roleName }}
  namespace: {{ .Values.agenticRun.namespace }}
  labels:
    {{- include "keycloak-oidc.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.rbac.syncWave | quote }}
rules:
  # rca_agent only ever creates a freshly-named AgenticRun and polls it by
  # the name it already knows (mcp_agentic_run.py's
  # create_and_wait_for_analysis) -- it never lists, watches, or updates one
  # after creation (build_analysis_only_run always sets a new, unique
  # metadata.name). "patch" is required anyway, not just "create": the MCP
  # tool this Role backs, resources_create_or_update, implements its upsert
  # via Kubernetes Server-Side Apply, which the API server always processes
  # as an HTTP PATCH -- including for objects that don't exist yet -- so
  # RBAC checks the "patch" verb regardless of whether this is really a
  # create or an update from the caller's point of view (confirmed in
  # production: create-only RBAC was rejected with "cannot patch resource
  # agenticruns" on a brand-new, never-before-seen name). If a future client
  # needs list/watch, add those verbs explicitly rather than widening this
  # blindly.
  - apiGroups: ["agentic.openshift.io"]
    resources: ["agenticruns"]
    verbs: ["create", "patch", "get"]
  - apiGroups: ["agentic.openshift.io"]
    resources: ["analysisresults"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.agenticRun.roleName }}
  namespace: {{ .Values.agenticRun.namespace }}
  labels:
    {{- include "keycloak-oidc.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.rbac.syncWave | quote }}
subjects:
  {{- range .Values.agenticRun.groupNames }}
  - kind: Group
    name: {{ . | quote }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.agenticRun.roleName }}
{{- end }}
