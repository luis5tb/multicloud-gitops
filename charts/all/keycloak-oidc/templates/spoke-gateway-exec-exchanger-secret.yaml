{{- if .Values.keycloak.spokeGatewayExecExchanger.enabled }}
{{- $exchanger := .Values.keycloak.spokeGatewayExecExchanger }}
# The execution exchanger credential is materialized into both Keycloak's
# namespace (realm import placeholder/reconciler) and the Praxis namespace
# (execution gateway pods), from one Vault value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $exchanger.secretName }}
  namespace: {{ .Values.keycloak.namespace }}
  labels:
    {{- include "keycloak-oidc.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.secretStore.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: {{ $exchanger.secretName }}
  data:
    - secretKey: client-secret
      remoteRef:
        key: {{ $exchanger.vaultKey }}
        property: {{ $exchanger.vaultProperty }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $exchanger.secretName }}
  namespace: {{ $exchanger.targetNamespace }}
  labels:
    {{- include "keycloak-oidc.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.secretStore.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: {{ $exchanger.secretName }}
  data:
    - secretKey: client-secret
      remoteRef:
        key: {{ $exchanger.vaultKey }}
        property: {{ $exchanger.vaultProperty }}
{{- end }}
