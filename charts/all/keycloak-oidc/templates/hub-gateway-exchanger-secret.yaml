{{- if .Values.keycloak.hubGatewayExchanger.enabled }}
{{- $hg := .Values.keycloak.hubGatewayExchanger }}
# Client secret of the Praxis HUB GATEWAY's exchanger (the client named by
# Token A's audience, default keycloak.masA2aAudience = mas-a2a), which
# exchanges A -> H before forwarding to the lightspeed-hub adapter
# (praxis-proxy a2aUpstream.exchangeAtPraxis). Two ExternalSecrets pulling
# the same Vault value, one per namespace (same pattern as
# hub-exchange-secret.yaml): the realm import's placeholder needs it in
# keycloak.namespace, the hub gateway reads it in targetNamespace.
# The Vault value MUST be alphanumeric (values-secret.yaml.template
# alphaNumericPolicy): Praxis sends Basic client auth without URL-encoding.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $hg.secretName }}
  namespace: {{ .Values.keycloak.namespace }}
  labels:
    {{- include "keycloak-oidc.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.secretStore.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: {{ $hg.secretName }}
  data:
    - secretKey: client-secret
      remoteRef:
        key: {{ $hg.vaultKey }}
        property: {{ $hg.vaultProperty }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $hg.secretName }}
  namespace: {{ $hg.targetNamespace }}
  labels:
    {{- include "keycloak-oidc.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.secretStore.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: {{ $hg.secretName }}
  data:
    - secretKey: client-secret
      remoteRef:
        key: {{ $hg.vaultKey }}
        property: {{ $hg.vaultProperty }}
{{- end }}
