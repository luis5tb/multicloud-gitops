{{- if .Values.realmImport.enabled }}
{{- range .Values.keycloak.externalOidcProviders }}
{{- $credentials := default dict .credentials }}
{{- if $credentials.vaultKey }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "keycloak-oidc.externalProviderSecretName" (dict "root" $ "provider" .) }}
  namespace: {{ $.Values.keycloak.namespace }}
  labels:
    {{- include "keycloak-oidc.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ $.Values.secretStore.refreshInterval }}
  secretStoreRef:
    name: {{ $.Values.secretStore.name }}
    kind: {{ $.Values.secretStore.kind }}
  target:
    name: {{ include "keycloak-oidc.externalProviderSecretName" (dict "root" $ "provider" .) }}
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: {{ $credentials.vaultKey | quote }}
        property: {{ default "client-id" $credentials.clientIdProperty | quote }}
    - secretKey: client-secret
      remoteRef:
        key: {{ $credentials.vaultKey | quote }}
        property: {{ default "client-secret" $credentials.clientSecretProperty | quote }}
{{- end }}
{{- end }}
{{- end }}
