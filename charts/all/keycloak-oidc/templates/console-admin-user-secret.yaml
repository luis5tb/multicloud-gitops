{{- if .Values.keycloak.consoleAdminUser.enabled }}
{{- if not .Values.keycloak.adminGroupName }}
{{- fail "keycloak.adminGroupName must be set when keycloak.consoleAdminUser.enabled is true" }}
{{- end }}
{{- if not .Values.keycloak.consoleAdminUser.passwordVaultKey }}
{{- fail "keycloak.consoleAdminUser.passwordVaultKey must be set when keycloak.consoleAdminUser.enabled is true" }}
{{- end }}
# Initial password for keycloak.consoleAdminUser, read by
# keycloak-realm-import.yaml's $(CONSOLE_ADMIN_PASSWORD) placeholder. Only
# needs to exist in keycloak.namespace -- unlike console-client-secret.yaml,
# nothing outside the realm import reads this value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.keycloak.consoleAdminUser.passwordSecretName }}
  namespace: {{ .Values.keycloak.namespace }}
  labels:
    {{- include "keycloak-oidc.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.secretStore.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: {{ .Values.keycloak.consoleAdminUser.passwordSecretName }}
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.keycloak.consoleAdminUser.passwordVaultKey }}
        property: {{ .Values.keycloak.consoleAdminUser.passwordVaultProperty }}
{{- end }}
