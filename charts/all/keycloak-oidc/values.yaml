# Cluster-wide anchors shared across this pattern's charts (supplied by the
# clustergroup values layer -- variants/<variant>/values-<variant>.yaml). Empty
# defaults here keep the chart generic; the real values come from global.* at
# deploy time. See _helpers.tpl's domain-derivation block.
global:
  # Base cluster domain WITHOUT the apps. prefix, e.g. ocp.example.com. The
  # single anchor the Keycloak issuer, console route and SPIFFE trust domain
  # derive from. Falls back to the framework-injected global.localClusterDomain
  # (apps wildcard domain) with apps. stripped when left empty.
  clusterBaseDomain: ""
  # Framework-injected apps wildcard domain; used only as the fallback source
  # for clusterBaseDomain.
  localClusterDomain: ""

keycloak:
  namespace: keycloak-system
  name: keycloak
  realm: rca
  displayName: RCA
  # Public client used only for browser/oc-login OIDC flows (Native OIDC),
  # registered as OpenShift's "cli" platform client below -- named for that
  # role, not for the RCA agent: this has nothing to do with the agent
  # request flow. It cannot authenticate itself, so it must never be used
  # for the confidential clients below.
  clientId: openshift-cli
  clientName: OpenShift CLI (Native OIDC)
  # Confidential client acme-agent uses for its client-credentials call
  # to Keycloak (auth.keycloak.clientId in
  # charts/all/acme-agent).
  acmeClientId: acme-agent
  acmeClientName: ACME A2A agent
  # Optional access-token lifespan (seconds) for acme-agent's client (Token
  # A). Empty keeps the realm default (300). Also a test aid ("120" to
  # exercise expiry and renewal). INTERIM USE: the lightspeed-hub run-token
  # Secret carries Token A for the whole AgenticRun step, and nothing renews
  # it mid-step, so a 300s Token A killed every investigation about 5 min in
  # (live, 2026-11-20). The standalone variant raises it until the adapter
  # stores a run-scoped token instead (docs/GATEWAY_MODE_SCOPED_TOKEN_EXCHANGE.md
  # s8). Delete that override once it does. Realm imports only apply when the
  # realm is first created; on an existing realm set Clients > acme-agent >
  # Advanced > Access Token Lifespan.
  acmeAccessTokenLifespanSeconds: ""
  # Dedicated group for calls attributed to acme-agent -- named
  # <caller>-<callee> (not just "acme-agent") so it reads as
  # "acme-agent's rights in the RCA realm", not acme-agent's rights in
  # general; a future second caller gets its own <caller>-rca group rather
  # than sharing this one. Required for acme-agent's tokens to carry any
  # groups claim at all (see agents/AUTHENTICATION.md).
  acmeGroupName: acme-agent-rca
  # Confidential client registered as the web console's OIDC platform client
  # when openshiftOIDC.enabled is true. When consoleClientSecretVaultKey
  # below is set, this chart generates its secret itself and feeds the same
  # value into openshiftOIDC.consoleClientSecretName -- no manual step. Left
  # empty, Keycloak generates the secret at import time instead, and
  # charts/all/keycloak-oidc/README.md's one-time manual copy step applies.
  consoleClientId: openshift-console
  consoleClientName: OpenShift Console (Native OIDC)
  # Optional realm group. Members get cluster-admin (via the ClusterRoleBinding
  # below) once openshiftOIDC.enabled is true, so there is at least one way to
  # reach the console as an administrator through Keycloak itself. Empty
  # disables the group and binding entirely. See the README section
  # "Keeping admin access after enabling OIDC" -- this is deliberately opt-in
  # and separate from the CLI break-glass credential, which this cannot
  # replace: it only helps once Keycloak/OIDC is already working correctly.
  adminGroupName: ""

  # Optional human user created in this realm and put in adminGroupName
  # above, so there's at least one way to log into the OpenShift console via
  # Keycloak without any manual Admin Console step. Requires adminGroupName
  # to be set (fails otherwise). Off by default -- a standing cluster-admin
  # credential is a permanent addition to the cluster's attack surface, and
  # this is on top of, not a replacement for, breakGlass above.
  #
  # One-shot caveat: like the rest of the realm import, this only takes
  # effect on a fresh realm import -- enabling it after the realm already
  # exists does not retroactively create the user (see the README).
  consoleAdminUser:
    enabled: false
    username: cluster-admin
    # Name of the Secret (in keycloak.namespace, key "password") this user's
    # initial password is read from -- created via console-admin-user-secret.yaml
    # when passwordVaultKey is set.
    passwordSecretName: console-admin-user
    # Vault path/property holding the initial password (property name
    # passwordVaultProperty below), generated once by
    # values-secret.yaml.template's onMissingValue: generate. The realm
    # import sets temporary: true on this credential, so Keycloak forces a
    # password change on first login -- this generated value is never meant
    # to be the long-term password. Required when consoleAdminUser.enabled
    # is true.
    passwordVaultKey: ""
    passwordVaultProperty: console-admin-password

  # Vault path holding openshift-console's client secret (property name
  # consoleClientSecretVaultProperty below), generated once by
  # values-secret.yaml.template's onMissingValue: generate rather than left
  # for Keycloak to auto-generate and copied into
  # openshiftOIDC.consoleClientSecretName by hand. Both this chart's copy of
  # the secret (fed into the realm import's openshift-console client via a
  # KeycloakRealmImport placeholder) and openshiftOIDC.consoleClientSecretName
  # read the same Vault value through External Secrets Operator, so they
  # always agree. Leave empty to keep the manual step (see README).
  #
  # One-shot caveat: like the rest of the realm import, this only takes
  # effect on a fresh realm import. Setting it after the realm already
  # exists does not rotate the existing client's secret -- see the README.
  consoleClientSecretVaultKey: ""
  consoleClientSecretVaultProperty: console-client-secret

  # Master-realm admin credentials, used only by
  # realm-secrets-reconciler-job.yaml (an ArgoCD PostSync hook) to
  # re-assert openshift-console's client secret and consoleAdminUser's
  # password directly against the running realm on every sync -- this is
  # what makes those two one-shot-substituted values above self-heal instead
  # of silently staying wrong forever if the substitution ever loses its
  # startup race (see that file's comment). This Secret is created by the
  # separate "keycloak" application's rhbk chart (its
  # keycloak.adminUser.passwordVaultKey), not this chart.
  adminUser:
    secretName: keycloak-admin-user
    usernameKey: username
    passwordKey: password

  # SPIFFE identity provider the two confidential agent clients below
  # authenticate against instead of a static secret (federated client
  # authentication -- see https://www.keycloak.org/2026/01/federated-client-authentication).
  # Both the identity provider and the per-client federated-jwt config are
  # fully templated: no manual Admin Console step is required.
  spiffeIdentityProvider:
    enabled: true
    alias: spiffe
    # Bare SPIFFE trust domain, e.g. apps.<cluster-domain> -- same value and
    # format as identity.clusterSpiffeID.trustDomain in charts/all/acme-agent
    # (see the zero-trust-workload-identity-manager application's comment in
    # values-standalone.yaml). This template adds the "spiffe://" scheme itself.
    trustDomain: ""
    # SPIRE's OIDC discovery provider JWKS endpoint, e.g.
    # https://spire-spiffe-oidc-discovery-provider.zero-trust-workload-identity-manager.svc.cluster.local/keys
    bundleEndpoint: ""
  # External OIDC providers trusted for token exchange. The import and
  # PostSync hook share this configuration; existing IdPs are matched by issuer
  # before alias. Endpoints are explicit so this also works with non-Keycloak
  # issuers whose endpoint paths cannot be derived from their issuer URL.
  # No plaintext client secret is accepted in values. Reuse the caller's Vault
  # record (client-id/client-secret), or a same-namespace existing Secret with
  # those two keys. Secret rotation is applied on the next ArgoCD sync.
  externalOidcProviders: []
  # - alias: external-sso
  #   displayName: External SSO
  #   issuerUrl: https://sso.example.com/realms/example
  #   authorizationUrl: https://sso.example.com/realms/example/protocol/openid-connect/auth
  #   tokenUrl: https://sso.example.com/realms/example/protocol/openid-connect/token
  #   jwksUrl: https://sso.example.com/realms/example/protocol/openid-connect/certs
  #   tokenIntrospectionUrl: https://sso.example.com/realms/example/protocol/openid-connect/token/introspect
  #   userInfoUrl: https://sso.example.com/realms/example/protocol/openid-connect/userinfo
  #   clientAuthMethod: client_secret_post
  #   defaultScope: openid
  #   credentials:
  #     vaultKey: secret/data/global/external-sso
  #     clientIdProperty: client-id       # default
  #     clientSecretProperty: client-secret # default
  #     # Alternative to vaultKey (Secret in keycloak.namespace):
  #     # existingSecretName: external-sso-credentials
  #   # Legacy providers without managed credentials may still set clientId.
  #   isAccessTokenJWT: "true"
  #   allowTokenExchange: true
  #   # Optional groups assigned to every brokered caller; groups must exist.
  #   hardcodedGroups:
  #     - acme-agent-rca
  # The namespace/ServiceAccount pair ZTWIM/SPIRE issues acme-agent's
  # JWT-SVID for, used to compute its confidential client's expected
  # federated subject (spiffe://<trustDomain>/ns/<namespace>/sa/<serviceAccount>).
  # Must match charts/all/acme-agent's own Deployment/ServiceAccount
  # namespace exactly, or Keycloak will reject the client assertion with
  # "Invalid client or Invalid client credentials".
  acmeWorkload:
    namespace: acme-agent
    serviceAccount: acme-agent
  # Separate audience for the MAS inbound A2A endpoint. It is added to
  # openshift-cli and acme-agent client tokens; MAS validates this audience in
  # addition to its exact caller-subject allow-list.
  masA2aAudience: mas-a2a
  # Dedicated audience for the separately exposed MAS management API. The
  # openshift-cli client mapper below lets authorized human administrators
  # mint tokens for the MAS API without reusing the inbound A2A audience.
  masApiAudience: mas-api

  # PHASE 2 B1 (PROPOSED, disabled by default): confidential client +
  # audience mappers for the per-spoke Praxis spoke-gateways' RFC 8693
  # token exchange (charts/all/praxis-proxy's spokeGateways; see
  # PLAN-lightspeed-hub-migration.md "B1 wiring" and "Keycloak exchange
  # prerequisites"). The spoke gateway (PPE) authenticates as this client
  # with its own client secret and exchanges the caller's Token A for a
  # spoke-audience Token U before forwarding to the fixed remote API.
  # This is proposed integration, NOT confirmed support: whether the
  # pinned Praxis image (praxis-policy 0.3.1) supports the oauth
  # delegator at all is UNVERIFIED (its recipes are documented for PPE
  # 0.4.x) -- see charts/all/praxis-proxy/README.md "Spoke gateways
  # (B1, proposed)".
  spokeGatewayExchanger:
    enabled: false
    # Confidential client ID. Must match
    # charts/all/praxis-proxy's spokeGatewayConfig.exchangeClient.clientId.
    clientId: praxis-spoke-gateway
    clientName: Praxis spoke-gateway token exchanger
    # Vault path holding the client secret (property
    # vaultProperty below), following the same Vault-backed
    # ExternalSecret pattern as consoleClientSecretVaultKey. The secret is
    # materialized into BOTH keycloak.namespace (for the realm import's
    # placeholder substitution) and targetNamespace (where the spoke
    # gateway pods read it) -- see spoke-gateway-exchanger-secret.yaml.
    # Required when enabled. Fresh imports use ${NAME} interpolation;
    # the PostSync realm-secrets-reconciler also repairs/verifies this
    # credential on existing clients from the Keycloak-namespace Secret.
    vaultKey: ""
    vaultProperty: praxis-spoke-gateway-client-secret
    # Namespace the gateway-facing copy of the client-secret Secret lands
    # in. Must be the praxis-proxy Application's namespace and match
    # charts/all/praxis-proxy's
    # spokeGatewayConfig.exchangeClient.secretName target namespace.
    targetNamespace: praxis-proxy
    # Name of the Secret materialized in both namespaces (keys: client-id,
    # client-secret). Must match charts/all/praxis-proxy's
    # spokeGatewayConfig.exchangeClient.secretName.
    secretName: praxis-spoke-gateway-client
    # Per-spoke Keycloak audiences for the exchanged Token U -- one entry
    # per registered spoke, each matching the spoke gateway's
    # exchangeAudience. Rendered as one oidc-audience-mapper per entry on
    # the exchanger client. UNCONFIRMED GUESS: the exact mapper set needed
    # for exchanged tokens to carry each spoke audience depends on live
    # Keycloak behavior (whether mappers on the exchanging client apply to
    # RFC 8693-exchanged tokens, or whether the audience must instead ride
    # the subject token) -- validate against a live realm before relying
    # on it.
    spokeAudiences: []
    #   - praxis-spoke-east
    # Adds an audience mapper putting the exchanger's client ID on the
    # acme-agent client's tokens (Token A). Per the plan's documented
    # Keycloak exchange prerequisite (b), the SUBJECT token must already
    # carry the exchanging client as an audience -- the `audience`
    # request parameter only ever narrows, never adds. UNCONFIRMED GUESS:
    # this changes Token A for every consumer of the acme-agent client;
    # verify no audience-sensitive validator rejects the extra audience
    # before enabling.
    subjectTokenAudienceMapper: true

  # TASK B / PHASE 1 H-SIDE WIRING (DISABLED BY DEFAULT): Keycloak
  # prerequisites for the hub A2A adapter's A->H token exchange
  # (charts/all/lightspeed-hub's adapter.keycloak.clientId; see
  # PLAN-lightspeed-hub-migration.md Phase 1 "First exchange"). Without
  # hubGatewayExchanger the ADAPTER performs A->H itself; with it (the
  # standalone variant) Praxis exchanges A->H as mas-a2a and this client
  # becomes H's audience and the adapter's H->R exchanger (see
  # hubGatewayExchanger below and docs/agentic-e2e-token-flow.html).
  #
  # This block mints the adapter's confidential exchange client, the hub
  # audience on exchanged Token H, and the group mappers that put the
  # principal's Keycloak groups on H. One-shot realm import only: on a
  # realm that already imported (like this branch's live cluster), the
  # client and mappers must be created manually in the Admin Console (see
  # the chart README). The PostSync reconciler repairs/verifies only the
  # existing client's secret, using the Vault-backed Kubernetes value.
  hubExchange:
    enabled: false
    # Confidential client ID. Must match charts/all/lightspeed-hub's
    # adapter.keycloak.clientId (the adapter's --keycloak-client-id).
    clientId: lightspeed-hub-adapter
    clientName: lightspeed-hub A2A adapter token exchanger
    # Vault path holding the client secret (property vaultProperty below),
    # following the same Vault-backed ExternalSecret pattern as the spoke
    # exchanger. The secret is materialized into BOTH keycloak.namespace
    # (realm-import placeholder) and targetNamespace (the adapter's
    # namespace, where the adapter reads it as
    # adapter.keycloak.clientSecretSecret.name). Required when enabled.
    vaultKey: ""
    vaultProperty: lightspeed-hub-adapter-client-secret
    # Namespace the adapter-facing copy of the client-secret Secret lands
    # in: the lightspeed-hub Application's namespace. Must match
    # charts/all/lightspeed-hub's namespace / clientSecretSecret reference.
    targetNamespace: lightspeed-hub
    # Name of the Secret materialized in both namespaces (keys: client-id,
    # client-secret). Must match charts/all/lightspeed-hub's
    # adapter.keycloak.clientSecretSecret.name.
    secretName: lightspeed-hub-adapter-client
    # Hub audience minted onto the EXCHANGED Token H. Must equal
    # charts/all/lightspeed-hub's adapter.hubAudience, and must stay
    # distinct from every other audience in this realm (fail-guarded in
    # keycloak-realm-import.yaml). Required when enabled.
    hubAudience: ""
    # Group protocol mappers so EXCHANGED tokens (H) carry the principal's
    # Keycloak groups while minted A stays groupless (the plan's Phase 1
    # contract: "separate mint/exchange client scopes and group mappers so
    # initial A omits groups while H/U include them").
    #
    # UNCONFIRMED GUESS (plan spike item #5): whether mappers on THIS
    # client apply to RFC 8693-EXCHANGED tokens depends on live Keycloak
    # behavior (standard.token.exchange.enabled is set below; whether the
    # exchange response runs the target client's protocol mappers must be
    # validated against a live realm before relying on it). If they do
    # not, the groups must ride the subject token's client scope instead
    # -- which conflicts with groupless A, so resolve the spike before
    # enabling.
    #
    # CLAIM_MAP NOTE (if Praxis policy ever inspects H's groups): PPE's
    # "keycloak" claim_mapper preset maps REALM ROLES, not groups -- an
    # explicit claim_map entry would be needed to surface a groups claim
    # into the policy bag (see charts/all/praxis-proxy/files/policy.yaml
    # and the PPE cmf-extensions docs). Nothing on this leg reads H's
    # groups at Praxis; the hub API's OIDC group mapping does.
    groupMappers: true
    # RFC 8693 prerequisite (b), same as the spoke exchanger's: the
    # SUBJECT token (A) must already carry the exchanging client as an
    # audience (the `audience` request parameter only ever narrows, never
    # adds). When true, adds an audience mapper putting this client's ID
    # on the acme-agent client's tokens (Token A). UNCONFIRMED GUESS: adds
    # an audience to every Token A; verify no audience-sensitive validator
    # (MAS, Praxis allow-list) rejects the extra audience before enabling.
    subjectTokenAudienceMapper: true
    # RUN TOKEN R: audience the adapter's exchange client adds so it can
    # exchange its inbound token for R (the spoke gateway's exchanger
    # client, e.g. praxis-spoke-gateway). Must equal charts/all/lightspeed-hub's
    # adapter.runTokenAudience. Empty = no run token (the adapter stores its
    # inbound token as-is).
    runTokenAudience: ""
    # Lifespan (seconds) of tokens this client exchanges -- i.e. R. Sized to
    # an AgenticRun step (e.g. "1800"); empty = realm default (300).
    runTokenLifespanSeconds: ""

  # HUB GATEWAY EXCHANGER (docs/GATEWAY_MODE_SCOPED_TOKEN_EXCHANGE.md): the
  # client the Praxis HUB GATEWAY (charts/all/praxis-proxy, main gateway in
  # front of the lightspeed-hub adapter, a2aUpstream.exchangeAtPraxis)
  # authenticates as to exchange the caller's Token A for Token H. It IS
  # Token A's audience client (masA2aAudience) -- Keycloak only exchanges a
  # subject token carrying the exchanging client in `aud` -- so the caller
  # requests ONLY that audience. When enabled, also: hubExchange.clientId
  # must equal hubExchange.hubAudience (the adapter exchanges H as H's
  # audience client), both subjectTokenAudienceMapper flags must be false
  # (Token A = [masA2aAudience]), and hubExchange.runTokenAudience is
  # required. One-shot realm import: existing realms need the client created
  # via the admin API (README "Hub gateway exchange"). Its secret is then
  # repaired/verified by the PostSync reconciler, without client recreation.
  hubGatewayExchanger:
    enabled: false
    # Empty = keycloak.masA2aAudience (must equal it).
    clientId: ""
    clientName: Praxis hub gateway token exchanger (A -> H)
    # Vault path/property of the client secret. ALPHANUMERIC ONLY
    # (values-secret.yaml.template alphaNumericPolicy): the Praxis delegator
    # sends Basic client auth without URL-encoding.
    vaultKey: ""
    vaultProperty: praxis-hub-exchange-client-secret
    # Namespace of the hub gateway (praxis-proxy) and the Secret name it
    # reads (praxis-proxy a2aUpstream.exchange.secretName).
    targetNamespace: praxis-proxy
    secretName: praxis-hub-exchange-client

  # AUDIENCE-SCOPED EXCHANGE ROLES (docs/GATEWAY_MODE_SCOPED_TOKEN_EXCHANGE.md
  # s4.3). Kubernetes RBAC binds groups, not audiences; with a plain group
  # mapper every exchanged token (H for the hub API, U for each spoke API)
  # carries the same `groups`, so -- when the hub is its own spoke -- what is
  # granted for U (cluster read) is also usable with H, and what is granted
  # for H (create AgenticRuns) is also usable with U, which an LLM drives.
  # When enabled:
  #   - each exchange TARGET audience client (hubExchange.hubAudience, every
  #     spokeGatewayExchanger.spokeAudiences entry) gets client roles
  #     (hubRoles / spokeRoles);
  #   - the realm groups listed in `groups` get all of those roles (group
  #     membership stays the single "who is allowed" switch);
  #   - each exchanger gets fullScopeAllowed: false plus role scope mappings
  #     for only its audiences' roles, and a client-role mapper projecting
  #     ONLY its audience's roles into `groups`, prefixed "<audience>:"
  #     (replacing hubExchange.groupMappers on the hub exchanger).
  # Result on the kube API (Native OIDC maps `groups` -> keycloak:<entry>):
  #   H -> Group keycloak:<hubAudience>:<hubRole>      (e.g. ...:agenticrun-creator)
  #   U -> Group keycloak:<spokeAudience>:<spokeRole>  (e.g. praxis-spoke-hub:reader)
  # Bind RBAC to those groups (charts/all/lightspeed-hub), never to the
  # user (identical across tokens). One-shot realm import only: an
  # already-imported realm needs these created via the admin API/console
  # (see README "Audience-scoped exchange roles").
  exchangeRoles:
    enabled: false
    # Realm groups (must be created by this import: acmeGroupName and/or
    # adminGroupName) whose members get every role below.
    groups: []
    #   - acme-agent-rca
    # Roles on the hub audience client (what H may do on the hub API).
    hubRoles:
      - agenticrun-creator
    # Roles on each spoke audience client (what U may do on that spoke).
    spokeRoles:
      - reader

openshiftOIDC:
  enabled: false
  providerName: keycloak
  issuerURL: ""
  # The web console's public route, e.g.
  # https://console-openshift-console.apps.<cluster-domain>. Used both as
  # the redirect URI Keycloak accepts for keycloak.consoleClientId and to
  # register the console as an OIDC platform client below. Find it with:
  #   oc whoami --show-console
  consoleRoute: ""
  # Name of a Secret in the openshift-config namespace, key "clientSecret",
  # holding keycloak.consoleClientId's secret. When
  # keycloak.consoleClientSecretVaultKey is set, this chart creates this
  # Secret itself via External Secrets Operator; otherwise it must be
  # created manually with Keycloak's generated secret (see the README).
  consoleClientSecretName: openshift-console-oidc
  # Extra token audiences to accept beyond the required platform client IDs
  # (keycloak.clientId for the CLI, keycloak.consoleClientId for the
  # console). Leave empty unless a workload forwards tokens minted for
  # another audience straight to this API server.
  extraAudiences: []
  usernameClaim: sub
  usernamePrefix: "keycloak:"
  groupsClaim: groups
  groupsPrefix: "keycloak:"
  caConfigMapName: ""
  # Copies the managed ingress CA into openshift-config before applying the
  # Authentication resource, then refreshes it periodically for CA rotations.
  # The same bundle is also copied into keycloak.namespace for the realm
  # reconciler when realmSecretsReconciler.caBundleConfigMapName is set.
  caBundleSync:
    enabled: false
    sourceNamespace: openshift-config-managed
    sourceConfigMap: default-ingress-cert
    sourceKey: ca-bundle.crt
    targetConfigMapName: keycloak-oidc-ca
    # Additional namespace-local copies of the same bundle. Leave empty unless
    # another workload (for example MAO) needs to trust the managed-ingress CA.
    # Each namespace receives a Role scoped to targetConfigMapName.
    additionalTargetNamespaces: []
    schedule: "*/5 * * * *"
    image: registry.access.redhat.com/ubi9/python-312-minimal:9.6
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

# Cluster-admin ServiceAccount + non-expiring token Secret in
# openshift-config, independent of Authentication/cluster's spec.type: it
# keeps working no matter what openshiftOIDC.enabled is set to, since
# ServiceAccount tokens never go through the OAuth/OIDC login flow. Run
# `make admin-break-glass-kubeconfig` (Makefile) to turn the token into a
# local kubeconfig file once this is deployed. See the README section
# "Keeping admin access after enabling OIDC". Off by default -- a standing
# cluster-admin credential is a permanent addition to the cluster's attack
# surface, so opt in deliberately rather than getting it for free.
breakGlass:
  enabled: false
  serviceAccountName: admin-break-glass

# ClusterSecretStore used by console-client-secret.yaml (Vault-backed,
# matching the rest of this pattern's External Secrets usage).
secretStore:
  name: vault-backend
  kind: ClusterSecretStore
  refreshInterval: 2m0s

realmImport:
  enabled: true
  syncWave: "5"
  # KeycloakRealmImport gets exactly one shot: on a fresh install it can lose
  # a race against the Keycloak CR's own creation ("keycloaks ... not
  # found"), land in HasErrors, and never retry on its own -- not even once
  # the Keycloak CR becomes Ready (observed live; see
  # docs/LESSONS_LEARNED.md, Keycloak: realm import and clients). This
  # CronJob watches for exactly that state and deletes the
  # errored import so ArgoCD's self-heal recreates it against the now-Ready
  # Keycloak CR -- the same manual `oc delete keycloakrealmimport <realm>`
  # recovery, automated. It also heals any later recurrence (e.g. an
  # operator reconcile that re-breaks it). Needs only python3's stdlib; pin
  # a real tag, not "latest".
  selfHeal:
    enabled: true
    schedule: "*/5 * * * *"
    image: registry.access.redhat.com/ubi9/python-312-minimal:9.6
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

# Image for realm-secrets-reconciler-job.yaml. Needs only python3's stdlib
# (json/urllib) -- no curl/jq dependency to pin separately. Pin a real tag,
# not "latest", for the same reason praxis-proxy's chart does.
realmSecretsReconciler:
  image: registry.access.redhat.com/ubi9/python-312-minimal:9.6
  # Optional ConfigMap in keycloak.namespace containing the Keycloak issuer CA
  # under ca-bundle.crt. Prefer this over skipTlsVerify for private issuers.
  caBundleConfigMapName: ""
  # Set true only as a last resort; it disables hostname and certificate
  # verification for the realm reconciliation requests.
  skipTlsVerify: false

rbac:
  enabled: true
  syncWave: "10"
