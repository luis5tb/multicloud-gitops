# SINGLE CLUSTER-DOMAIN ANCHOR. Almost everything cluster-specific in this file
# derives from global.clusterBaseDomain -- the cluster's base domain WITHOUT the
# apps. prefix (what `oc whoami --show-server` shows after `api.` and before
# `:6443`). From it each chart's templates derive the Keycloak issuer, console
# route, SPIFFE trust domain, public A2A host and the olsClusters apiURL, so you
# no longer hand-repeat the domain across ~11 overrides (see AGENTS.md and each
# chart's _helpers.tpl). The clustergroup framework also injects
# global.localClusterDomain (this cluster's apps wildcard domain); clusterBaseDomain
# falls back to that with `apps.` stripped, so on many clusters you can leave
# clusterBaseDomain empty and edit nothing here at all. Any derived value is still
# explicitly overridable in the per-app overrides below.
#
# Shared cluster-selection registry for the ACME -> Praxis -> OpenShift
# Lightspeed routing path. See LIGHTSPEED_DESIGN.md SS7 and
# LIGHTSPEED_IMPLEMENTATION_PLAN.md Phase 6 (frozen interface). ACME reads only
# `apiURL` + the map key (the routing ID it sends as X-OLS-Cluster); Praxis reads
# the map key + upstream fields and must never route from apiURL or any
# caller-supplied value. Both workstreams render from this ONE map -- do not fork
# a second copy. Each entry now needs only its KEY + apiURL: the in-cluster
# upstreamHost/upstreamPort/upstreamSNI default to the operator-managed
# Lightspeed app-server Service (see charts/all/praxis-proxy's upstreamDefaults),
# overridable per entry for a future cross-cluster backend. The key MUST equal
# derive_cluster_id(apiURL) -- lowercase host, every '.'/':' replaced by '-';
# openshift-lightspeed-config's render validates this and fails loud on a drift
# (the footgun AGENTS.md calls out). To add a second cluster (goal 5), add
# another entry.
global:
  clusterBaseDomain: ocp.phkl2.sandbox315.opentlc.com
  # Keycloak realm the issuer URLs derive from; must equal the keycloak-oidc
  # Application's keycloak.realm override below (default rca).
  keycloakRealm: rca
  olsClusters:
    api-ocp-phkl2-sandbox315-opentlc-com-6443:
      apiURL: https://api.ocp.phkl2.sandbox315.opentlc.com:6443
      # This is the local OLS cluster, so Praxis uses the in-cluster HTTPS
      # Service and the injected service-ca bundle. For a remote OLS cluster,
      # set upstreamHost/Port/SNI to its Route and configure trust for that
      # Route's ingress CA separately.

clusterGroup:
  name: standalone
  namespaces:
    vault:
    external-secrets-operator:
      operatorGroup: true
      targetNamespaces: []
    external-secrets:
    redhat-ods-operator:
      operatorGroup: true
      targetNamespaces: []
    zero-trust-workload-identity-manager:
      operatorGroup: true
    keycloak-system:
      operatorGroup: true
    mao:
    acme-agent:
    praxis-proxy:
    # Deliberately not "openshift-lightspeed" -- see
    # charts/all/openshift-lightspeed-config/values.yaml's namespace comment
    # for why (ZTWIM's spire-controller-manager hardcodes
    # ignoreNamespaces: [..., "openshift-*"], confirmed live, with no
    # override surface).
    a2a-lightspeed:
      operatorGroup: true
      # lightspeed-operator's CSV only declares OwnNamespace as a supported
      # installMode (SingleNamespace/MultiNamespace/AllNamespaces are all
      # false) -- an empty targetNamespaces here renders an AllNamespaces
      # OperatorGroup, which OLM then refuses with
      # "AllNamespaces InstallModeType not supported, cannot configure to
      # watch all namespaces" / UnsupportedOperatorGroup, permanently
      # failing the CSV (confirmed on a live cluster: this is not
      # theoretical). Must be scoped to exactly this namespace.
      targetNamespaces:
        - a2a-lightspeed
  subscriptions:
    eso:
      name: openshift-external-secrets-operator
      namespace: external-secrets-operator
      channel: stable-v1
    # RHOAI/KServe dependency, not part of the OLS/A2A investigation flow:
    # OpenShift AI's single-model (KServe) serving stack requires Service Mesh.
    # Keep in sync with the rhoai subscription / rhoai-config application below.
    servicemesh:
      name: servicemeshoperator
      namespace: openshift-operators
      channel: stable
    # RHOAI/KServe dependency, not part of the OLS/A2A investigation flow:
    # KServe's model-serving authorization (Authorino) backs RHOAI serverless
    # inference endpoints. Keep in sync with the rhoai subscription below.
    authorino:
      name: authorino-operator
      namespace: openshift-operators
      channel: tech-preview-v1
      source: redhat-operators
      sourceNamespace: openshift-marketplace
    rhoai:
      name: rhods-operator
      namespace: redhat-ods-operator
    ztwim:
      name: openshift-zero-trust-workload-identity-manager
      namespace: zero-trust-workload-identity-manager
      channel: stable-v1
    rhbk:
      name: rhbk-operator
      namespace: keycloak-system
      channel: stable-v26.4
    lightspeed-operator:
      # Package name taken from the Red Hat Operators catalog; channel is a
      # best guess ("stable" is the conventional default-channel name used
      # by most Red Hat operators) -- NEEDS CONFIRMATION AGAINST THE LIVE
      # CATALOG before cutover (e.g. `oc get packagemanifest lightspeed-operator
      # -o yaml` on the target cluster). source/sourceNamespace likewise
      # assume the operator this pattern needs is published to the stock
      # redhat-operators catalog; see
      # charts/all/openshift-lightspeed-config/README.md's "MCP hardening"
      # section for the still-open question of whether a custom/patched
      # operator build is required instead.
      name: lightspeed-operator
      namespace: a2a-lightspeed
      channel: stable
      source: redhat-operators
      sourceNamespace: openshift-marketplace
  argoProjects:
    - hub
    - openshift-ai

  sharedValueFiles:
    - '/overrides/values-{{ $.Values.global.clusterPlatform }}.yaml'

  applications:
    vault:
      name: vault
      namespace: vault
      argoProject: hub
      chart: hashicorp-vault
      chartVersion: 0.1.*
    openshift-external-secrets:
      name: openshift-external-secrets
      namespace: external-secrets
      argoProject: hub
      chart: openshift-external-secrets
      chartVersion: 0.0.*
    rhoai-config:
      name: rhoai-config
      namespace: redhat-ods-operator
      project: openshift-ai
      path: charts/all/rhoai-config
    zero-trust-workload-identity-manager:
      name: zero-trust-workload-identity-manager
      namespace: zero-trust-workload-identity-manager
      argoProject: hub
      chart: ztwim
      chartVersion: 0.1.*
      # No trustDomain override needed: the chart defaults spire.trustDomain
      # to global.localClusterDomain (this cluster's apps domain), which is
      # exactly the value acme-agent's
      # identity.clusterSpiffeID.trustDomain override below must match.
      # Look it up after install with:
      #   oc get zerotrustworkloadidentitymanager cluster -o jsonpath='{.spec.trustDomain}'
    keycloak:
      name: keycloak
      namespace: keycloak-system
      argoProject: hub
      # Vendored copy of the validatedpatterns rhbk chart (was chart: rhbk,
      # chartVersion: 0.1.*). Vendored to add keycloak.extraFeatures, which the
      # upstream chart hardcodes-out: it needs features beyond spiffe/
      # client-auth-federated on the Keycloak CR. Re-sync with upstream on bumps.
      path: charts/all/rhbk
      overrides:
        # Vault paths for the admin/DB passwords defined in values-secret.yaml.template
        - name: keycloak.adminUser.passwordVaultKey
          value: secret/data/global/rhbk
        - name: keycloak.postgresqlDb.passwordVaultKey
          value: secret/data/global/rhbk
        - name: keycloak.spiffeIdentityProvider.enabled
          value: "true"
        # Enable V2 external->internal token exchange so OLS can broker external
        # Red Hat SSO (prod/stage) caller tokens via the red-hat-sso-* IdPs using
        # subject_issuer. Versioned/preview feature; operator rebuilds the server
        # image and rolls keycloak-0. See agents/AUTHENTICATION.md.
        - name: keycloak.extraFeatures[0]
          value: token-exchange-external-internal:v2
    keycloak-oidc:
      name: keycloak-oidc
      namespace: keycloak-system
      argoProject: hub
      path: charts/all/keycloak-oidc
      overrides:
        - name: keycloak.namespace
          value: keycloak-system
        - name: keycloak.name
          value: keycloak
        - name: keycloak.realm
          value: rca
        # Dedicated audience for Keycloak-authenticated MAS API administrators;
        # distinct from the inbound MAS A2A audience (mas-a2a).
        - name: keycloak.masApiAudience
          value: mas-api
        # Bootstrap the managed ingress CA into openshift-config (for the
        # Authentication OIDC provider) and keycloak-system (for the realm
        # reconciler), and mao (for optional MAS Keycloak JWKS trust), then
        # refresh those copies periodically for CA rotation. The MAS pods
        # still need identity.keycloakCaTrust.enabled when switched to
        # Keycloak mode; this override alone does not enable MAS A2A.
        - name: openshiftOIDC.caConfigMapName
          value: keycloak-oidc-ca
        - name: openshiftOIDC.caBundleSync.enabled
          value: "true"
        - name: openshiftOIDC.caBundleSync.additionalTargetNamespaces[0]
          value: mao
        - name: realmSecretsReconciler.caBundleConfigMapName
          value: keycloak-oidc-ca
        # Native OIDC is cluster-wide and switches Authentication/cluster's
        # spec.type for the ENTIRE cluster at once (console, oc login,
        # everything) -- so it is opt-in, and must stay "false" here until
        # the pre-flight checklist in charts/all/keycloak-oidc/README.md has
        # been walked start to finish. Enabling it before the realm import
        # has actually succeeded and the console client's Secret exists
        # locks out console AND CLI login cluster-wide with
        # ExternalOIDCControllerDegraded (this has happened -- recovery
        # command is in that README too).
        - name: openshiftOIDC.enabled
          value: "true"
        # openshiftOIDC.issuerURL and openshiftOIDC.consoleRoute are no longer
        # set here: both derive from global.clusterBaseDomain at the top of this
        # file (https://keycloak.apps.<base>/realms/<realm> and
        # https://console-openshift-console.apps.<base>). Add an explicit
        # override here only to diverge from that derivation.
        # Cluster-admin ServiceAccount + non-expiring token Secret in
        # openshift-config, independent of openshiftOIDC.enabled. Safe to
        # enable any time; run `make admin-break-glass-kubeconfig` after
        # this syncs. See charts/all/keycloak-oidc/README.md.
        - name: breakGlass.enabled
          value: "true"
        # Keycloak group bound to cluster-admin once openshiftOIDC.enabled
        # is true. Named plainly, not "rca-admins" -- cluster-admin access
        # granted through Keycloak has nothing to do with the RCA agent
        # specifically. NOTE: the realm import on this cluster already
        # succeeded before this override existed, so it won't retroactively
        # create this group -- create it once manually in the Admin Console
        # (Groups -> New group -> "cluster-admins"), then add your user to
        # it, before enabling openshiftOIDC.
        - name: keycloak.adminGroupName
          value: cluster-admins
        # Generates openshift-console's client secret from Vault instead of
        # the manual Admin Console copy step in the README -- see
        # keycloak.consoleClientSecretVaultKey in
        # charts/all/keycloak-oidc/values.yaml. Unlike adminGroupName above,
        # this does NOT depend on the one-shot realm import: the
        # realm-secrets-reconciler PostSync hook re-asserts the console
        # client's secret (and, once openshiftOIDC.enabled, its redirectUris)
        # against the running realm on every sync, so it applies even though
        # this realm imported before the override existed.
        - name: keycloak.consoleClientSecretVaultKey
          value: secret/data/global/rhbk
        # Creates a human user in this realm, in keycloak.adminGroupName
        # above (-> cluster-admin), with an initial password from Vault --
        # see keycloak.consoleAdminUser in charts/all/keycloak-oidc/values.yaml.
        # Same one-shot caveat as adminGroupName above. Change
        # keycloak.consoleAdminUser.username below if "cluster-admin" (the
        # chart default) isn't the name you want.
        - name: keycloak.consoleAdminUser.enabled
          value: "true"
        - name: keycloak.consoleAdminUser.passwordVaultKey
          value: secret/data/global/rhbk

        # Federate the acme-agent/lightspeed-mcp confidential clients'
        # authentication against SPIRE's OIDC discovery provider, so
        # SPIFFE-identified workloads authenticate to Keycloak without a
        # static secret. See:
        # https://www.keycloak.org/2026/01/federated-client-authentication
        # trustDomain is not set here: it derives from global.clusterBaseDomain
        # (apps.<base>). bundleEndpoint is an in-cluster Service URL, not
        # domain-derived, so it stays explicit below.
        - name: keycloak.spiffeIdentityProvider.bundleEndpoint
          value: https://spire-spiffe-oidc-discovery-provider.zero-trust-workload-identity-manager.svc.cluster.local/keys
        # Namespace/ServiceAccount pair ZTWIM/SPIRE issues ACME's JWT-SVID
        # for. Must match charts/all/acme-agent's own Deployment exactly.
        - name: keycloak.acmeWorkload.namespace
          value: acme-agent
        - name: keycloak.acmeWorkload.serviceAccount
          value: acme-agent
        # Namespace/ServiceAccount pair the OpenShift Lightspeed Operator
        # creates its app-server workload in, used to compute the
        # lightspeed-mcp client's expected federated subject. Confirm the
        # real operator-created ServiceAccount name on this cluster's
        # installed operator release before relying on this default (see
        # LIGHTSPEED_DESIGN.md's "How Token B is issued" section).
        - name: keycloak.lightspeedWorkload.namespace
          value: a2a-lightspeed
        - name: keycloak.lightspeedWorkload.serviceAccount
          value: lightspeed-app-server
        # External OIDC providers Keycloak trusts for RFC 8693 token exchange.
        # When OLS receives a token from Red Hat SSO (prod or stage), it
        # exchanges that token via Keycloak's token endpoint using that SSO
        # token as the subject_token. Keycloak validates the subject_token by
        # checking its signature against these providers' JWKS. Without this,
        # token exchange fails with "unknown issuer".
        - name: keycloak.externalOidcProviders[0].alias
          value: red-hat-sso-prod
        - name: keycloak.externalOidcProviders[0].displayName
          value: "Red Hat SSO Production"
        - name: keycloak.externalOidcProviders[0].issuerUrl
          value: https://sso.redhat.com/auth/realms/redhat-external
        - name: keycloak.externalOidcProviders[0].jwksUrl
          value: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/certs
        - name: keycloak.externalOidcProviders[0].allowTokenExchange
          value: "true"
        - name: keycloak.externalOidcProviders[1].alias
          value: red-hat-sso-stage
        - name: keycloak.externalOidcProviders[1].displayName
          value: "Red Hat SSO Stage"
        - name: keycloak.externalOidcProviders[1].issuerUrl
          value: https://sso.stage.redhat.com/auth/realms/redhat-external
        - name: keycloak.externalOidcProviders[1].jwksUrl
          value: https://sso.stage.redhat.com/auth/realms/redhat-external/protocol/openid-connect/certs
        - name: keycloak.externalOidcProviders[1].allowTokenExchange
          value: "true"
        # Namespace scope for lightspeed-mcp-rbac.yaml's Role/RoleBinding,
        # granting the keycloak:acme-agent-rca group read-only MCP access.
        # No override here -- left at the chart's own default (empty list,
        # see charts/all/keycloak-oidc/values.yaml's lightspeedRbac.namespaces):
        # renders zero Role/RoleBinding resources, so acme-agent has no MCP
        # access anywhere until Phase 2 sets this to the real namespace(s)
        # on your cluster, e.g.:
        #   - name: lightspeedRbac.namespaces[0]
        #     value: "<your-namespace>"
        # Add more namespaces as lightspeedRbac.namespaces[1], etc. as
        # investigation scope grows. Prefer this explicit list for anything
        # resembling a real environment -- see LIGHTSPEED_DESIGN.md's
        # least-privilege guidance.
        #
        # Sandbox/demo alternative: uncomment to grant cluster-wide access
        # instead of an explicit namespace list (a single ClusterRole/
        # ClusterRoleBinding, not per-namespace Role/RoleBinding -- a real
        # widening of blast radius, not just a convenience toggle; see that
        # value's comment in charts/all/keycloak-oidc/values.yaml before
        # uncommenting this on anything but a throwaway cluster):
        - name: lightspeedRbac.allNamespaces
          value: "true"
        # Confirmed live, twice: the operator-managed MCP server's generic
        # investigation tools (`namespaces_list`, `resources_list`) are not
        # pod-specific -- they can ask about any resource kind the model
        # decides is relevant (namespaces, Deployments, ...), and the chart's
        # default pods/events-only rule list only ever covers whatever kind
        # has already been hit by a real investigation; every new kind is a
        # new RBAC gap. Switched to OpenShift's built-in "view" ClusterRole
        # (see its comment in charts/all/keycloak-oidc/values.yaml) instead
        # of chasing individual resource kinds one at a time via extraRules --
        # still excludes Secrets and RBAC objects, same boundary
        # LIGHTSPEED_DESIGN.md's "Rights to grant (and not grant)" draws,
        # just not re-derived resource-by-resource. Appropriate for this
        # sandbox cluster, which already opted into allNamespaces above.
        - name: lightspeedRbac.useBuiltinViewRole
          value: "true"
        # Confirmed live: MCP's `list_metrics` tool fails with a bare
        # "client error: 403" even with useBuiltinViewRole above -- cluster/
        # pod metrics (Thanos querier) sit behind OpenShift monitoring's own
        # auth proxy, checking a separate permission "view" doesn't include.
        # See lightspeedRbac.grantMonitoringView's comment in
        # charts/all/keycloak-oidc/values.yaml.
        - name: lightspeedRbac.grantMonitoringView
          value: "true"
        # Opt-in SCOPED WRITE: let the agent actually apply changes (not just
        # diagnose) in the listed namespace(s) only, via a RoleBinding to the
        # built-in "edit" ClusterRole. A deliberate blast-radius widening over
        # the read-only default -- read stays as scoped above; write is limited
        # to exactly these namespaces. Writes are attributed to the real caller
        # via the identity chain (auditable). Add more as writeNamespaces[1],
        # etc. Remove to return the agent to read-only. The MCP server already
        # exposes write tools (its config read_only=false, set by the
        # appServerPatch bridge). See lightspeedRbac.writeNamespaces in
        # charts/all/keycloak-oidc/values.yaml.
        - name: lightspeedRbac.writeNamespaces[0]
          value: payments
    praxis-proxy:
      name: praxis-proxy
      namespace: praxis-proxy
      argoProject: hub
      path: charts/all/praxis-proxy
      ignoreDifferences:
        - group: apps
          kind: Deployment
          name: praxis-proxy
          namespace: praxis-proxy
          jsonPointers:
            - /spec/template/metadata/annotations/ca-bundle-sync-sha256
      overrides:
        # Public, policy-enforcing gateway in front of OpenShift Lightspeed.
        # Ingress to the OLS app-server is limited to this proxy by the
        # NetworkPolicy configured in the openshift-lightspeed-config chart.
        - name: route.enabled
          value: "true"
        # route.host derives from global.clusterBaseDomain
        # (openshift-lightspeed.apps.<base>); override here only to diverge.
        # OLS may take a while to complete a tool-using, multi-turn analysis.
        - name: route.timeout
          value: 22m
        # Demo / flow-monitor verbosity (RUST_LOG): info globally, debug only
        # on Praxis routing + JWT identity crates so scripts/monitor.sh can
        # surface allow/deny without flooding every crate. Chart default is
        # empty (sparse). For quieter prod, remove this override or set "".
        # Bare "debug" also works but is much noisier -- see
        # charts/all/praxis-proxy/values.yaml logLevel comment.
        - name: logLevel
          value: info,praxis_filter=debug,praxis_policy_plugin_identity_jwt=debug
        # identity.keycloak.issuerUrl derives from global.clusterBaseDomain +
        # global.keycloakRealm (https://keycloak.apps.<base>/realms/<realm>);
        # override here only to diverge.
        # Run Praxis as a pure router/load-balancer: skip the policy filter
        # (no caller JWT verification, no azp allow-list). OpenShift Lightspeed
        # is the validating boundary -- its multi-issuer inbound OIDC validates
        # the caller token (Keycloak + Red Hat SSO prod/stage) and its Keycloak
        # RFC 8693 exchange re-validates it. This is also required so the UI's
        # own Red Hat SSO token (azp != acme-agent) can reach OLS, which the
        # azp allow-list would otherwise block; and it avoids Praxis's Rust
        # client failing to fetch the external SSO JWKS over IPv6 on this
        # IPv4-egress cluster. See agents/AUTHENTICATION.md. The identity.* and
        # policy.* settings below are inert while disabled (kept for easy
        # re-enable). Disabling policy also skips the enforcementTest Job.
        - name: policy.enabled
          value: "false"
        # The pinned Praxis AI 0.4.1 policy filter only has a filter-wide
        # private IdP egress switch. Its only configured callout is this
        # static Keycloak JWKS URL; do not add user-controlled URLs here.
        - name: policy.allowPrivateIdp
          value: "true"
        # Praxis's policy transport uses OpenSSL's trust file. Sync the
        # managed ingress CA into this namespace for the Keycloak JWKS fetch.
        - name: policy.caBundleConfigMap.name
          value: praxis-keycloak-ca
        - name: policy.caBundleSync.enabled
          value: "true"
        # Static agent card for multi-cluster routing: Praxis serves its own
        # agent card (with Praxis's endpoint as rpc_url) instead of proxying
        # to the first OLS cluster. This ensures MAS and other A2A clients
        # call Praxis (which routes based on X-OLS-Cluster header) instead
        # of bypassing Praxis by calling OLS directly.
        - name: agentCard.enabled
          value: "true"
        # agentCard.name, description, skills inherit OLS defaults from
        # charts/all/praxis-proxy/values.yaml; override only to diverge.
        # agentCard.rpcUrl auto-derives from global.clusterBaseDomain.
        # NOTE: inert while policy.enabled=false (Praxis runs router-only in
        # standalone; see the policy.enabled override above). Kept for an easy
        # re-enable. Accept Red Hat SSO production and stage tokens in addition
        # to the local Keycloak issuer (which the chart appends automatically).
        # SSO audience is api.ask_red_hat -- verified from a real sso.stage
        # token whose aud array is
        # ["cloud-services","api.graphql","api.ask_red_hat","api.console"];
        # api.ask_red_hat is the narrowest value that fits the assistant use case.
        - name: identity.oidcIssuers[0].name
          value: red-hat-sso-prod
        - name: identity.oidcIssuers[0].issuerUrl
          value: https://sso.redhat.com/auth/realms/redhat-external
        - name: identity.oidcIssuers[0].jwksUrl
          value: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/certs
        - name: identity.oidcIssuers[0].audience
          value: api.ask_red_hat
        - name: identity.oidcIssuers[1].name
          value: red-hat-sso-stage
        - name: identity.oidcIssuers[1].issuerUrl
          value: https://sso.stage.redhat.com/auth/realms/redhat-external
        - name: identity.oidcIssuers[1].jwksUrl
          value: https://sso.stage.redhat.com/auth/realms/redhat-external/protocol/openid-connect/certs
        - name: identity.oidcIssuers[1].audience
          value: api.ask_red_hat
        # Upstream selection is no longer a single fixed host/port: Praxis
        # now routes per request to one of the backends registered under the
        # top-level global.olsClusters map (added above), matched by an
        # exact X-OLS-Cluster header per cluster ID. See
        # charts/all/praxis-proxy/files/praxis.yaml and its README. The
        # former `upstream.host`/`upstream.port` single-backend override is
        # intentionally removed; do not re-add it.
    acme-agent:
      name: acme-agent
      namespace: acme-agent
      argoProject: hub
      path: charts/all/acme-agent
      ignoreDifferences:
        - group: apps
          kind: Deployment
          name: acme-agent
          namespace: acme-agent
          jsonPointers:
            - /spec/template/metadata/annotations/ca-bundle-sync-sha256
      overrides:
        - name: image.repository
          value: quay.io/ltomasbo/acme-agent
        - name: image.tag
          # Quoted: this is an all-digit git short SHA, and an unquoted
          # numeric-looking YAML scalar this large gets parsed as a number
          # and can come back out the other side of Helm/Argo's rendering
          # pipeline re-serialized in scientific notation (confirmed live:
          # it became "3.425697e+07", which then fails to parse as an image
          # reference -- InvalidImageName). Always quote tags that could be
          # all-digits.
          value: "dca32e28"
        # Trust the cluster's managed ingress CA for the HTTPS Praxis route
        # and Keycloak token endpoint, keeping certificate verification on.
        - name: auth.caBundleConfigMap.name
          value: acme-agent-ingress-ca
        - name: auth.caBundleConfigMap.key
          value: ca-bundle.crt
        - name: auth.caBundleSync.enabled
          value: "true"
        # PHASE 1: Route to Praxis (default)
        # Praxis's public Route is the downstream agent endpoint. An entry with
        # no endpoint derives it from global.clusterBaseDomain:
        # https://openshift-lightspeed.apps.<base>
        # This routes ACME → Praxis → OLS

        # PHASE 3: Route to MAS A2A (uncomment after Phase 2)
        # After MAS A2A is enabled, uncomment this to route ACME → MAS A2A → OLS
        # Must be a valid Python identifier (ADK RemoteA2aAgent): use
        # underscores, not hyphens.
        - name: a2a.remoteAgents[0].name
          value: mas_orchestrator
        - name: a2a.remoteAgents[0].description
          value: "MAS A2A Orchestrator for OpenShift Lightspeed"
        - name: a2a.remoteAgents[0].endpoint
          value: "https://mao-a2a-mas-a2a-mao.apps.ocp.phkl2.sandbox315.opentlc.com"
        # Outbound OLS mode (metadata.ols_mode); chart default is troubleshooting.
        - name: a2a.olsMode
          value: troubleshooting
        #- name: a2a.remoteAgents[0].name
        #  value: openshift_lightspeed
        #- name: a2a.remoteAgents[0].description
        #  value: Answers OpenShift questions and investigates cluster incidents using OpenShift Lightspeed grounded against the live cluster via its OpenShift MCP tools.
        # No ACME-specific olsClusters override here: the chart now reads
        # the single shared `global.olsClusters` registry declared at the
        # top of this file directly (see charts/all/acme-agent/values.yaml
        # and LIGHTSPEED_DESIGN.md SS7) -- ACME and Praxis render
        # their allow-lists from one map, not two independently maintained
        # copies.
        # Allow 60s beyond OLS's analysis for polling and returning the
        # final A2A response.
        - name: a2a.requestTimeout
          value: "1260"
        - name: auth.mode
          value: keycloak
        # auth.keycloak.issuerUrl and .tokenUrl derive from
        # global.clusterBaseDomain + global.keycloakRealm (the token URL is the
        # issuer + /protocol/openid-connect/token); override only to diverge.
        - name: auth.keycloak.clientId
          value: acme-agent
        - name: identity.spiffe.enabled
          value: "true"
        - name: identity.clusterSpiffeID.enabled
          value: "true"
        # identity.clusterSpiffeID.trustDomain derives from
        # global.clusterBaseDomain (apps.<base>), which is exactly the cluster's
        # trust domain (see the zero-trust-workload-identity-manager application's
        # comment above); override only to diverge.
        - name: route.enabled
          value: "true"
        # Allow the browser's A2A request to survive the long-running analysis.
        - name: route.timeout
          value: 22m
        - name: litellm.apiBase
          value: https://maas-rhdp.apps.maas.redhatworkshops.io/v1
        - name: litellm.model
          value: openai/gpt-oss-20b
    openshift-lightspeed-config:
      name: openshift-lightspeed-config
      namespace: a2a-lightspeed
      argoProject: hub
      path: charts/all/openshift-lightspeed-config
      overrides:
        # MCP hardening: a CRD investigation confirmed there is NO OLSConfig
        # field to set require_oauth / harden MCP auth (the operator hardcodes
        # the MCP config TOML). So there is nothing to enable at the OLSConfig
        # level; the hardening is applied by appServerPatch.mcpHardening below
        # (Mode A), which patches the operator-generated MCP ConfigMap
        # directly. See charts/all/openshift-lightspeed-config/README.md's
        # "MCP hardening" section and LIGHTSPEED_DESIGN.md section 5.
        #
        # caBundleSync copies the managed ingress CA into this namespace.
        # Mode A MCP passthrough does not need it; the optional OIDC trust
        # bridge below uses it for inbound OIDC issuer discovery/JWKS if the
        # Keycloak Route is privately signed (Mode B MCP validation remains
        # future work).
        - name: identity.keycloak.caBundleSync.enabled
          value: "true"
        # Enabled now that appServerPatch actually deploys the A2A-enabled
        # app-server image needing this identity to register.
        - name: identity.clusterSpiffeID.enabled
          value: "true"
        # identity.clusterSpiffeID.trustDomain derives from
        # global.clusterBaseDomain (apps.<base>) -- the cluster's trust domain;
        # override only to diverge.
        # TEMPORARY A2A bridge (see charts/all/openshift-lightspeed-config/
        # README.md's "Temporary A2A bridge" section) -- patches the
        # operator-managed app-server Deployment with the custom OLS image,
        # A2A_* env vars, and operator-generated config required by
        # luis5tb/lightspeed-service@a2a-split. Rebuild/push this branch's
        # image before sync; the tag below is the SOURCE SHA, not proof that
        # the image already exists in the registry.
        # Delete this override block entirely once the Operator/OLSConfig CRD
        # natively supports a custom service image and A2A configuration.
        - name: appServerPatch.enabled
          value: "true"
        # Mounts A2A routes (POST /a2a) via A2A_ENABLED=true. Chart default
        # is already true when appServerPatch is used; kept explicit here.
        - name: appServerPatch.a2a.enabled
          value: "true"
        # a2a-split makes RFC 8693 exchange opt-in (false by default). The
        # bridge must write a2a.token_exchange_enabled into the operator's
        # app-server ConfigMap -- an env var alone does not enable it. Without
        # this, Token A reaches MCP instead of an exchanged Token B.
        - name: appServerPatch.a2a.tokenExchangeEnabled
          value: "true"
        # Broker EXTERNAL caller tokens (UI's Red Hat SSO prod/stage) through
        # their Keycloak identity provider during the RFC 8693 exchange: map the
        # token issuer URL to the IdP alias (must match keycloak-oidc's
        # externalOidcProviders[*].alias: red-hat-sso-prod / red-hat-sso-stage).
        # a2a_auth.py sends subject_issuer so Keycloak validates the external
        # token via that IdP instead of failing "subject_token validation
        # failure". Keycloak-native tokens (acme-agent) are not listed and
        # exchange unchanged. Indexed-list form (not a JSON string): a JSON
        # object value would be mis-parsed by Helm --set into a list.
        - name: appServerPatch.a2a.exchangeSubjectIssuers[0].issuer
          value: https://sso.redhat.com/auth/realms/redhat-external
        - name: appServerPatch.a2a.exchangeSubjectIssuers[0].alias
          value: red-hat-sso-prod
        - name: appServerPatch.a2a.exchangeSubjectIssuers[1].issuer
          value: https://sso.stage.redhat.com/auth/realms/redhat-external
        - name: appServerPatch.a2a.exchangeSubjectIssuers[1].alias
          value: red-hat-sso-stage
        # Operator source names the app-server config ConfigMap "olsconfig"
        # (key "olsconfig.yaml"); confirm on the installed operator release
        # with `oc get cm olsconfig -n a2a-lightspeed` before cutover.
        - name: appServerPatch.a2a.configMapName
          value: olsconfig
        # a2a-split reuses the app-server's configured OIDC auth module for
        # inbound A2A. Praxis runs router-only (policy.enabled=false), so OLS is
        # the sole validating boundary: it checks issuer, audience and signature
        # per issuer, then performs the Keycloak RFC 8693 exchange. This is the
        # Keycloak-issuer audience (the one ACME's Keycloak Token A carries).
        - name: appServerPatch.a2a.inboundOidcAudience
          value: lightspeed-a2a
        # OLS validates these external SSO issuers as well as the local Keycloak
        # issuer, which the chart appends using inboundOidcAudience above
        # (keycloak -> lightspeed-a2a). SSO prod/stage audience is api.ask_red_hat,
        # verified from a real sso.stage token (aud array includes it); the
        # Keycloak path keeps lightspeed-a2a. Each issuer validates its own token.
        - name: appServerPatch.a2a.oidcIssuers[0].issuer_url
          value: https://sso.redhat.com/auth/realms/redhat-external
        - name: appServerPatch.a2a.oidcIssuers[0].audience
          value: api.ask_red_hat
        - name: appServerPatch.a2a.oidcIssuers[0].username_claim
          value: preferred_username
        - name: appServerPatch.a2a.oidcIssuers[0].jwks_cache_seconds
          value: "300"
        - name: appServerPatch.a2a.oidcIssuers[1].issuer_url
          value: https://sso.stage.redhat.com/auth/realms/redhat-external
        - name: appServerPatch.a2a.oidcIssuers[1].audience
          value: api.ask_red_hat
        - name: appServerPatch.a2a.oidcIssuers[1].username_claim
          value: preferred_username
        - name: appServerPatch.a2a.oidcIssuers[1].jwks_cache_seconds
          value: "300"
        # HTTPX's inbound OIDC validation uses certifi, not only the OS trust
        # store. Mount the Secret synced above under /etc/certs; the a2a-split
        # runner appends this CA to its public-root SSL_CERT_FILE bundle.
        # Verify the operator's app-server still supplies the writable
        # SSL_CERT_FILE under /etc/certs before enabling on another release.
        - name: appServerPatch.oidcTrust.enabled
          value: "true"
        # Confirm Phase 0 step 1's podman build/push completed before sync;
        # don't deploy a stale image from the old a2a branch.
        - name: appServerPatch.image.repository
          value: quay.io/ltomasbo/openshift-lightspeed
        - name: appServerPatch.image.tag
          # Quote: a git short SHA that happens to be all-digits would otherwise
          # parse as a number and re-serialize in scientific notation, breaking
          # the image reference (AGENTS.md hard-won lesson).
          value: "54be8114"
        # appServerPatch.a2a.keycloakIssuerURL derives from
        # global.clusterBaseDomain + global.keycloakRealm, and
        # appServerPatch.a2a.rpcUrl from global.clusterBaseDomain
        # (https://openshift-lightspeed.apps.<base>/a2a) -- the same host
        # keycloak-oidc/praxis/acme derive, plus the /a2a JSON-RPC path the
        # OLS image mounts; override only to diverge.
        #
        # clusterId must be a KEY of global.olsClusters above (the X-OLS-Cluster
        # routing id this app-server advertises). It is kept explicit -- not
        # derived -- because with multiple registered clusters this names WHICH
        # one this app-server serves; the chart validates it against the registry
        # (and that each key matches derive_cluster_id(apiURL)) at render time.
        - name: appServerPatch.a2a.clusterId
          value: api-ocp-phkl2-sandbox315-opentlc-com-6443
        # Mode A MCP hardening: closes the MCP tokenless confused-deputy gap
        # (LIGHTSPEED_DESIGN.md section 5). The operator-generated OpenShift
        # MCP server ships with require_oauth=false, so a tokenless call falls
        # back to the MCP pod's ServiceAccount, bypassing the whole Keycloak/
        # SPIFFE/RBAC identity chain. The OLSConfig CRD has no field to harden
        # this (confirmed), so the appServerPatch bridge patches the operator-
        # generated MCP ConfigMap directly to set require_oauth=true +
        # skip_jwt_verification=true + cluster_auth_mode=passthrough (require a
        # bearer; the OpenShift API server validates it via passthrough), after
        # pausing the operator by annotating the OLSConfig CR Unmanaged. This
        # is a TEMPORARY bridge -- delete it once the operator exposes
        # require_oauth natively via OLSConfig.
        - name: appServerPatch.mcpHardening.enabled
          value: "true"
        # Keep the OLS app-server Route disabled for this same-cluster setup;
        # Praxis reaches it through the internal Service. Enable a Route only
        # when a remote cluster needs to reach this OLS instance.
    mao-mongo:
      name: mao-mongo
      namespace: mao
      argoProject: hub
      path: charts/all/mao/mongo
    mao-redis:
      name: mao-redis
      namespace: mao
      argoProject: hub
      path: charts/all/mao/redis
      overrides:
        # Keep this in sync with the connection secret consumed by the API and worker.
        - name: connectionSecret.name
          value: mao-secret-redis
    mao-temporal:
      name: mao-temporal
      namespace: mao
      argoProject: hub
      path: charts/all/mao/temporal
    mao-worker:
      name: mao-worker
      namespace: mao
      argoProject: hub
      path: charts/all/mao/mas-worker
      overrides:
        # The API, Temporal worker, and inbound A2A server must run the same
        # A2A-capable MAS build.
        - name: image.repository
          value: quay.io/ltomasbo/mas-api
        - name: image.tag
          value: "a80e09316564"
        - name: image.pullPolicy
          value: Always
        # DEBUG temporarily to capture the orchestrator's planning LLM
        # request/response while diagnosing why it finalizes without
        # delegating to the OLS investigator. Revert to INFO once resolved.
        - name: logLevel
          value: DEBUG
        # Sync the shared Gemini-on-Vertex ADC creds (same Vault key OLS uses)
        # into the mao namespace and mount them, so the orchestrator can run on
        # a google_genai (Vertex) LLM resource. Gemini returns proper
        # OpenAI-style tool_calls; gpt-oss over the MaaS returns harmony tool
        # calls that break plan building. Register the LLM with
        # `LLM_PROVIDER=vertex ./setup-mas-blueprint.sh multi-cluster`.
        - name: vertexCreds.enabled
          value: "true"
    mao-api:
      name: mao-api
      namespace: mao
      argoProject: hub
      path: charts/all/mao/mas-api
      overrides:
        - name: image.repository
          value: quay.io/ltomasbo/mas-api
        - name: image.tag
          value: "a80e09316564"
        - name: image.pullPolicy
          value: Always
        # DEV MODE: Accept any token without validation (for testing/blueprint setup)
        # WARNING: Do not use in production - no authentication security!
        - name: identity.providerMode
          value: dev
        # In dev mode, all authenticated requests get user_id="dev"
        # Add "dev" to adminAllowedUsers so it can access resources
        - name: identity.adminAllowedUsers
          value: '["dev"]'
        # These settings are not used in dev mode but kept for reference:
        # - name: identity.keycloakAudience
        #   value: mas-api
        # - name: identity.keycloakCaTrust.enabled
        #   value: "true"
    mao-a2a:
      name: mao-a2a
      namespace: mao
      argoProject: hub
      path: charts/all/mao/mas-a2a
      overrides:
        - name: image.repository
          value: quay.io/ltomasbo/mas-api
        - name: image.tag
          value: "a80e09316564"
        - name: image.pullPolicy
          value: Always
        # PHASE 2: Enable after creating blueprint and obtaining ACME's principal
        - name: a2a.enabled
          value: "true"
        - name: a2a.blueprintId
          value: "fdd32952-ee40-4db8-acac-f549c1dc9e54"
        # Must match the route host OpenShift generates for this Service.
        # With route.host unset, the host derives from the generated route
        # name (<release>-<chart>-<ns>): mao-a2a-mas-a2a-mao.apps...
        - name: a2a.publicBaseUrl
          value: "https://mao-a2a-mas-a2a-mao.apps.ocp.phkl2.sandbox315.opentlc.com"
        # Must be a real list: the chart applies toJson so the app can JSON-decode
        # the A2A_ALLOWED_PRINCIPALS env var into a list. Use indexed keys (not a
        # JSON string) so the clusterGroup override builds an actual YAML list.
        #
        # This is the Keycloak access token's `sub`, NOT acme-agent's SPIFFE ID.
        # MAS checks credentials.user_id (claims["user_id"] or claims["sub"])
        # against this list. For a client_credentials grant, `sub` is the
        # acme-agent client's Keycloak service-account user id (an opaque UUID) --
        # the SPIFFE ID only exists in the client_assertion used to authenticate
        # TO Keycloak, never in the resulting access token. Obtain it via the
        # Keycloak Admin API: GET /admin/realms/rca/clients?clientId=acme-agent
        # then GET .../clients/<uuid>/service-account-user -> .id. NOTE: this id
        # is realm-import-specific and changes if the service account is
        # recreated; re-fetch after a realm re-import.
        - name: a2a.allowedPrincipals[0]
          value: "5d5bb0ee-7433-403d-8c6f-3788dc119ad7"
        - name: route.enabled
          value: "true"
        # - name: route.host
        #   value: "mas-a2a.apps.ocp.phkl2.sandbox315.opentlc.com"

        # Multi-issuer OIDC: accept tokens from Red Hat SSO and Keycloak
        # Keycloak is NOT auto-appended; include it explicitly
        - name: identity.oidcIssuers[0].issuer_url
          value: https://sso.redhat.com/auth/realms/redhat-external
        - name: identity.oidcIssuers[0].jwks_url
          value: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/certs
        - name: identity.oidcIssuers[0].audience
          value: api.ask_red_hat
        - name: identity.oidcIssuers[0].username_claim
          value: preferred_username
        - name: identity.oidcIssuers[1].issuer_url
          value: https://sso.stage.redhat.com/auth/realms/redhat-external
        - name: identity.oidcIssuers[1].jwks_url
          value: https://sso.stage.redhat.com/auth/realms/redhat-external/protocol/openid-connect/certs
        - name: identity.oidcIssuers[1].audience
          value: api.ask_red_hat
        - name: identity.oidcIssuers[1].username_claim
          value: preferred_username
        - name: identity.oidcIssuers[2].issuer_url
          value: https://keycloak.apps.ocp.phkl2.sandbox315.opentlc.com/realms/rca
        - name: identity.oidcIssuers[2].jwks_url
          value: https://keycloak.apps.ocp.phkl2.sandbox315.opentlc.com/realms/rca/protocol/openid-connect/certs
        - name: identity.oidcIssuers[2].audience
          value: mas-a2a
        - name: identity.oidcIssuers[2].username_claim
          value: preferred_username
        - name: identity.oidcVerifySsl
          value: "true"
        - name: identity.oidcTimeout
          value: "30"
        - name: identity.keycloakCaTrust.enabled
          value: "true"
      # PHASE 1: Dormant by default (a2a.enabled=false)
      # See README.md "Phase 2: Enable MAS A2A Routing" for activation steps
  argoCD:
    resourceTrackingMethod: annotation
    resourceExclusions: null
