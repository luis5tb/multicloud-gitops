clusterGroup:
  name: standalone
  namespaces:
    vault:
    external-secrets-operator:
      operatorGroup: true
      targetNamespaces: []
    external-secrets:
    redhat-ods-operator:
      operatorGroup: true
      targetNamespaces: []
    zero-trust-workload-identity-manager:
      operatorGroup: true
    keycloak-system:
      operatorGroup: true
    lightspeed-agentic-operator:
    openshift-mcp-server:
    mao:
    ericsson-agent:
  subscriptions:
    eso:
      name: openshift-external-secrets-operator
      namespace: external-secrets-operator
      channel: stable-v1
    servicemesh:
      name: servicemeshoperator
      namespace: openshift-operators
      channel: stable
    authorino:
      name: authorino-operator
      namespace: openshift-operators
      channel: tech-preview-v1
      source: redhat-operators
      sourceNamespace: openshift-marketplace
    rhoai:
      name: rhods-operator
      namespace: redhat-ods-operator
    ztwim:
      name: openshift-zero-trust-workload-identity-manager
      namespace: zero-trust-workload-identity-manager
      channel: stable-v1
    rhbk:
      name: rhbk-operator
      namespace: keycloak-system
      channel: stable-v26.4
  argoProjects:
    - hub
    - openshift-ai

  sharedValueFiles:
    - '/overrides/values-{{ $.Values.global.clusterPlatform }}.yaml'

  applications:
    vault:
      name: vault
      namespace: vault
      argoProject: hub
      chart: hashicorp-vault
      chartVersion: 0.1.*
    openshift-external-secrets:
      name: openshift-external-secrets
      namespace: external-secrets
      argoProject: hub
      chart: openshift-external-secrets
      chartVersion: 0.0.*
    rhoai-config:
      name: rhoai-config
      namespace: redhat-ods-operator
      project: openshift-ai
      path: charts/all/rhoai-config
    zero-trust-workload-identity-manager:
      name: zero-trust-workload-identity-manager
      namespace: zero-trust-workload-identity-manager
      argoProject: hub
      chart: ztwim
      chartVersion: 0.1.*
      # No trustDomain override needed: the chart defaults spire.trustDomain
      # to global.localClusterDomain (this cluster's apps domain), which is
      # exactly the value rca-agent's and ericsson-agent's
      # identity.clusterSpiffeID.trustDomain overrides below must match.
      # Look it up after install with:
      #   oc get zerotrustworkloadidentitymanager cluster -o jsonpath='{.spec.trustDomain}'
    keycloak:
      name: keycloak
      namespace: keycloak-system
      argoProject: hub
      chart: rhbk
      chartVersion: 0.1.*
      overrides:
        # Vault paths for the admin/DB passwords defined in values-secret.yaml.template
        - name: keycloak.adminUser.passwordVaultKey
          value: secret/data/global/rhbk
        - name: keycloak.postgresqlDb.passwordVaultKey
          value: secret/data/global/rhbk
    keycloak-oidc:
      name: keycloak-oidc
      namespace: keycloak-system
      argoProject: hub
      path: charts/all/keycloak-oidc
      overrides:
        - name: keycloak.namespace
          value: keycloak-system
        - name: keycloak.name
          value: keycloak
        - name: keycloak.realm
          value: rca
        - name: agenticRun.namespace
          value: lightspeed-agentic-operator
        # Native OIDC is cluster-wide and switches Authentication/cluster's
        # spec.type for the ENTIRE cluster at once (console, oc login,
        # everything) -- so it is opt-in, and must stay "false" here until
        # the pre-flight checklist in charts/all/keycloak-oidc/README.md has
        # been walked start to finish. Enabling it before the realm import
        # has actually succeeded and the console client's Secret exists
        # locks out console AND CLI login cluster-wide with
        # ExternalOIDCControllerDegraded (this has happened -- recovery
        # command is in that README too).
        - name: openshiftOIDC.enabled
          value: "true"
        - name: openshiftOIDC.issuerURL
          value: https://keycloak.apps.ocp.rvnmn.sandbox2284.opentlc.com/realms/rca
        # The web console's public route (`oc whoami --show-console`), used
        # as the redirect URI Keycloak accepts for the console's OIDC
        # client. Required once openshiftOIDC.enabled is "true".
        - name: openshiftOIDC.consoleRoute
          value: https://console-openshift-console.apps.ocp.rvnmn.sandbox2284.opentlc.com
        # Cluster-admin ServiceAccount + non-expiring token Secret in
        # openshift-config, independent of openshiftOIDC.enabled. Safe to
        # enable any time; run `make admin-break-glass-kubeconfig` after
        # this syncs. See charts/all/keycloak-oidc/README.md.
        - name: breakGlass.enabled
          value: "true"
        # Keycloak group bound to cluster-admin once openshiftOIDC.enabled
        # is true. Named plainly, not "rca-admins" -- cluster-admin access
        # granted through Keycloak has nothing to do with the RCA agent
        # specifically. NOTE: the realm import on this cluster already
        # succeeded before this override existed, so it won't retroactively
        # create this group -- create it once manually in the Admin Console
        # (Groups -> New group -> "cluster-admins"), then add your user to
        # it, before enabling openshiftOIDC.
        - name: keycloak.adminGroupName
          value: cluster-admins
        # Federate the ericsson-agent/rca-agent-mcp confidential clients'
        # authentication against SPIRE's OIDC discovery provider, so
        # SPIFFE-identified workloads authenticate to Keycloak without a
        # static secret. See:
        # https://www.keycloak.org/2026/01/federated-client-authentication
        - name: keycloak.spiffeIdentityProvider.trustDomain
          value: apps.ocp.rvnmn.sandbox2284.opentlc.com
        - name: keycloak.spiffeIdentityProvider.bundleEndpoint
          value: https://spire-spiffe-oidc-discovery-provider.zero-trust-workload-identity-manager.svc.cluster.local/keys
        # Namespace/ServiceAccount pairs ZTWIM/SPIRE issues each agent's
        # JWT-SVID for. Must match charts/all/ericsson-agent's and
        # charts/all/rca-agent's own Deployments below exactly.
        - name: keycloak.ericssonWorkload.namespace
          value: ericsson-agent
        - name: keycloak.ericssonWorkload.serviceAccount
          value: ericsson-agent
        - name: keycloak.mcpWorkload.namespace
          value: lightspeed-agentic-operator
        - name: keycloak.mcpWorkload.serviceAccount
          value: rca-agent
    lightspeed-agentic-operator:
      name: lightspeed-agentic-operator
      namespace: lightspeed-agentic-operator
      argoProject: hub
      path: charts/all/lightspeed-agentic-operator
      overrides:
        - name: llmProvider.enabled
          value: "true"
        - name: llmProvider.type
          value: vertexAnthropic
        - name: llmProvider.vertexAnthropic.projectID
          value: my-project-id
        - name: llmProvider.vertexAnthropic.region
          value: global
    openshift-mcp-server:
      name: openshift-mcp-server
      namespace: openshift-mcp-server
      argoProject: hub
      path: charts/all/openshift-mcp-server
    rca-agent:
      name: rca-agent
      # Same namespace as lightspeed-agentic-operator: the operator only
      # watches AgenticRuns/Agents in its own namespace (see
      # --namespace={{ .Values.namespace }} in that chart's Deployment), so
      # this is also where AgenticRuns created by this agent must live.
      namespace: lightspeed-agentic-operator
      argoProject: hub
      path: charts/all/rca-agent
      overrides:
        - name: image.repository
          value: quay.io/ltomasbo/rca-agent
        - name: image.tag
          value: 008c11d0
        - name: identity.keycloak.issuerUrl
          value: https://keycloak.apps.ocp.rvnmn.sandbox2284.opentlc.com/realms/rca
        - name: identity.keycloak.tokenExchange.clientId
          value: rca-agent-mcp
        - name: identity.keycloak.tokenExchange.audience
          value: openshift-mcp
        - name: identity.clusterSpiffeID.enabled
          value: "true"
        # Must match the cluster's trust domain (see the
        # zero-trust-workload-identity-manager application's comment above).
        - name: identity.clusterSpiffeID.trustDomain
          value: apps.ocp.rvnmn.sandbox2284.opentlc.com
        - name: litellm.apiBase
          value: https://maas-rhdp.apps.maas.redhatworkshops.io/v1
        - name: litellm.model
          value: openai/gpt-oss-120b
        # google-adk's RemoteA2aAgent (used by ericsson-agent to call this
        # agent) refuses to fetch or trust an agent card advertising a
        # non-loopback plain-http RPC url -- the in-cluster Service DNS name
        # no longer qualifies once a real caller (ericsson-agent, a different
        # pod) resolves it. Route this agent behind an edge-TLS Route instead
        # and advertise that origin in the agent card.
        - name: route.enabled
          value: "true"
        - name: route.host
          value: rca-agent.apps.ocp.rvnmn.sandbox2284.opentlc.com
        - name: a2a.publicHost
          value: rca-agent.apps.ocp.rvnmn.sandbox2284.opentlc.com
        - name: a2a.publicPort
          value: "443"
        - name: a2a.publicProtocol
          value: https
    opa:
      name: rca-agent-opa
      # Same namespace as rca-agent: identity.opa.url in that chart's
      # overrides above (charts/all/rca-agent/values.yaml default) resolves
      # this Service by short in-cluster DNS name, which only works
      # same-namespace.
      namespace: lightspeed-agentic-operator
      argoProject: hub
      path: charts/all/opa
    ericsson-agent:
      name: ericsson-agent
      namespace: ericsson-agent
      argoProject: hub
      path: charts/all/ericsson-agent
      overrides:
        - name: image.repository
          value: quay.io/ltomasbo/ericsson-agent
        - name: image.tag
          value: 1cba81f7
        # rca-agent's edge-TLS Route, not its in-cluster Service DNS name --
        # google-adk's RemoteA2aAgent requires https (or loopback) for any
        # agent card it fetches and for every RPC url advertised inside it.
        # Must match rca-agent's route.host / a2a.publicHost overrides.
        - name: a2a.downstreamEndpoint
          value: https://rca-agent.apps.ocp.rvnmn.sandbox2284.opentlc.com
        - name: a2a.downstreamAgentName
          value: rca_agent
        - name: a2a.downstreamAgentDescription
          value: Investigates OpenShift incidents and returns root-cause analysis with remediation proposals.
        - name: auth.mode
          value: keycloak
        - name: auth.keycloak.issuerUrl
          value: https://keycloak.apps.ocp.rvnmn.sandbox2284.opentlc.com/realms/rca
        - name: auth.keycloak.tokenUrl
          value: https://keycloak.apps.ocp.rvnmn.sandbox2284.opentlc.com/realms/rca/protocol/openid-connect/token
        - name: auth.keycloak.clientId
          value: ericsson-agent
        - name: identity.spiffe.enabled
          value: "true"
        - name: identity.clusterSpiffeID.enabled
          value: "true"
        # Must match the cluster's trust domain (see the
        # zero-trust-workload-identity-manager application's comment above).
        - name: identity.clusterSpiffeID.trustDomain
          value: apps.ocp.rvnmn.sandbox2284.opentlc.com
        - name: route.enabled
          value: "true"
        - name: litellm.apiBase
          value: https://maas-rhdp.apps.maas.redhatworkshops.io/v1
        - name: litellm.model
          value: openai/gpt-oss-120b
    mao-mongo:
      name: mao-mongo
      namespace: mao
      argoProject: hub
      path: charts/all/mao/mongo
    mao-redis:
      name: mao-redis
      namespace: mao
      argoProject: hub
      path: charts/all/mao/redis
      overrides:
        # Keep this in sync with the connection secret consumed by the API and worker.
        - name: connectionSecret.name
          value: mao-secret-redis
    mao-temporal:
      name: mao-temporal
      namespace: mao
      argoProject: hub
      path: charts/all/mao/temporal
    mao-worker:
      name: mao-worker
      namespace: mao
      argoProject: hub
      path: charts/all/mao/mas-worker
    mao-api:
      name: mao-api
      namespace: mao
      argoProject: hub
      path: charts/all/mao/mas-api
      overrides:
        # DevTokenValidator supplies the synthetic username "dev". Keep this
        # development-only allow-list in sync with the dev authentication mode.
        - name: identity.adminAllowedUsers
          value: '["dev"]'
  argoCD:
    resourceTrackingMethod: annotation
    resourceExclusions: null
