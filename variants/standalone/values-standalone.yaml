        - name: identity.adminAllowedUsers
          value: '["dev"]'
        # Same Fernet keys as mao-worker and mao-a2a (Vault mao-run-credentials):
        # the API seals caller credentials for background runs.
        - name: runCredentials.secretName
          value: mas-api-run-credentials
        - name: runCredentials.vault.enabled
          value: "true"
        # This OIDC setting is not used in dev mode but kept for reference:
        # - name: identity.keycloakAudience
        #   value: mas-api
    mao-a2a:
      name: mao-a2a
      namespace: mao
      argoProject: hub
      path: charts/all/mao/mas-a2a
      overrides:
        - name: image.repository
          value: quay.io/ltomasbo/mas-api
        - name: image.tag
          value: "a6674f23f9d0"
        - name: image.pullPolicy
          value: Always
        # PHASE 2: Enable after creating blueprint and obtaining ACME's principal
        - name: a2a.enabled
          value: "true"
        # Blueprint re-saved 2026-10-22 (df782fdc-...): hardened the
        # orchestrator prompt's X-OLS-Cluster spelling rule (the planning LLM
        # had emitted X_OLS_Cluster -- underscores -- in 3 of 5 delegations,
        # which Praxis fail-closes into HTTP 404), dropped the planning LLM
        # to temperature 0, and set max_tokens 64000 (MAS defaults to 8192
        # when unset). Superseded blueprints (7f2c9570-..., af00895e-...)
        # were deleted from MAS inventory. See setup-mas-blueprint.sh's
        # LIVE FINDING.
        # NOTE: this pinned LIVE blueprint still contains its OLS
        # investigation nodes -- the OLS source removal (Task A,
        # PLAN-lightspeed-hub-migration.md) changes only what the blueprint
        # SCRIPT emits; replacing the live blueprint is the separate runtime
        # cutover (G3) in that plan.
        - name: a2a.blueprintId
          value: "93ed0707-c309-4f6b-978d-1165b4e5f025"
        # Must match the route host OpenShift generates for this Service.
        # With route.host unset, the host derives from the generated route
        # name (<release>-<chart>-<ns>): mao-a2a-mas-a2a-mao.apps...
        # (LIVE FIX: the A2A client rejects a card whose RPC URL origin
        # differs from the origin the card was FETCHED from -- ACME fetches
        # via the mao-a2a route above, so publicBaseUrl must be the SAME
        # origin, not a differently-named route.)
        - name: a2a.publicBaseUrl
          value: "https://mao-a2a-mas-a2a-mao.apps.cluster-jq8zh.dyn.redhatworkshops.io"
        # Must be a real list: the chart applies toJson so the app can JSON-decode
        # the A2A_ALLOWED_PRINCIPALS env var into a list. Use indexed keys (not a
        # JSON string) so the clusterGroup override builds an actual YAML list.
        #
        # These are validated access-token `sub` values, NOT SPIFFE IDs,
        # client IDs, or `azp` values. MAS checks credentials.user_id
        # (claims["user_id"] or claims["sub"]) against this list.
        #
        # For local Keycloak, `sub` is acme-agent's service-account user id (an
        # opaque UUID). Obtain it via GET /admin/realms/rca/clients?clientId=
        # acme-agent, then .../clients/<uuid>/service-account-user -> .id. This
        # id is realm-import-specific and changes if the service account is
        # recreated; re-fetch after a realm re-import.
        #
        # For Red Hat SSO client credentials, `sub` is the service-account
        # principal and can differ from `azp`/`client_id`. Decode a real token
        # and use its `sub`; do not copy the OAuth client UUID from the secret.
        - name: a2a.allowedPrincipals[0]
          #value: "14a43a22-01f8-4fe3-81fd-f34cce3d745f"
          #value: "409d044c-4119-430b-9ec8-9388d127210b"
          #value: "94510bf9-b826-402b-a242-d4547e948d76"
          value: "bb366787-080c-4d98-b69e-2774e15855cb"
        - name: a2a.allowedPrincipals[1]
          value: "b6daf56c-157a-418a-b6bf-7a6c18c667a7"
        - name: route.enabled
          value: "true"
        # - name: route.host
        #   value: "mas-a2a.apps.cluster-jq8zh.dyn.redhatworkshops.io"
        # Long-running delegations (lightspeed-hub investigations): the
        # chart default 300s stream cap made MAS end ACME's stream with "The
        # stream time limit was reached. Query the task for its current
        # state." while the AgenticRun was still analyzing (seen live
        # 2026-11-20) -- ACME's ADK client does not poll the task. Sized to
        # the hub Agent's analysis timeout (1200s); ACME's a2a.requestTimeout
        # is 1260s. Chart guards: route > stream, shutdown > stream,
        # terminationGracePeriodSeconds > shutdown. (Trade-off: a rollout can
        # wait up to ~21 min for open streams to drain.)
        - name: a2a.streamMaxDurationSeconds
          value: "1200"
        - name: a2a.shutdownTimeoutSeconds
          value: "1230"
        - name: terminationGracePeriodSeconds
          value: "1260"
        - name: route.timeoutSeconds
          value: "1260"

        # Multi-issuer OIDC: accept tokens from Red Hat SSO and Keycloak
        # Keycloak is NOT auto-appended; include it explicitly
        - name: identity.oidcIssuers[0].issuer_url
          value: https://sso.redhat.com/auth/realms/redhat-external
        - name: identity.oidcIssuers[0].jwks_url
          value: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/certs
        - name: identity.oidcIssuers[0].audience
          value: api.ask_red_hat
        - name: identity.oidcIssuers[0].username_claim
          value: preferred_username
        - name: identity.oidcIssuers[1].issuer_url
          value: https://sso.stage.redhat.com/auth/realms/redhat-external
        - name: identity.oidcIssuers[1].jwks_url
          value: https://sso.stage.redhat.com/auth/realms/redhat-external/protocol/openid-connect/certs
        - name: identity.oidcIssuers[1].audience
          value: api.ask_red_hat
        - name: identity.oidcIssuers[1].username_claim
          value: preferred_username
        - name: identity.oidcIssuers[2].issuer_url
          value: https://keycloak.apps.cluster-jq8zh.dyn.redhatworkshops.io/realms/rca
        - name: identity.oidcIssuers[2].jwks_url
          value: https://keycloak.apps.cluster-jq8zh.dyn.redhatworkshops.io/realms/rca/protocol/openid-connect/certs
        - name: identity.oidcIssuers[2].audience
          value: mas-a2a
        - name: identity.oidcIssuers[2].username_claim
          value: preferred_username
        - name: identity.oidcVerifySsl
          value: "true"
        - name: identity.oidcTimeout
          value: "30"
        - name: identity.keycloakCaTrust.enabled
          value: "true"
      # PHASE 1: Dormant by default (a2a.enabled=false)
      # See README.md "Phase 2: Enable MAS A2A Routing" for activation steps
    lightspeed-hub:
      name: lightspeed-hub
      namespace: lightspeed-hub
      argoProject: hub
      path: charts/all/lightspeed-hub
      overrides:
        # TASK B (ACTIVATED): the hub A2A adapter + repo C
        # (lightspeed-agentic-operator, a2a-support) stack. Images pinned
        # above; the adapter performs the A->H exchange behind the Praxis
        # front door, and the operator runs in gateway credential mode.
        # docs/LIGHTSPEED_HUB_ADAPTER_DESIGN.md is the design;
        # docs/lightspeed-hub-deployment-runbook.md is the runbook.
        - name: enabled
          value: "true"
        # ------------------------------------------------------------------
        # Hub audience of the A->H token exchange (must equal keycloak-oidc's
        # keycloak.hubExchange.hubAudience):
        - name: adapter.hubAudience
          value: lightspeed-hub-a2a
        # The adapter's exchange client (created by keycloak-oidc's
        # hubExchange; the client secret lands in this namespace as an
        # ExternalSecret):
        - name: adapter.keycloak.clientId
          value: lightspeed-hub-adapter
        - name: adapter.keycloak.clientSecretSecret.name
          value: lightspeed-hub-adapter-client
        # adapter.keycloak.issuerUrl/tokenUrl derive from
        # global.clusterBaseDomain + global.keycloakRealm; override only to
        # diverge.
        # Adapter image pin (own pipeline, immutable digest or exact QUOTED
        # tag -- never all-digits unquoted; see docs/ARCHITECTURE.md).
        # Built from the lightspeed-hub repo, branch a2a (make
        # image-a2a-adapter):
        - name: adapter.image.repository
          value: quay.io/ltomasbo/lightspeed-hub-a2a-adapter
        # poc3: serves the agent card at /a2a/.well-known/agent-card.json as
        # well, required by praxis-proxy's pass-through card route.
        - name: adapter.image.tag
          value: "poc3"
        # Repo C operator image pin (built from the
        # lightspeed-agentic-operator repo, branch a2a-support).
        # a2a-gw: gateway credential mode does no spoke management (no
        # spoke-kubeconfig-<id>, no per-step spoke SA / reader bindings) --
        # docs/GATEWAY_MODE_SCOPED_TOKEN_EXCHANGE.md s3.2.
        - name: agenticOperator.image.repository
          value: quay.io/ltomasbo/lightspeed-agentic-operator
        - name: agenticOperator.image.tag
          value: "a2a-gw"
        # Sandbox image the operator runs each step in (same image as the
        # earlier mao-poc-rca setup; Konflux floating tag -- upstream has no
        # versioned release yet). Without a sandbox-pod-spec every run failed
        # with `base PodSpec with at least one container is required`.
        - name: agenticOperator.sandbox.image
          value: quay.io/redhat-user-workloads/crt-nshift-lightspeed-tenant/lightspeed-agentic-sandbox:main
        # Agent configuration (LLMProvider + Agent named adapter.runAgent +
        # ApprovalPolicy "cluster" with Analysis Automatic). Without it every
        # run failed live with `Agent "default" not found` (2026-11-20).
        # Vertex with the SAME shared Vault ADC credential MAS uses
        # (secret/data/global/llm-creds-vertex) and the same project/location
        # as setup-mas-blueprint.sh (VERTEX_PROJECT / VERTEX_LOCATION).
        - name: agenticOperator.agent.enabled
          value: "true"
        - name: agenticOperator.agent.llmProvider.vertex.projectID
          value: redhat-marketplace-dev
        - name: agenticOperator.agent.llmProvider.vertex.region
          value: global
        # Same model as the MAS orchestrator (setup-mas-blueprint.sh
        # VERTEX_MODEL default): Gemini on Vertex. Keep the two in sync when
        # changing either.
        - name: agenticOperator.agent.llmProvider.vertex.modelProvider
          value: Google
        - name: agenticOperator.agent.model
          value: gemini-3.8-flash
        # Gateway credential mode keys (repo C's ConfigMap load fails
        # loudly without all three; the chart mirrors that at render
        # time). gatewayServerURLTemplate matches the per-spoke gateway
        # Service naming; gatewayCASecret names the Secret praxis-proxy's
        # spokeGatewayConfig.servingCA bridge maintains (targetNamespace
        # set to lightspeed-hub there):
        - name: agenticOperator.config.gatewayServerURLTemplate
          value: https://praxis-spoke-{targetCluster}.praxis-proxy.svc.cluster.local:8443
        - name: agenticOperator.config.gatewayCASecret
          value: praxis-spoke-gateway-ca
        # Fail-fast allow-list of target clusters (the adapter's
        # --allowed-targets; the unknown-target message is the model-facing
        # spelling guard). MUST stay identical to the spokeGateways keys
        # (here: the hub cluster as its own spoke):
        - name: adapter.allowedTargets[0]
          value: hub
        # Token H's AUDIENCE-SCOPED role group (keycloak-oidc exchangeRoles:
        # H carries only "lightspeed-hub-a2a:agenticrun-creator", mapped to
        # Group keycloak:lightspeed-hub-a2a:agenticrun-creator). Was
        # keycloak:acme-agent-rca, which U carried too -- so with the hub as
        # its own spoke, the sandbox's U could have created AgenticRuns. See
        # docs/GATEWAY_MODE_SCOPED_TOKEN_EXCHANGE.md s4.3/s5.2.
        # Requester x target admission-policy allow-list (deny-all while
        # empty; keys are Token H usernames or group names, values are the
        # allowed targetCluster names):
        - name: admissionPolicy.allowTargets.keycloak\:lightspeed-hub-a2a\:agenticrun-creator[0]
          value: hub
        # "Only the configured group can create AgenticRuns": the group bound
        # to a Role granting create on agenticruns in the run namespace. The
        # admission policy above additionally restricts WHICH targetCluster:
        - name: adapter.hubRunCreatorsGroup
          value: keycloak:lightspeed-hub-a2a:agenticrun-creator
        # The hub doubles as spoke "hub": read access for gateway-mode
        # investigations, granted to Token U's audience-scoped role group
        # (keycloak:praxis-spoke-hub:reader) -- never to the user. Without
        # it every investigation read was denied.
        - name: spokeReaderRBAC.enabled
          value: "true"
        - name: spokeReaderRBAC.groups[0]
          value: keycloak:praxis-spoke-hub:reader
        # Cross-chart contract (request leg): adapter.targetHeader must equal
        # praxis-proxy's a2aUpstream.targetHeader (X-Hub-Cluster default
        # both sides); adapter.hubAudience must equal keycloak-oidc's
        # keycloak.hubExchange.hubAudience -- see this chart's README
        # "Cross-chart contract".
  argoCD:
    resourceTrackingMethod: annotation
    resourceExclusions: null
