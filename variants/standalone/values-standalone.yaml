clusterGroup:
  name: standalone
  namespaces:
    vault:
    external-secrets-operator:
      operatorGroup: true
      targetNamespaces: []
    external-secrets:
    redhat-ods-operator:
      operatorGroup: true
      targetNamespaces: []
    zero-trust-workload-identity-manager:
      operatorGroup: true
    keycloak-system:
      operatorGroup: true
    lightspeed-agentic-operator:
    openshift-mcp-server:
    mao:
    ericsson-agent:
  subscriptions:
    eso:
      name: openshift-external-secrets-operator
      namespace: external-secrets-operator
      channel: stable-v1
    servicemesh:
      name: servicemeshoperator
      namespace: openshift-operators
      channel: stable
    authorino:
      name: authorino-operator
      namespace: openshift-operators
      channel: tech-preview-v1
      source: redhat-operators
      sourceNamespace: openshift-marketplace
    rhoai:
      name: rhods-operator
      namespace: redhat-ods-operator
    ztwim:
      name: openshift-zero-trust-workload-identity-manager
      namespace: zero-trust-workload-identity-manager
      channel: stable-v1
    rhbk:
      name: rhbk-operator
      namespace: keycloak-system
      channel: stable-v26.4
  argoProjects:
    - hub
    - openshift-ai

  sharedValueFiles:
    - '/overrides/values-{{ $.Values.global.clusterPlatform }}.yaml'

  applications:
    vault:
      name: vault
      namespace: vault
      argoProject: hub
      chart: hashicorp-vault
      chartVersion: 0.1.*
    openshift-external-secrets:
      name: openshift-external-secrets
      namespace: external-secrets
      argoProject: hub
      chart: openshift-external-secrets
      chartVersion: 0.0.*
    rhoai-config:
      name: rhoai-config
      namespace: redhat-ods-operator
      project: openshift-ai
      path: charts/all/rhoai-config
    zero-trust-workload-identity-manager:
      name: zero-trust-workload-identity-manager
      namespace: zero-trust-workload-identity-manager
      argoProject: hub
      chart: ztwim
      chartVersion: 0.1.*
      # No trustDomain override needed: the chart defaults spire.trustDomain
      # to global.localClusterDomain (this cluster's apps domain), which is
      # exactly the value rca-agent's and ericsson-agent's
      # identity.clusterSpiffeID.trustDomain overrides below must match.
      # Look it up after install with:
      #   oc get zerotrustworkloadidentitymanager cluster -o jsonpath='{.spec.trustDomain}'
    keycloak:
      name: keycloak
      namespace: keycloak-system
      argoProject: hub
      chart: rhbk
      chartVersion: 0.1.*
      overrides:
        # Vault paths for the admin/DB passwords defined in values-secret.yaml.template
        - name: keycloak.adminUser.passwordVaultKey
          value: secret/data/global/rhbk
        - name: keycloak.postgresqlDb.passwordVaultKey
          value: secret/data/global/rhbk
        # Federate Keycloak client auth against SPIRE's OIDC discovery provider so
        # SPIFFE-identified workloads (e.g. agents) can authenticate without a static secret.
        # See: https://www.keycloak.org/2026/01/federated-client-authentication
        - name: keycloak.spiffeIdentityProvider.enabled
          value: "true"
        - name: keycloak.spiffeIdentityProvider.config.config.issuer
          value: https://spire-spiffe-oidc-discovery-provider.zero-trust-workload-identity-manager.svc.cluster.local
        - name: keycloak.spiffeIdentityProvider.config.config.jwksUrl
          value: https://spire-spiffe-oidc-discovery-provider.zero-trust-workload-identity-manager.svc.cluster.local/keys
    keycloak-oidc:
      name: keycloak-oidc
      namespace: keycloak-system
      argoProject: hub
      path: charts/all/keycloak-oidc
      overrides:
        - name: keycloak.namespace
          value: keycloak-system
        - name: keycloak.name
          value: keycloak
        - name: keycloak.realm
          value: rca
        - name: agenticRun.namespace
          value: lightspeed-agentic-operator
        # Native OIDC is cluster-wide, so it is opt-in. Enable it once Keycloak
        # is up and you know its public route (`oc get route keycloak -n
        # keycloak-system`). issuerURL must exactly match the JWT `iss` claim,
        # and the same URL + /realms/rca must be used for
        # rca-agent's identity.keycloak.issuerUrl and ericsson-agent's
        # auth.keycloak.tokenUrl below.
        - name: openshiftOIDC.enabled
          value: "true"
        - name: openshiftOIDC.issuerURL
          value: https://keycloak.apps.ocp.rvnmn.sandbox2284.opentlc.com/realms/rca
    lightspeed-agentic-operator:
      name: lightspeed-agentic-operator
      namespace: lightspeed-agentic-operator
      argoProject: hub
      path: charts/all/lightspeed-agentic-operator
      overrides:
        - name: llmProvider.enabled
          value: "true"
        - name: llmProvider.type
          value: vertexAnthropic
        - name: llmProvider.vertexAnthropic.projectID
          value: my-project-id
        - name: llmProvider.vertexAnthropic.region
          value: global
    openshift-mcp-server:
      name: openshift-mcp-server
      namespace: openshift-mcp-server
      argoProject: hub
      path: charts/all/openshift-mcp-server
    rca-agent:
      name: rca-agent
      # Same namespace as lightspeed-agentic-operator: the operator only
      # watches AgenticRuns/Agents in its own namespace (see
      # --namespace={{ .Values.namespace }} in that chart's Deployment), so
      # this is also where AgenticRuns created by this agent must live.
      namespace: lightspeed-agentic-operator
      argoProject: hub
      path: charts/all/rca-agent
      overrides:
        - name: image.repository
          value: quay.io/ltomasbo/rca-agent
        - name: image.tag
          value: 520adc8b
        - name: identity.keycloak.issuerUrl
          value: https://keycloak.apps.ocp.rvnmn.sandbox2284.opentlc.com/realms/rca
        - name: identity.keycloak.tokenExchange.clientId
          value: rca-agent-mcp
        - name: identity.keycloak.tokenExchange.audience
          value: openshift-mcp
        - name: identity.clusterSpiffeID.enabled
          value: "true"
        # Must match the cluster's trust domain (see the
        # zero-trust-workload-identity-manager application's comment above).
        - name: identity.clusterSpiffeID.trustDomain
          value: apps.ocp.rvnmn.sandbox2284.opentlc.com
    ericsson-agent:
      name: ericsson-agent
      namespace: ericsson-agent
      argoProject: hub
      path: charts/all/ericsson-agent
      overrides:
        - name: image.repository
          value: quay.io/ltomasbo/ericsson-agent
        - name: image.tag
          value: 520adc8b
        # In-cluster DNS name for the rca-agent Service (fullnameOverride:
        # rca-agent, deployed in the lightspeed-agentic-operator namespace).
        - name: a2a.downstreamEndpoint
          value: http://rca-agent.lightspeed-agentic-operator.svc.cluster.local:8000
        - name: a2a.downstreamAgentName
          value: rca_agent
        - name: a2a.downstreamAgentDescription
          value: Investigates OpenShift incidents and returns root-cause analysis with remediation proposals.
        - name: auth.mode
          value: keycloak
        - name: auth.keycloak.tokenUrl
          value: https://keycloak.apps.ocp.rvnmn.sandbox2284.opentlc.com/realms/rca/protocol/openid-connect/token
        # This Keycloak client (jwt-spiffe federated client auth) must exist
        # in the "rca" realm before enabling this. See the deployment
        # instructions for the manual Keycloak admin step this needs.
        - name: auth.keycloak.clientId
          value: ericsson-agent
        - name: identity.spiffe.enabled
          value: "true"
        - name: identity.clusterSpiffeID.enabled
          value: "true"
        # Must match the cluster's trust domain (see the
        # zero-trust-workload-identity-manager application's comment above).
        - name: identity.clusterSpiffeID.trustDomain
          value: apps.ocp.rvnmn.sandbox2284.opentlc.com
        - name: route.enabled
          value: "true"
    mao-mongo:
      name: mao-mongo
      namespace: mao
      argoProject: hub
      path: charts/all/mao/mongo
    mao-redis:
      name: mao-redis
      namespace: mao
      argoProject: hub
      path: charts/all/mao/redis
      overrides:
        # Keep this in sync with the connection secret consumed by the API and worker.
        - name: connectionSecret.name
          value: mao-secret-redis
    mao-temporal:
      name: mao-temporal
      namespace: mao
      argoProject: hub
      path: charts/all/mao/temporal
    mao-worker:
      name: mao-worker
      namespace: mao
      argoProject: hub
      path: charts/all/mao/mas-worker
    mao-api:
      name: mao-api
      namespace: mao
      argoProject: hub
      path: charts/all/mao/mas-api
      overrides:
        # DevTokenValidator supplies the synthetic username "dev". Keep this
        # development-only allow-list in sync with the dev authentication mode.
        - name: identity.adminAllowedUsers
          value: '["dev"]'
  argoCD:
    resourceTrackingMethod: annotation
    resourceExclusions: null
