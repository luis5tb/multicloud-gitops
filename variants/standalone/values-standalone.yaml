# SINGLE CLUSTER-DOMAIN ANCHOR. Almost everything cluster-specific in this file
# derives from global.clusterBaseDomain -- the cluster's base domain WITHOUT the
# apps. prefix (what `oc whoami --show-server` shows after `api.` and before
# `:6443`). From it each chart's templates derive the Keycloak issuer, console
# route, SPIFFE trust domain and public A2A hosts, so you
# no longer hand-repeat the domain across ~11 overrides (see AGENTS.md and each
# chart's _helpers.tpl). The clustergroup framework also injects
# global.localClusterDomain (this cluster's apps wildcard domain); clusterBaseDomain
# falls back to that with `apps.` stripped, so on many clusters you can leave
# clusterBaseDomain empty and edit nothing here at all. Any derived value is still
# explicitly overridable in the per-app overrides below.
global:
  clusterBaseDomain: cluster-jq8zh.dyn.redhatworkshops.io
  # Keycloak realm the issuer URLs derive from; must equal the keycloak-oidc
  # Application's keycloak.realm override below (default rca).
  keycloakRealm: rca
  options:
    autoApproveManualInstallPlans: true

clusterGroup:
  name: standalone
  namespaces:
    vault:
    external-secrets-operator:
      operatorGroup: true
      targetNamespaces: []
    external-secrets:
    zero-trust-workload-identity-manager:
      operatorGroup: true
    keycloak-system:
      operatorGroup: true
    mao:
    acme-agent:
    praxis-proxy:
    lightspeed-hub:
  subscriptions:
    eso:
      name: openshift-external-secrets-operator
      namespace: external-secrets-operator
      channel: stable-v1
    ztwim:
      name: openshift-zero-trust-workload-identity-manager
      namespace: zero-trust-workload-identity-manager
      channel: stable-v1
    rhbk:
      name: rhbk-operator
      namespace: keycloak-system
      channel: stable-v26.4
  argoProjects:
    - hub

  sharedValueFiles:
    - '/overrides/values-{{ $.Values.global.clusterPlatform }}.yaml'

  applications:
    vault:
      name: vault
      namespace: vault
      argoProject: hub
      chart: hashicorp-vault
      chartVersion: 0.1.*
    openshift-external-secrets:
      name: openshift-external-secrets
      namespace: external-secrets
      argoProject: hub
      chart: openshift-external-secrets
      chartVersion: 0.0.*
    zero-trust-workload-identity-manager:
      name: zero-trust-workload-identity-manager
      namespace: zero-trust-workload-identity-manager
      argoProject: hub
      chart: ztwim
      chartVersion: 0.1.*
      # No trustDomain override needed: the chart defaults spire.trustDomain
      # to global.localClusterDomain (this cluster's apps domain), which is
      # exactly the value acme-agent's
      # identity.clusterSpiffeID.trustDomain override below must match.
      # Look it up after install with:
      #   oc get zerotrustworkloadidentitymanager cluster -o jsonpath='{.spec.trustDomain}'
    keycloak:
      name: keycloak
      namespace: keycloak-system
      argoProject: hub
      # Vendored copy of the validatedpatterns rhbk chart (was chart: rhbk,
      # chartVersion: 0.1.*). Vendored to add keycloak.extraFeatures, which the
      # upstream chart hardcodes-out: it needs features beyond spiffe/
      # client-auth-federated on the Keycloak CR. Re-sync with upstream on bumps.
      path: charts/all/rhbk
      overrides:
        # Vault paths for the admin/DB passwords defined in values-secret.yaml.template
        - name: keycloak.adminUser.passwordVaultKey
          value: secret/data/global/rhbk
        - name: keycloak.postgresqlDb.passwordVaultKey
          value: secret/data/global/rhbk
        - name: keycloak.spiffeIdentityProvider.enabled
          value: "true"
        # Enable V2 external->internal token exchange so external Red Hat
        # SSO (prod/stage) caller tokens can be brokered via the
        # red-hat-sso-* IdPs using subject_issuer. Versioned/preview
        # feature; operator rebuilds the server image and rolls keycloak-0.
        # See agents/AUTHENTICATION.md.
        - name: keycloak.extraFeatures[0]
          value: token-exchange-external-internal:v2
    keycloak-oidc:
      name: keycloak-oidc
      namespace: keycloak-system
      argoProject: hub
      path: charts/all/keycloak-oidc
      overrides:
        - name: keycloak.namespace
          value: keycloak-system
        - name: keycloak.name
          value: keycloak
        - name: keycloak.realm
          value: rca
        # Dedicated audience for Keycloak-authenticated MAS API administrators;
        # distinct from the inbound MAS A2A audience (mas-a2a).
        - name: keycloak.masApiAudience
          value: mas-api
        # Bootstrap the managed ingress CA into openshift-config (for the
        # Authentication OIDC provider), keycloak-system (for the realm
        # reconciler), and mao (for outbound MAS HTTPS to private cluster
        # Routes), then refresh those copies periodically for CA rotation.
        # Each MAS caller still enables its own combined trust bundle below.
        - name: openshiftOIDC.caConfigMapName
          value: keycloak-oidc-ca
        - name: openshiftOIDC.caBundleSync.enabled
          value: "true"
        - name: openshiftOIDC.caBundleSync.additionalTargetNamespaces[0]
          value: mao
        - name: realmSecretsReconciler.caBundleConfigMapName
          value: keycloak-oidc-ca
        # Native OIDC is cluster-wide and switches Authentication/cluster's
        # spec.type for the ENTIRE cluster at once (console, oc login,
        # everything) -- so it is opt-in, and must stay "false" here until
        # the pre-flight checklist in charts/all/keycloak-oidc/README.md has
        # been walked start to finish. Enabling it before the realm import
        # has actually succeeded and the console client's Secret exists
        # locks out console AND CLI login cluster-wide with
        # ExternalOIDCControllerDegraded (this has happened -- recovery
        # command is in that README too).
        - name: openshiftOIDC.enabled
          value: "true"
        # Hub-as-spoke: the hub cluster is its own investigation target, so
        # its (already chart-managed) Authentication must ALSO trust the
        # per-spoke U audience -- do NOT apply the runbook's spoke-adapted
        # Authentication on the hub itself. lightspeed-hub-a2a is the A->H
        # Token H audience; praxis-spoke-hub is the A->U Token U audience
        # (must equal spokeGateways.hub.exchangeAudience below):
        - name: openshiftOIDC.extraAudiences[0]
          value: lightspeed-hub-a2a
        - name: openshiftOIDC.extraAudiences[1]
          value: praxis-spoke-hub
        # Map H/U's Keycloak groups claim to Kubernetes groups
        # (keycloak:<group> with the default prefix) for the run-creators
        # RoleBinding and spoke RBAC:
        - name: openshiftOIDC.groupsClaim
          value: groups
        # openshiftOIDC.issuerURL and openshiftOIDC.consoleRoute are no longer
        # set here: both derive from global.clusterBaseDomain at the top of this
        # file (https://keycloak.apps.<base>/realms/<realm> and
        # https://console-openshift-console.apps.<base>). Add an explicit
        # override here only to diverge from that derivation.
        # Cluster-admin ServiceAccount + non-expiring token Secret in
        # openshift-config, independent of openshiftOIDC.enabled. Safe to
        # enable any time; run `make admin-break-glass-kubeconfig` after
        # this syncs. See charts/all/keycloak-oidc/README.md.
        - name: breakGlass.enabled
          value: "true"
        # Keycloak group bound to cluster-admin once openshiftOIDC.enabled
        # is true. Named plainly, not "rca-admins" -- cluster-admin access
        # granted through Keycloak has nothing to do with the RCA agent
        # specifically. NOTE: the realm import on this cluster already
        # succeeded before this override existed, so it won't retroactively
        # create this group -- create it once manually in the Admin Console
        # (Groups -> New group -> "cluster-admins"), then add your user to
        # it, before enabling openshiftOIDC.
        - name: keycloak.adminGroupName
          value: cluster-admins
        # Generates openshift-console's client secret from Vault instead of
        # the manual Admin Console copy step in the README -- see
        # keycloak.consoleClientSecretVaultKey in
        # charts/all/keycloak-oidc/values.yaml. Unlike adminGroupName above,
        # this does NOT depend on the one-shot realm import: the
        # realm-secrets-reconciler PostSync hook re-asserts the console
        # client's secret (and, once openshiftOIDC.enabled, its redirectUris)
        # against the running realm on every sync, so it applies even though
        # this realm imported before the override existed.
        - name: keycloak.consoleClientSecretVaultKey
          value: secret/data/global/rhbk
        # Creates a human user in this realm, in keycloak.adminGroupName
        # above (-> cluster-admin), with an initial password from Vault --
        # see keycloak.consoleAdminUser in charts/all/keycloak-oidc/values.yaml.
        # Same one-shot caveat as adminGroupName above. Change
        # keycloak.consoleAdminUser.username below if "cluster-admin" (the
        # chart default) isn't the name you want.
        - name: keycloak.consoleAdminUser.enabled
          value: "true"
        - name: keycloak.consoleAdminUser.passwordVaultKey
          value: secret/data/global/rhbk

        # Federate the acme-agent confidential client's
        # authentication against SPIRE's OIDC discovery provider, so
        # SPIFFE-identified workloads authenticate to Keycloak without a
        # static secret. See:
        # https://www.keycloak.org/2026/01/federated-client-authentication
        # trustDomain is not set here: it derives from global.clusterBaseDomain
        # (apps.<base>). bundleEndpoint is an in-cluster Service URL, not
        # domain-derived, so it stays explicit below.
        - name: keycloak.spiffeIdentityProvider.bundleEndpoint
          value: https://spire-spiffe-oidc-discovery-provider.zero-trust-workload-identity-manager.svc.cluster.local/keys
        # Namespace/ServiceAccount pair ZTWIM/SPIRE issues ACME's JWT-SVID
        # for. Must match charts/all/acme-agent's own Deployment exactly.
        - name: keycloak.acmeWorkload.namespace
          value: acme-agent
        - name: keycloak.acmeWorkload.serviceAccount
          value: acme-agent
        # External OIDC providers Keycloak trusts for RFC 8693 token exchange.
        # External Red Hat SSO (prod or stage) tokens can be exchanged via
        # Keycloak's token endpoint using that SSO
        # token as the subject_token. Keycloak validates it through authenticated
        # introspection and userinfo as well as signature verification. Reuse
        # ACME's Vault records so the IdP credentials stay consistent; the
        # PostSync hook configures existing realms as well as fresh imports.
        - name: keycloak.externalOidcProviders[0].alias
          value: red-hat-sso-prod
        - name: keycloak.externalOidcProviders[0].displayName
          value: "Red Hat SSO Production"
        - name: keycloak.externalOidcProviders[0].issuerUrl
          value: https://sso.redhat.com/auth/realms/redhat-external
        - name: keycloak.externalOidcProviders[0].authorizationUrl
          value: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/auth
        - name: keycloak.externalOidcProviders[0].tokenUrl
          value: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
        - name: keycloak.externalOidcProviders[0].jwksUrl
          value: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/certs
        - name: keycloak.externalOidcProviders[0].tokenIntrospectionUrl
          value: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token/introspect
        - name: keycloak.externalOidcProviders[0].userInfoUrl
          value: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/userinfo
        - name: keycloak.externalOidcProviders[0].credentials.vaultKey
          value: secret/data/global/acme-agent-redhat-sso-production
        - name: keycloak.externalOidcProviders[0].clientAuthMethod
          value: client_secret_post
        - name: keycloak.externalOidcProviders[0].defaultScope
          value: openid api.ask_red_hat
        - name: keycloak.externalOidcProviders[0].isAccessTokenJWT
          value: "true"
        - name: keycloak.externalOidcProviders[0].allowTokenExchange
          value: "true"
        # Every brokered Red Hat SSO caller gets the same read-only MCP RBAC
        # identity. The reconciler matches by issuer, so the existing realm's
        # older rh-sso-stage alias does not need to be renamed.
        - name: keycloak.externalOidcProviders[0].hardcodedGroups[0]
          value: acme-agent-rca
        - name: keycloak.externalOidcProviders[1].alias
          value: red-hat-sso-stage
        - name: keycloak.externalOidcProviders[1].displayName
          value: "Red Hat SSO Stage"
        - name: keycloak.externalOidcProviders[1].issuerUrl
          value: https://sso.stage.redhat.com/auth/realms/redhat-external
        - name: keycloak.externalOidcProviders[1].authorizationUrl
          value: https://sso.stage.redhat.com/auth/realms/redhat-external/protocol/openid-connect/auth
        - name: keycloak.externalOidcProviders[1].tokenUrl
          value: https://sso.stage.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
        - name: keycloak.externalOidcProviders[1].jwksUrl
          value: https://sso.stage.redhat.com/auth/realms/redhat-external/protocol/openid-connect/certs
        - name: keycloak.externalOidcProviders[1].tokenIntrospectionUrl
          value: https://sso.stage.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token/introspect
        - name: keycloak.externalOidcProviders[1].userInfoUrl
          value: https://sso.stage.redhat.com/auth/realms/redhat-external/protocol/openid-connect/userinfo
        - name: keycloak.externalOidcProviders[1].credentials.vaultKey
          value: secret/data/global/acme-agent-redhat-sso-stage
        - name: keycloak.externalOidcProviders[1].clientAuthMethod
          value: client_secret_post
        - name: keycloak.externalOidcProviders[1].defaultScope
          value: openid api.ask_red_hat
        - name: keycloak.externalOidcProviders[1].isAccessTokenJWT
          value: "true"
        - name: keycloak.externalOidcProviders[1].allowTokenExchange
          value: "true"
        - name: keycloak.externalOidcProviders[1].hardcodedGroups[0]
          value: acme-agent-rca
        # PHASE 2 B1 (PROPOSED, DISABLED): Keycloak prerequisites for the
        # per-spoke Praxis spoke-gateways' RFC 8693 A->U exchange. Keep
        # commented out until the pending spikes pass (Praxis kube-API
        # pass-through; oauth delegator on the pinned image) -- see
        # PLAN-lightspeed-hub-migration.md "B1 wiring"/"Keycloak exchange
        # prerequisites" and charts/all/praxis-proxy/README.md "Spoke
        # gateways (B1, proposed)". Requires the Vault entry below in
        # values-secret.yaml.template (praxis-spoke-gateway) to exist
        # first. One-shot realm import only: on this cluster, whose realm
        # already imported, the client and mappers must be created
        # manually in the Admin Console (see charts/all/keycloak-oidc
        # README).
        - name: keycloak.spokeGatewayExchanger.enabled
          value: "true"
        - name: keycloak.spokeGatewayExchanger.vaultKey
          value: secret/data/global/praxis-spoke-gateway
        # One entry per registered spoke, matching each spoke gateway's
        # exchangeAudience. The hub cluster doubles as its own spoke
        # ("hub"): its U-audience is praxis-spoke-hub:
        - name: keycloak.spokeGatewayExchanger.spokeAudiences[0]
          value: praxis-spoke-hub
        # TASK B / PHASE 1 H-SIDE WIRING (DISABLED): Keycloak prerequisites
        # for the hub A2A adapter's A->H exchange (charts/all/lightspeed-hub
        # adapter.keycloak.clientId; the ADAPTER performs the exchange --
        # see the a2aUpstream block under praxis-proxy above). Requires a
        # Vault entry (lightspeed-hub-adapter) in values-secret.yaml.template
        # first. One-shot realm import only: on this cluster, whose realm
        # already imported, the client and mappers must be created manually
        # in the Admin Console (see charts/all/keycloak-oidc README). The
        # hubAudience must equal the lightspeed-hub chart's
        # adapter.hubAudience and stay distinct from every other audience.
        - name: keycloak.hubExchange.enabled
          value: "true"
        - name: keycloak.hubExchange.vaultKey
          value: secret/data/global/lightspeed-hub-adapter
        - name: keycloak.hubExchange.hubAudience
          value: lightspeed-hub-a2a
        # The lightspeed-hub chart's adapter.keycloak.clientId /
        # clientSecretSecret.name defaults are EMPTY -- the variant's
        # commented values there must line up with this chart's
        # hubExchange defaults (clientId lightspeed-hub-adapter,
        # secretName lightspeed-hub-adapter-client); override only to
        # diverge. (Exchanger mappers DO apply to exchanged tokens --
        # confirmed live 2026-11-20.)
        # Audience-scoped exchange roles: H carries only
        # lightspeed-hub-a2a:agenticrun-creator, U only
        # praxis-spoke-hub:reader, so each token authorizes only its own hop
        # on the (shared) hub API. Members of acme-agent-rca get both roles.
        # The lightspeed-hub chart binds RBAC to those role groups. One-shot
        # realm import: the live realm was configured via the admin API
        # (README "Audience-scoped exchange roles").
        # INTERIM / BRIDGE: 15-minute Token A (realm default 300s). The
        # lightspeed-hub run-token Secret carries Token A for a whole
        # AgenticRun step with no mid-step renewal, so 300s killed every
        # investigation about 5 minutes in (live 2026-11-20). DELETE this
        # override once the adapter stores a run-scoped token instead of
        # Token A (docs/GATEWAY_MODE_SCOPED_TOKEN_EXCHANGE.md s8). Trade-off:
        # every Token A (also the one MAS sees) is replayable for 15 min.
        # Applied to the live realm via the admin API (one-shot import).
        - name: keycloak.acmeAccessTokenLifespanSeconds
          value: "900"
        - name: keycloak.exchangeRoles.enabled
          value: "true"
        - name: keycloak.exchangeRoles.groups[0]
          value: acme-agent-rca
    praxis-proxy:
      name: praxis-proxy
      namespace: praxis-proxy
      argoProject: hub
      path: charts/all/praxis-proxy
      ignoreDifferences:
        - group: apps
          kind: Deployment
          name: praxis-proxy
          namespace: praxis-proxy
          jsonPointers:
            - /spec/template/metadata/annotations/ca-bundle-sync-sha256
      overrides:
        # Public, policy-enforcing A2A gateway. It currently fronts no
        # backend (the OpenShift Lightspeed investigation backend was
        # removed -- see PLAN-lightspeed-hub-migration.md Task A); a future
        # backend will be registered behind it in Task B.
        - name: route.enabled
          value: "true"
        # route.host derives from global.clusterBaseDomain
        # (praxis-proxy.apps.<base>); override here only to diverge.
        # Long-running A2A requests may take a while to complete a
        # tool-using, multi-turn analysis.
        - name: route.timeout
          value: 22m
        # Demo / flow-monitor verbosity (RUST_LOG): info globally, debug only
        # on Praxis routing + JWT identity crates so scripts/monitor.sh can
        # surface allow/deny without flooding every crate. Chart default is
        # empty (sparse). For quieter prod, remove this override or set "".
        # Bare "debug" also works but is much noisier -- see
        # charts/all/praxis-proxy/values.yaml logLevel comment.
        - name: logLevel
          value: info,praxis_filter=debug,praxis_policy_plugin_identity_jwt=debug
        # identity.keycloak.issuerUrl derives from global.clusterBaseDomain +
        # global.keycloakRealm (https://keycloak.apps.<base>/realms/<realm>);
        # override here only to diverge.
        # Run Praxis WITH policy enforcement (caller JWT validation + azp
        # allow-list): only tokens whose azp is allow-listed below pass the
        # gateway. The two IPv4-only-cluster blockers that previously forced
        # router-only are handled here (see agents/AUTHENTICATION.md and
        # charts/all/praxis-proxy/README.md):
        #   1. the UI's Red Hat SSO token has azp != acme-agent, so its azp is
        #      added to policy.allowedCallers below; and
        #   2. Praxis's Rust client cannot fetch the external SSO JWKS over IPv6
        #      on this IPv4-egress cluster, so dnsIPv4Only (below) strips AAAA.
        - name: policy.enabled
          value: "true"
        # Callers allowed past the policy filter, matched on the token's azp.
        # acme-agent is the local Keycloak client; the UUID is ACME's confidential
        # Red Hat SSO client (the azp of the UI's SSO prod/stage tokens).
        - name: policy.allowedCallers[0]
          value: acme-agent
        - name: policy.allowedCallers[1]
          value: ff524661-b74a-4e10-bc24-4e71322e0852
        # The pinned Praxis AI 0.4.1 policy filter only has a filter-wide private
        # IdP egress switch. Configured callouts are the static Keycloak JWKS and
        # the Red Hat SSO JWKS (identity.oidcIssuers below); do not add
        # user-controlled URLs here.
        - name: policy.allowPrivateIdp
          value: "true"
        # Praxis's policy transport uses OpenSSL's trust file (SSL_CERT_FILE),
        # which REPLACES the default store. Sync the managed ingress CA (for the
        # Keycloak Route) AND append public roots (for the Red Hat SSO JWKS).
        - name: policy.caBundleConfigMap.name
          value: praxis-keycloak-ca
        - name: policy.caBundleSync.enabled
          value: "true"
        - name: policy.caBundleSync.includeSystemRoots
          value: "true"
        # IPv4-only JWKS fix: a CoreDNS sidecar strips AAAA so the IPv6-preferring,
        # no-fallback Praxis client reaches sso.redhat.com over IPv4. Validated
        # live; see charts/all/praxis-proxy/README.md "IPv4-only clusters".
        - name: dnsIPv4Only.enabled
          value: "true"
        # In-cluster OpenShift CoreDNS image (no extra pull). Update the digest if
        # the cluster version changes: oc get ds dns-default -n openshift-dns \
        #   -o jsonpath='{.spec.template.spec.containers[?(@.name=="dns")].image}'
        - name: dnsIPv4Only.image
          value: "quay.io/openshift-release-dev/ocp-v4.0-art-dev@sha256:2168f78e98dee245b93011b4af41970f4e2e64ae46ece6ce7742dc3c2a0cd1cd"
        # NOT the universal OpenShift SDN default (172.30.0.10): this cluster's
        # service network is 172.231.0.0/16, so dns-default is 172.231.0.10.
        # A hardcoded 172.30.0.10 here silently NXDOMAINs every in-cluster
        # lookup from the dnsIPv4Only sidecar (observed live: it broke the
        # Praxis->lightspeed-hub upstream with "Name does not resolve", not
        # just the sso.redhat.com egress path this was added for -- see
        # README). Re-derive per cluster: oc get svc dns-default
        #   -n openshift-dns -o jsonpath='{.spec.clusterIP}', or
        #   oc get network.config cluster -o jsonpath='{.spec.serviceNetwork}'
        #   and use .10 in that CIDR.
        - name: dnsIPv4Only.clusterDnsIP
          value: "172.231.0.10"
        - name: dnsIPv4Only.extraSearches[0]
          value: cluster-jq8zh.dyn.redhatworkshops.io
        # No agent-card overrides: Praxis has no card of its own; with
        # a2aUpstream enabled (below) it routes discovery to the
        # lightspeed-hub adapter's own card (see the chart README "Agent
        # card"). That needs the adapter build serving its card at
        # /a2a/.well-known/agent-card.json too (lightspeed-hub
        # adapter.image.tag) and a card url pointing at Praxis (derived by
        # the lightspeed-hub chart).
        # Trusted issuers the policy filter validates caller tokens against
        # (policy.enabled=true above): Red Hat SSO production and stage, plus the
        # local Keycloak issuer (which the chart appends automatically).
        # SSO audience is api.ask_red_hat -- verified from a real sso.stage
        # token whose aud array is
        # ["cloud-services","api.graphql","api.ask_red_hat","api.console"];
        # api.ask_red_hat is the narrowest value that fits the assistant use case.
        # Audience on local-Keycloak caller tokens: THIS gateway fronts the
        # lightspeed-hub adapter (MAS -> praxis-proxy -> adapter), so it
        # checks that Token A was meant for the adapter. acme-agent's token
        # carries lightspeed-hub-adapter via keycloak-oidc's
        # hubExchange.subjectTokenAudienceMapper (MAS forwards Token A
        # verbatim -- it cannot exchange per delegation yet). It used to be
        # mas-a2a, a leftover from when ACME called Praxis directly; mas-a2a
        # is validated by MAS itself (mao-a2a MULTI_ISSUER_OIDC_ISSUERS_JSON +
        # A2A_ALLOWED_PRINCIPALS), and there is no Praxis in front of MAS.
        # The Red Hat SSO issuers below stay (api.ask_red_hat): MAS may
        # forward an SSO caller token, which Keycloak trusts via
        # keycloak-oidc externalOidcProviders. Required even with
        # identity.oidcIssuers set: the chart appends the local Keycloak
        # issuer with this audience and fails loud if it is empty.
        - name: identity.keycloak.audience
          value: lightspeed-hub-adapter
        - name: identity.oidcIssuers[0].name
          value: red-hat-sso-prod
        - name: identity.oidcIssuers[0].issuerUrl
          value: https://sso.redhat.com/auth/realms/redhat-external
        - name: identity.oidcIssuers[0].jwksUrl
          value: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/certs
        - name: identity.oidcIssuers[0].audience
          value: api.ask_red_hat
        - name: identity.oidcIssuers[1].name
          value: red-hat-sso-stage
        - name: identity.oidcIssuers[1].issuerUrl
          value: https://sso.stage.redhat.com/auth/realms/redhat-external
        - name: identity.oidcIssuers[1].jwksUrl
          value: https://sso.stage.redhat.com/auth/realms/redhat-external/protocol/openid-connect/certs
        - name: identity.oidcIssuers[1].audience
          value: api.ask_red_hat
        # PHASE 2 B1 (ACTIVATED): per-spoke Praxis spoke-gateways. The
        # kube-API pass-through and oauth-delegator spikes PASSED on the
        # pinned image (local podman runtime verification -- see
        # charts/all/praxis-proxy/README.md "Spoke gateways (B1,
        # proposed)" for the remaining live-cluster items). The hub
        # cluster doubles as its own spoke ("hub"): the remote API is the
        # hub's own API server:
        - name: spokeGateways.hub.remoteAPIServer
          value: https://api.cluster-jq8zh.dyn.redhatworkshops.io:6443
        - name: spokeGateways.hub.exchangeAudience
          value: praxis-spoke-hub
        # Secret in the praxis-proxy namespace holding the hub API
        # server's CA bundle (key ca.crt) -- created manually from the
        # hub kubeconfig's certificate-authority-data (see the deployment
        # runbook A4); never commit the real CA to this repo.
        - name: spokeGateways.hub.remoteCACert.secretName
          value: praxis-spoke-hub-api-ca
        # Shared cross-spoke settings live in spokeGatewayConfig (NOT
        # under spokeGateways, which is purely per-spoke).
        # exchangeClient.clientId/secretName and the derived token URL
        # default correctly (praxis-spoke-gateway / praxis-spoke-gateway-client,
        # <keycloak-issuer>/protocol/openid-connect/token); override only
        # to diverge.
        # - name: spokeGatewayConfig.exchangeClient.clientId
        #   value: praxis-spoke-gateway
        # The sandbox namespaces allowed to reach the gateways' 8443
        # listeners: the lightspeed-hub run namespace (where repo C's
        # sandboxes run on this deployment -- design-doc Q4 settled for
        # this variant):
        - name: spokeGatewayConfig.networkPolicy.ingressFromNamespaces[0]
          value: lightspeed-hub
        # TASK B REQUEST LEG (leg 2; ACTIVATED).
        # Front-door hop: forward the main gateway's A2A traffic to the hub
        # A2A adapter (charts/all/lightspeed-hub). DESIGN: Praxis validates
        # Token A + enforces caller x target (the allow-list IS the
        # spokeGateways keys above); the ADAPTER performs the A->H exchange.
        # Enabled together with the lightspeed-hub chart; adapter TLS
        # serving on 8443 (service cert) is wired in that chart.
        - name: a2aUpstream.enabled
          value: "true"
        # Defaults line up with the lightspeed-hub chart's adapter Service
        # (lightspeed-hub.lightspeed-hub.svc.cluster.local:8443) and its
        # adapter.targetHeader (X-Hub-Cluster, the adapter's
        # --target-header flag); override only to diverge:
        # - name: a2aUpstream.service
        #   value: lightspeed-hub
        # - name: a2aUpstream.namespace
        #   value: lightspeed-hub
        # - name: a2aUpstream.port
        #   value: "8443"
        # - name: a2aUpstream.targetHeader
        #   value: X-Hub-Cluster
        # NOT SUPPORTED (render fails loudly): Praxis-side A->H exchange.
        # Blocked on the pinned image by the protected-A handoff (it would
        # hide Token A from the adapter, which needs A for the run leg) --
        # see charts/all/praxis-proxy/values.yaml a2aUpstream comment.
        # - name: a2aUpstream.exchangeAtPraxis
        #   value: "false"
        # TASK B REQUEST LEG (leg 1 -- the MAS blueprint side; DISABLED --
        # everything commented). Once the front door above is enabled, the
        # persisted MAS blueprint must route investigation delegations
        # through it. Re-run setup-mas-blueprint.sh with these env vars
        # (they are script inputs, NOT chart values -- recorded here so the
        # cutover runbook has one place listing every knob), then pin the
        # returned blueprintId in mao-a2a's a2a.blueprintId below (the G3
        # cutover):
        #   export HUB_ADAPTER_A2A_URL="https://praxis-proxy.apps.<cluster-domain>/a2a"
        #   #   ^ the Praxis PUBLIC route (front door), never the adapter's
        #   #     internal Service -- Praxis validates Token A and routes on
        #   #     X-Hub-Cluster; empty (default) omits the investigation node.
        #   export HUB_ADAPTER_AGENT_NAME="Hub Cluster Investigator"
        #   export HUB_ADAPTER_TARGET_HEADER="X-Hub-Cluster"
        #   #   ^ must equal a2aUpstream.targetHeader above
        #   export HUB_ADAPTER_CLUSTERS="east,west"
        #   #   ^ closed list of target cluster names; must equal the
        #   #     spokeGateways keys above (and lightspeed-hub's
        #   #     adapter.allowedTargets). With it set, the orchestrator
        #   #     prompt enumerates the list and the model may only target
        #   #     a listed name, copied verbatim into the delegate_task
        #   #     data.headers value. Empty: the adapter's fail-fast
        #   #     unknown-target message (its --allowed-targets flag) is
        #   #     the only spelling guard.
        #   ./setup-mas-blueprint.sh --dry-run multi-cluster  # inspect first
        #   ./setup-mas-blueprint.sh multi-cluster
        # KNOWN LIMITATION (design §4.2 deviation): the header NAME is
        # model-spelled in the delegate_task data argument (MAS has no
        # node-config header mechanism); mitigated by temperature 0 + the
        # prompt's exact-spelling rule. See setup-mas-blueprint.sh's header
        # comment and charts/all/mao/mas-a2a/README.md.
        # Serving-CA bridge: repo C's gatewayCASecret expects a Secret
        # (key ca.crt) in ITS OPERATOR NAMESPACE -- targetNamespace set to
        # the lightspeed-hub run namespace, matching where the operator
        # and sandboxes run. The sync job/CronJob keeps it current across
        # service-CA rotation.
        - name: spokeGatewayConfig.servingCA.targetNamespace
          value: lightspeed-hub
    acme-agent:
      name: acme-agent
      namespace: acme-agent
      argoProject: hub
      path: charts/all/acme-agent
      ignoreDifferences:
        - group: apps
          kind: Deployment
          name: acme-agent
          namespace: acme-agent
          jsonPointers:
            - /spec/template/metadata/annotations/ca-bundle-sync-sha256
      overrides:
        - name: image.repository
          value: quay.io/ltomasbo/acme-agent
        - name: image.tag
          # Quoted: this is an all-digit git short SHA, and an unquoted
          # numeric-looking YAML scalar this large gets parsed as a number
          # and can come back out the other side of Helm/Argo's rendering
          # pipeline re-serialized in scientific notation (confirmed live:
          # it became "3.425697e+07", which then fails to parse as an image
          # reference -- InvalidImageName). Always quote tags that could be
          # all-digits.
          # Post-Task-A rebuild (OLS/cluster-routing code removed): built
          # from agents/acme_agent at git short SHA ea132e00.
          value: "ea132e00"
        # Trust the cluster's managed ingress CA for the HTTPS Praxis route
        # and Keycloak token endpoint, keeping certificate verification on.
        - name: auth.caBundleConfigMap.name
          value: acme-agent-ingress-ca
        - name: auth.caBundleConfigMap.key
          value: ca-bundle.crt
        - name: auth.caBundleSync.enabled
          value: "true"
        # ACME routes to MAS A2A directly. Must be a valid Python identifier
        # (ADK RemoteA2aAgent): use underscores, not hyphens.
        - name: a2a.remoteAgents[0].name
          value: mas_orchestrator
        - name: a2a.remoteAgents[0].description
          value: "MAO workflow for Red Hat questions, including product/project/documentation guidance through Ask Red Hat. Use for all Red Hat-related requests; MAO selects the appropriate specialist(s)."
        - name: a2a.remoteAgents[0].endpoint
          value: "https://mao-a2a-mas-a2a-mao.apps.cluster-jq8zh.dyn.redhatworkshops.io"
        # Allow 60s beyond the analysis for polling and returning the
        # final A2A response.
        - name: a2a.requestTimeout
          value: "1260"
        - name: auth.mode
          value: keycloak
        # Debug-only: the UI generates a private, unguessable nonce and can
        # retrieve the selected outbound bearer token once from that request.
        # Disable this when not actively inspecting tokens.
        - name: auth.tokenDebug.enabled
          value: "true"
        - name: auth.tokenDebug.ttlSeconds
          value: "300"
        # Test-only: paste a token (e.g. one copied from the debug view above)
        # for the next request, to exercise expiry and renewal paths. Disable
        # outside test environments.
        - name: auth.tokenOverride.enabled
          value: "true"
        # auth.keycloak.issuerUrl and .tokenUrl derive from
        # global.clusterBaseDomain + global.keycloakRealm (the token URL is the
        # issuer + /protocol/openid-connect/token); override only to diverge.
        - name: auth.keycloak.clientId
          value: acme-agent
        - name: identity.spiffe.enabled
          value: "true"
        - name: identity.clusterSpiffeID.enabled
          value: "true"
        # identity.clusterSpiffeID.trustDomain derives from
        # global.clusterBaseDomain (apps.<base>), which is exactly the cluster's
        # trust domain (see the zero-trust-workload-identity-manager application's
        # comment above); override only to diverge.

        # Optional Red Hat IdP agent-token mode. Uncomment only after creating
        # confidential SSO clients in both environments and storing both their
        # client IDs and secrets in Vault (see values-secret.yaml.template).
        # Add each token's sub/user_id to MAS's
        # a2a.allowedPrincipals before enabling it. User-token mode is a TODO.
        #
        - name: auth.redhatSso.enabled
          value: "true"
        - name: auth.redhatSso.scope
          value: openid api.ask_red_hat
        - name: auth.redhatSso.production.tokenUrl
          value: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
        - name: auth.redhatSso.stage.tokenUrl
          value: https://sso.stage.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
        - name: route.enabled
          value: "true"
        # Allow the browser's A2A request to survive the long-running analysis.
        - name: route.timeout
          value: 22m
        - name: litellm.apiBase
          value: https://maas-rhdp.apps.maas.redhatworkshops.io/v1
          #value: ""
        - name: litellm.model
          #value: openai/gpt-oss-20b
          value: openai/gpt-oss-120b
          #value: gemini/gemini-3.8-flash
