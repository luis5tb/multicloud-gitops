# Ask Red Hat egress gateway -- PRODUCTION (docs/EXTERNAL_IDP_EGRESS.md).
# To switch, replace ...-stage.yaml with this file in the praxis-proxy app's
# extraValueFiles (values-standalone.yaml). Nothing changes in MAS.
#
# Credentials: client ID AND secret both come from the Vault record below
# (properties client-id and client-secret), so this file holds no
# credentials at all. The record must hold the real production client
# before switching -- on 2026-11-26 it still held a placeholder
# (client-id "fake-client"). The secret must be alphanumeric (the delegator
# sends HTTP Basic without URL-encoding); the client ID must match
# [A-Za-z0-9._-] (the gateway's init container refuses anything else).
#
# upstreamURL VERIFIED 2026-11-26 (the production card advertises
# https://access.redhat.com/api/ask/v1/a2a/).
egressGateways:
  ask-red-hat:
    upstreamURL: https://access.redhat.com/api/ask/v1/a2a
    tokenUrl: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
    audience: api.ask_red_hat
    scopes:
      - openid
      - api.ask_red_hat
    clientSecret:
      # Same Vault record as ACME's production Red Hat SSO credentials.
      vaultKey: secret/data/global/acme-agent-redhat-sso-production
